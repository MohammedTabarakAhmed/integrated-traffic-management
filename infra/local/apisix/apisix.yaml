plugin_configs:
  - id: protected-api
    plugins:
      openid-connect:
        discovery: http://keycloak:8080/realms/itms/.well-known/openid-configuration
        # Bearer-only token check against the realm's published keys: no login redirect, no introspection call, so
        # the client credentials below are never sent to Keycloak. The plugin's schema requires them; the value is
        # not a secret.
        client_id: itms-gateway
        client_secret: bearer-only-not-used
        bearer_only: true
        use_jwks: true
        realm: itms
        set_userinfo_header: false
        set_access_token_header: false
      limit-count:
        count: 600
        time_window: 60
        key_type: var
        key: remote_addr
        policy: local
        rejected_code: 429
        show_limit_quota_header: true
      prometheus:
        prefer_name: true
  # Deliberately public pages (CC-083 certificate verification): no token, a tight per-address limit against
  # enumeration (the verification code is also required by the service).
  - id: public-api
    plugins:
      limit-count:
        count: 30
        time_window: 60
        key_type: var
        key: remote_addr
        policy: local
        rejected_code: 429
        show_limit_quota_header: true
      prometheus:
        prefer_name: true

global_rules:
  - id: correlation-id
    plugins:
      request-id:
        header_name: X-Correlation-Id
        include_in_response: true
        algorithm: uuid

