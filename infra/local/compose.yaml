      DOC_DB_URL: jdbc:postgresql://document-postgres:5432/document
      # Object store (ADR-005: MinIO locally) and malware scanner (CC-081: ClamAV); keys are secret files below.
      ITMS_DOCUMENTS_STORE_ENDPOINT: http://minio:9000
      ITMS_DOCUMENTS_STORE_BUCKET: itms-documents
      ITMS_DOCUMENTS_SCANNER_HOST: clamav
      ITMS_DOCUMENTS_VERIFICATION_URL: http://localhost:9080/v1/certificate-verifications
      # Short-lived login from OpenBao (ADR-039), files under /run/secrets/spring/datasource; owner role on connect.
      SPRING_DATASOURCE_HIKARI_CONNECTIONINITSQL: SET ROLE itms_owner
      ITMS_OIDC_ISSUER: http://localhost:8180/realms/itms
      ITMS_OIDC_JWKS_URI: http://keycloak:8080/realms/itms/protocol/openid-connect/certs
      ITMS_AUTHORISATION_SOURCE: iam
      ITMS_IAM_URL: http://iam-service:8080
    secrets:
      - source: minio_access_key
        target: itms.documents.store.access-key
      - source: minio_secret_key
        target: itms.documents.store.secret-key
    volumes:
      - type: volume
        source: db-credentials
        target: /run/secrets/spring/datasource
        read_only: true
        volume:
          subpath: document-service
    ports:
      - "127.0.0.1:8091:8080"
    depends_on:
      bao-agent:
        condition: service_healthy
      otel-collector:
        condition: service_started
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
      document-postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      iam-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/actuator/health/readiness | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ---- Object store (ADR-005; MinIO stands in for Ceph RGW) and malware scanner (CC-081). Local development only.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_access_key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_secret_key
    secrets:
      - minio_access_key
      - minio_secret_key
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: ["sh", "-c", "mc alias set local http://minio:9000 \"$$(cat /run/secrets/minio_access_key)\" \"$$(cat /run/secrets/minio_secret_key)\" && mc mb --ignore-existing local/itms-documents"]
    secrets:
      - minio_access_key
      - minio_secret_key
    depends_on:
      minio:
        condition: service_healthy

  clamav:
    image: clamav/clamav:1.4.3
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s

  appointment-service:
    build: ../../services/appointment-service
    environment:
      <<: [*itms-observability, *itms-events]
      APPT_DB_URL: jdbc:postgresql://appointment-postgres:5432/appointment
      # Short-lived login from OpenBao (ADR-039), files under /run/secrets/spring/datasource; owner role on connect.
      SPRING_DATASOURCE_HIKARI_CONNECTIONINITSQL: SET ROLE itms_owner
      ITMS_OIDC_ISSUER: http://localhost:8180/realms/itms
      ITMS_OIDC_JWKS_URI: http://keycloak:8080/realms/itms/protocol/openid-connect/certs
      ITMS_AUTHORISATION_SOURCE: iam
      ITMS_IAM_URL: http://iam-service:8080
    volumes:
      - type: volume
        source: db-credentials
        target: /run/secrets/spring/datasource
        read_only: true
        volume:
          subpath: appointment-service
    ports:
      - "127.0.0.1:8092:8080"
    depends_on:
      bao-agent:
        condition: service_healthy
      otel-collector:
        condition: service_started
      kafka:
        condition: service_healthy
      appointment-postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      iam-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/actuator/health/readiness | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30

  audit-service:
    build: ../../services/audit-service
    environment:
      <<: [*itms-observability, *itms-events]
      AUDIT_DB_URL: jdbc:postgresql://audit-postgres:5432/audit
      # Consumes every service's audit records from the local broker (CC-120).
      ITMS_AUDIT_CONSUMER_ENABLED: "true"
      # Short-lived login from OpenBao (ADR-039), files under /run/secrets/spring/datasource; owner role on connect.
      SPRING_DATASOURCE_HIKARI_CONNECTIONINITSQL: SET ROLE itms_owner
      ITMS_OIDC_ISSUER: http://localhost:8180/realms/itms
      ITMS_OIDC_JWKS_URI: http://keycloak:8080/realms/itms/protocol/openid-connect/certs
      ITMS_AUTHORISATION_SOURCE: iam
      ITMS_IAM_URL: http://iam-service:8080
    volumes:
      - type: volume
        source: db-credentials
        target: /run/secrets/spring/datasource
        read_only: true
        volume:
          subpath: audit-service
    ports:
      - "127.0.0.1:8093:8080"
    depends_on:
      bao-agent:
        condition: service_healthy
      otel-collector:
        condition: service_started
      kafka:
        condition: service_healthy
      audit-postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      iam-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/actuator/health/readiness | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30

  payment-service:
    build: ../../services/payment-service
    environment:
      <<: [*itms-observability, *itms-events]
      PAY_DB_URL: jdbc:postgresql://payment-postgres:5432/payment
      # Partner #20 mock (ICD-03 draft; infra/local/mocks/payment-gateway); callback key is the secret file below.
      ITMS_PAYMENTS_GATEWAY_URL: http://payment-gateway-mock:8080
      ITMS_PAYMENTS_CALLBACK_BASE_URL: http://localhost:9080
      # Short-lived login from OpenBao (ADR-039), files under /run/secrets/spring/datasource; owner role on connect.
      SPRING_DATASOURCE_HIKARI_CONNECTIONINITSQL: SET ROLE itms_owner
      ITMS_OIDC_ISSUER: http://localhost:8180/realms/itms
      ITMS_OIDC_JWKS_URI: http://keycloak:8080/realms/itms/protocol/openid-connect/certs
      ITMS_AUTHORISATION_SOURCE: iam
      ITMS_IAM_URL: http://iam-service:8080
    secrets:
      - source: payment_callback_key
        target: itms.payments.gateway.callback-keys
    volumes:
      - type: volume
        source: db-credentials
        target: /run/secrets/spring/datasource
        read_only: true
        volume:
          subpath: payment-service
    ports:
      - "127.0.0.1:8094:8080"
    depends_on:
      bao-agent:
        condition: service_healthy
      otel-collector:
        condition: service_started
      kafka:
        condition: service_healthy
      payment-postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      iam-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/actuator/health/readiness | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ---- Partner mocks (Gate C). Built from the ICDs; never used outside local development and tests.
  identity-register-mock:
    image: wiremock/wiremock:3.13.1
    command: ["--port", "8080", "--disable-banner"]
    volumes:
      - ./mocks/identity-register/mappings:/home/wiremock/mappings:ro

  licensing-authority-mock:
    image: wiremock/wiremock:3.13.1
    command: ["--port", "8080", "--disable-banner"]
    volumes:
      - ./mocks/licensing-authority/mappings:/home/wiremock/mappings:ro

  payment-gateway-mock:
    image: wiremock/wiremock:3.13.1
    command: ["--port", "8080", "--disable-banner", "--global-response-templating"]
    volumes:
      - ./mocks/payment-gateway/mappings:/home/wiremock/mappings:ro

  messaging-gateway-mock:
    image: wiremock/wiremock:3.13.1
    command: ["--port", "8080", "--disable-banner", "--global-response-templating"]
    volumes:
      - ./mocks/messaging-gateway/mappings:/home/wiremock/mappings:ro

  # ---- Message broker (INT-005, ADR-002, ADR-040). Local development only: one KRaft node, plain text, inside the
  # compose network (not published to the host). Real environments run >= 3 brokers per site with TLS and SASL.
  kafka:
    image: apache/kafka:4.2.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # ---- API gateway (INT-001, ADR-003, ADR-040). Every external call enters here: token check, /v1/ routing, rate
  # limits and usage metrics. Declarative (standalone) mode; routes are in apisix/apisix.yaml.
  apisix:
    image: apache/apisix:3.14.1-debian
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    ports:
      - "127.0.0.1:9080:9080"
    depends_on:
      keycloak:
        condition: service_healthy
      iam-service:
        condition: service_healthy
      reference-data-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
      hold-eligibility-service:
        condition: service_healthy
      traffic-file-service:
        condition: service_healthy
      fees-service:
        condition: service_healthy
      rules-service:
        condition: service_healthy
      workflow-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      document-service:
        condition: service_healthy
      appointment-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      # Ready once routes are loaded and the token check answers: an unauthenticated call gets 401.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9080 && printf 'GET /v1/roles HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 401 '"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ---- Secret store (SEC-004, ADR-014, ADR-039). Local development only: a dev-mode OpenBao (in memory, unsealed,
  # configured by tools/dev/up.sh on every start) and one agent writing each service's rotated database login.
  openbao:
    image: openbao/openbao:2.7.1
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${BAO_ROOT_TOKEN:?run tools/dev/up.sh} # dev mode only; never in real environments
    cap_add: [IPC_LOCK]
    volumes:
      - ./openbao/configure.sh:/etc/bao/configure.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "BAO_ADDR=http://127.0.0.1:8200 bao status >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      iam-postgres:
        condition: service_healthy
      transaction-postgres:
        condition: service_healthy
      hold-postgres:
        condition: service_healthy

  bao-agent:
    image: openbao/openbao:2.7.1
    entrypoint: ["bao"] # the image's entrypoint would drop root, which the shared volume needs
    command: ["agent", "-config=/etc/bao/agent.hcl"]
    user: "0" # writes the shared credentials volume; local development only
    volumes:
      - ./openbao/agent.hcl:/etc/bao/agent.hcl:ro
      - db-credentials:/run/db-credentials
    secrets:
      - bao_agent_token
    depends_on:
      openbao:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "for s in iam-service reference-data-service transaction-service hold-eligibility-service traffic-file-service fees-service rules-service workflow-service notification-service document-service appointment-service audit-service payment-service; do test -s /run/db-credentials/$$s/username && test -s /run/db-credentials/$$s/password || exit 1; done"]
      interval: 2s
      timeout: 3s
      retries: 30

  # ---- Observability (NFR-040, ADR-008, ADR-037). Local development only: single processes, local disks.
  otel-collector:
    image: otel/opentelemetry-collector:0.162.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo
      - loki

  tempo:
    image: grafana/tempo:2.10.8
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready | grep -q Ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    secrets:
      - grafana_admin_password
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

# Secrets (SEC-004, ADR-038): taken from the generated infra/local/.env on the host and mounted as files under
# /run/secrets/ in the containers, never set as container environment variables. In real environments the secret
# store delivers the same files (Kubernetes secrets through the external-secrets operator, ADR-014).
secrets:
  payment_callback_key:
    environment: DEV_PAYMENT_CALLBACK_KEY
  payment_db_password:
    environment: PAY_DB_PASSWORD
  audit_db_password:
    environment: AUDIT_DB_PASSWORD
  appointment_db_password:
    environment: APPT_DB_PASSWORD
  minio_access_key:
    environment: DEV_MINIO_ACCESS_KEY
  minio_secret_key:
    environment: DEV_MINIO_SECRET_KEY
  document_db_password:
    environment: DOC_DB_PASSWORD
  notification_db_password:
    environment: NOTIF_DB_PASSWORD
  workflow_db_password:
    environment: WORKFLOW_DB_PASSWORD
  rules_db_password:
    environment: RULES_DB_PASSWORD
  refdata_db_password:
    environment: REFDATA_DB_PASSWORD
  iam_db_password:
    environment: IAM_DB_PASSWORD
  txn_db_password:
    environment: TXN_DB_PASSWORD
  hold_db_password:
    environment: HOLD_DB_PASSWORD
  fees_db_password:
    environment: FEES_DB_PASSWORD
  tf_db_password:
    environment: TF_DB_PASSWORD
  transaction_service_client_secret:
    environment: DEV_TRANSACTION_SERVICE_SECRET
  grafana_admin_password:
    environment: GRAFANA_ADMIN_PASSWORD
  bao_agent_token: # minted by tools/dev/up.sh on every start (policy itms-db-agent: read database logins only)
    environment: BAO_AGENT_TOKEN

volumes:
  refdata-db:
  iam-db:
  transaction-db:
  hold-db:
  traffic-file-db:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:
  fees-db:
  rules-db:
  workflow-db:
  notification-db:
  document-db:
  minio-data:
  clamav-db:
  appointment-db:
  audit-db:
  payment-db:
  db-credentials:
  kafka-data:
