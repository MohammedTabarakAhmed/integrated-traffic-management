      # A map keyed by source code: set as JSON, because environment-variable binding would lower-case the keys.
      SPRING_APPLICATION_JSON: '{"itms":{"traffic-file":{"licensing":{"authorities":{"DXB_DED":"http://licensing-authority-mock:8080/dxb","AUH_ADDED":"http://licensing-authority-mock:8080/auh"}}}}}'
