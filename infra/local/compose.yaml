      ITMS_NOTIFICATIONS_SMS_GATEWAY_URL: http://messaging-gateway-mock:8080/sms
      ITMS_NOTIFICATIONS_EMAIL_GATEWAY_URL: http://messaging-gateway-mock:8080/email
