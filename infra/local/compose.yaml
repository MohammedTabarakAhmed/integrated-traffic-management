# Local development stack (NOT a production topology; see docs/HLD.md §8).
# Start with: tools/dev/up.sh   (generates infra/local/.env with random dev secrets on first run)
# All ports bind to 127.0.0.1 only.
name: itms

# Observability settings shared by every ITMS service (NFR-040, ADR-037): traces and logs to the collector, every
# trace sampled locally; probes and metrics on the management port 8090 (not published; Prometheus scrapes it).
# Event relay settings shared by every ITMS service (INT-005, ADR-040): outbox rows go to the local broker.
x-itms-events: &itms-events
  ITMS_EVENTS_ENABLED: "true"
  ITMS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

x-itms-observability: &itms-observability
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
  MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT: http://otel-collector:4318/v1/logs
  ITMS_TRACING_SAMPLING_PROBABILITY: "1.0"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: refdata
      POSTGRES_USER: ${REFDATA_DB_USER:?run tools/dev/up.sh}
      POSTGRES_PASSWORD_FILE: /run/secrets/refdata_db_password
    secrets:
      - refdata_db_password
    volumes:
      - refdata-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d refdata"]
      interval: 5s
      timeout: 3s
      retries: 20

  iam-postgres:
    # Separate database and credentials per service (ADR-001, ADR-016).
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: iam
      POSTGRES_USER: ${IAM_DB_USER:?run tools/dev/up.sh}
      POSTGRES_PASSWORD_FILE: /run/secrets/iam_db_password
    secrets:
      - iam_db_password
    volumes:
      - iam-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d iam"]
      interval: 5s
      timeout: 3s
      retries: 20

  transaction-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: transaction
      POSTGRES_USER: ${TXN_DB_USER:?run tools/dev/up.sh}
      POSTGRES_PASSWORD_FILE: /run/secrets/txn_db_password
    secrets:
      - txn_db_password
    volumes:
      - transaction-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d transaction"]
      interval: 5s
      timeout: 3s
      retries: 20

  hold-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hold
      POSTGRES_USER: ${HOLD_DB_USER:?run tools/dev/up.sh}
      POSTGRES_PASSWORD_FILE: /run/secrets/hold_db_password
    secrets:
      - hold_db_password
    volumes:
      - hold-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d hold"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:?run tools/dev/up.sh}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?run tools/dev/up.sh}
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/itms-realm.json:/opt/keycloak/data/import/itms-realm.json:ro
    ports:
      - "127.0.0.1:8180:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 40

  iam-service:
    build: ../../services/iam-service
    environment:
      <<: [*itms-observability, *itms-events]
      IAM_DB_URL: jdbc:postgresql://iam-postgres:5432/iam
      # Short-lived login from OpenBao (ADR-039), files under /run/secrets/spring/datasource; owner role on connect.
      SPRING_DATASOURCE_HIKARI_CONNECTIONINITSQL: SET ROLE itms_owner
      ITMS_OIDC_ISSUER: http://localhost:8180/realms/itms
      ITMS_OIDC_JWKS_URI: http://keycloak:8080/realms/itms/protocol/openid-connect/certs
      # First administrator of this environment (fixed id of dev.iam-admin in the local realm).
      ITMS_IAM_BOOTSTRAP_ADMIN_SUBJECT: 7d0c1a3e-5b2f-4c1d-9e8a-000000000001
      ITMS_IAM_BOOTSTRAP_ADMIN_USERNAME: dev.iam-admin
    volumes:
      - type: volume
        source: db-credentials
        target: /run/secrets/spring/datasource
        read_only: true
        volume:
          subpath: iam-service
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      bao-agent:
        condition: service_healthy
      otel-collector:
        condition: service_started
      kafka:
        condition: service_healthy
      iam-postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/actuator/health/readiness | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30

  reference-data-service:
    build: ../../services/reference-data-service
    environment:
      <<: [*itms-observability, *itms-events]
      REFDATA_DB_URL: jdbc:postgresql://postgres:5432/refdata
      # Short-lived login from OpenBao (ADR-039), files under /run/secrets/spring/datasource; owner role on connect.
      SPRING_DATASOURCE_HIKARI_CONNECTIONINITSQL: SET ROLE itms_owner
      ITMS_OIDC_ISSUER: http://localhost:8180/realms/itms
      ITMS_OIDC_JWKS_URI: http://keycloak:8080/realms/itms/protocol/openid-connect/certs
      ITMS_AUTHORISATION_SOURCE: iam
      ITMS_IAM_URL: http://iam-service:8080
    volumes:
      - type: volume
        source: db-credentials
        target: /run/secrets/spring/datasource
        read_only: true
        volume:
          subpath: reference-data-service
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      bao-agent:
        condition: service_healthy
      otel-collector:
        condition: service_started
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      iam-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/actuator/health/readiness | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30

  transaction-service:
    build: ../../services/transaction-service
    environment:
      <<: [*itms-observability, *itms-events]
      TXN_DB_URL: jdbc:postgresql://transaction-postgres:5432/transaction
      # Short-lived login from OpenBao (ADR-039), files under /run/secrets/spring/datasource; owner role on connect.
      SPRING_DATASOURCE_HIKARI_CONNECTIONINITSQL: SET ROLE itms_owner
      ITMS_OIDC_ISSUER: http://localhost:8180/realms/itms
      ITMS_OIDC_JWKS_URI: http://keycloak:8080/realms/itms/protocol/openid-connect/certs
      ITMS_AUTHORISATION_SOURCE: iam
      ITMS_IAM_URL: http://iam-service:8080
      # Eligibility at submission (CC-032, ADR-034): own client-credentials account; secret set by tools/dev/up.sh.
      ITMS_ELIGIBILITY_URL: http://hold-eligibility-service:8080
      ITMS_OIDC_TOKEN_URI: http://keycloak:8080/realms/itms/protocol/openid-connect/token
      ITMS_SERVICE_CLIENT_ID: itms-transaction-service
      # its secret is the file itms.clients.eligibility.client-secret (below), not an environment variable
    secrets:
      - source: transaction_service_client_secret
        target: itms.clients.eligibility.client-secret
    volumes:
      - type: volume
        source: db-credentials
        target: /run/secrets/spring/datasource
        read_only: true
        volume:
          subpath: transaction-service
    ports:
      - "127.0.0.1:8083:8080"
    depends_on:
      bao-agent:
        condition: service_healthy
      otel-collector:
        condition: service_started
      kafka:
        condition: service_healthy
      transaction-postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      iam-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/actuator/health/readiness | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30

  hold-eligibility-service:
    build: ../../services/hold-eligibility-service
    environment:
      <<: [*itms-observability, *itms-events]
      HOLD_DB_URL: jdbc:postgresql://hold-postgres:5432/hold
      # Short-lived login from OpenBao (ADR-039), files under /run/secrets/spring/datasource; owner role on connect.
      SPRING_DATASOURCE_HIKARI_CONNECTIONINITSQL: SET ROLE itms_owner
      ITMS_OIDC_ISSUER: http://localhost:8180/realms/itms
      ITMS_OIDC_JWKS_URI: http://keycloak:8080/realms/itms/protocol/openid-connect/certs
      ITMS_AUTHORISATION_SOURCE: iam
      ITMS_IAM_URL: http://iam-service:8080
    volumes:
      - type: volume
        source: db-credentials
        target: /run/secrets/spring/datasource
        read_only: true
        volume:
          subpath: hold-eligibility-service
    ports:
      - "127.0.0.1:8084:8080"
    depends_on:
      bao-agent:
        condition: service_healthy
      otel-collector:
        condition: service_started
      kafka:
        condition: service_healthy
      hold-postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      iam-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/actuator/health/readiness | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ---- Message broker (INT-005, ADR-002, ADR-040). Local development only: one KRaft node, plain text, inside the
  # compose network (not published to the host). Real environments run >= 3 brokers per site with TLS and SASL.
  kafka:
    image: apache/kafka:4.2.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # ---- API gateway (INT-001, ADR-003, ADR-040). Every external call enters here: token check, /v1/ routing, rate
  # limits and usage metrics. Declarative (standalone) mode; routes are in apisix/apisix.yaml.
  apisix:
    image: apache/apisix:3.14.1-debian
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    ports:
      - "127.0.0.1:9080:9080"
    depends_on:
      keycloak:
        condition: service_healthy
      iam-service:
        condition: service_healthy
      reference-data-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy
      hold-eligibility-service:
        condition: service_healthy
    healthcheck:
      # Ready once routes are loaded and the token check answers: an unauthenticated call gets 401.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9080 && printf 'GET /v1/roles HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 401 '"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ---- Secret store (SEC-004, ADR-014, ADR-039). Local development only: a dev-mode OpenBao (in memory, unsealed,
  # configured by tools/dev/up.sh on every start) and one agent writing each service's rotated database login.
  openbao:
    image: openbao/openbao:2.7.1
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${BAO_ROOT_TOKEN:?run tools/dev/up.sh} # dev mode only; never in real environments
    cap_add: [IPC_LOCK]
    volumes:
      - ./openbao/configure.sh:/etc/bao/configure.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "BAO_ADDR=http://127.0.0.1:8200 bao status >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      iam-postgres:
        condition: service_healthy
      transaction-postgres:
        condition: service_healthy
      hold-postgres:
        condition: service_healthy

  bao-agent:
    image: openbao/openbao:2.7.1
    entrypoint: ["bao"] # the image's entrypoint would drop root, which the shared volume needs
    command: ["agent", "-config=/etc/bao/agent.hcl"]
    user: "0" # writes the shared credentials volume; local development only
    volumes:
      - ./openbao/agent.hcl:/etc/bao/agent.hcl:ro
      - db-credentials:/run/db-credentials
    secrets:
      - bao_agent_token
    depends_on:
      openbao:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "for s in iam-service reference-data-service transaction-service hold-eligibility-service; do test -s /run/db-credentials/$$s/username && test -s /run/db-credentials/$$s/password || exit 1; done"]
      interval: 2s
      timeout: 3s
      retries: 30

  # ---- Observability (NFR-040, ADR-008, ADR-037). Local development only: single processes, local disks.
  otel-collector:
    image: otel/opentelemetry-collector:0.162.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo
      - loki

  tempo:
    image: grafana/tempo:2.10.8
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready | grep -q Ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    secrets:
      - grafana_admin_password
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

# Secrets (SEC-004, ADR-038): taken from the generated infra/local/.env on the host and mounted as files under
# /run/secrets/ in the containers, never set as container environment variables. In real environments the secret
# store delivers the same files (Kubernetes secrets through the external-secrets operator, ADR-014).
secrets:
  refdata_db_password:
    environment: REFDATA_DB_PASSWORD
  iam_db_password:
    environment: IAM_DB_PASSWORD
  txn_db_password:
    environment: TXN_DB_PASSWORD
  hold_db_password:
    environment: HOLD_DB_PASSWORD
  transaction_service_client_secret:
    environment: DEV_TRANSACTION_SERVICE_SECRET
  grafana_admin_password:
    environment: GRAFANA_ADMIN_PASSWORD
  bao_agent_token: # minted by tools/dev/up.sh on every start (policy itms-db-agent: read database logins only)
    environment: BAO_AGENT_TOKEN

volumes:
  refdata-db:
  iam-db:
  transaction-db:
  hold-db:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:
  db-credentials:
  kafka-data:
