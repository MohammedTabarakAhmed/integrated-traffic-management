        condition: service_started
      kafka:
        condition: service_healthy
      hold-postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      iam-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/actuator/health/readiness | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30

  traffic-file-service:
    build: ../../services/traffic-file-service
    mem_limit: ${ITMS_SERVICE_MEM_LIMIT:-512m}
