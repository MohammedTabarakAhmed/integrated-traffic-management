# Local development stack (NOT a production topology; see docs/HLD.md §8).
# Start with: tools/dev/up.sh   (generates infra/local/.env with random dev secrets on first run)
# All ports bind to 127.0.0.1 only.
name: itms

# Observability settings shared by every ITMS service (NFR-040, ADR-037): traces and logs to the collector, every
# trace sampled locally; probes and metrics on the management port 8090 (not published; Prometheus scrapes it).
# Event relay settings shared by every ITMS service (INT-005, ADR-040): outbox rows go to the local broker.
x-itms-events: &itms-events
  ITMS_EVENTS_ENABLED: "true"
  ITMS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

x-itms-observability: &itms-observability
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
  MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT: http://otel-collector:4318/v1/logs
  ITMS_TRACING_SAMPLING_PROBABILITY: "1.0"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: refdata
      POSTGRES_USER: ${REFDATA_DB_USER:?run tools/dev/up.sh}
      POSTGRES_PASSWORD_FILE: /run/secrets/refdata_db_password
    secrets:
      - refdata_db_password
    volumes:
      - refdata-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d refdata"]
      interval: 5s
      timeout: 3s
      retries: 20

  iam-postgres:
    # Separate database and credentials per service (ADR-001, ADR-016).
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: iam
      POSTGRES_USER: ${IAM_DB_USER:?run tools/dev/up.sh}
      POSTGRES_PASSWORD_FILE: /run/secrets/iam_db_password
    secrets:
