# OpenTelemetry Collector, local development (NFR-040, ADR-008, ADR-037).
# Services send traces and logs over OTLP/HTTP; the collector forwards traces to Tempo and logs to Loki.
# Metrics are not sent here: Prometheus scrapes each service's management port.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch: {}

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true # local network only; TLS 1.3 between tiers in real environments (SECURITY_DESIGN)
  otlp_http/loki:
    endpoint: http://loki:3100/otlp

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]
