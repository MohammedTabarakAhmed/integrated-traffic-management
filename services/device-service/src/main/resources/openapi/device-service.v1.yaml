openapi: 3.1.0
info:
  title: ITMS Device Service
  version: 1.0.0
  description: |
    Enforcement device registry, calibration history and screened capture intake (VF-010..VF-013, VF-080..VF-082).
    Captures are deduplicated by source key. Captures that fail plate, image, calibration or responsible-party checks
    remain in the review queue. Approved captures are recorded in violation-service using the same idempotency key.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /v1/devices:
    post:
      operationId: registerDevice
      summary: Register an enforcement device (VF-080)
      tags: [Devices]
      x-itms-permission: device.manage
      x-itms-scope: [region]
      security: [{bearerAuth: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeviceRequest'}
      responses:
        '201': {description: Registered device, content: {application/json: {schema: {$ref: '#/components/schemas/Device'}}}}
        '409': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listDevices
      summary: Enforcement devices in a region (VF-080)
      tags: [Devices]
      x-itms-permission: device.read
      x-itms-scope: [region]
      parameters:
        - in: query
          name: region
          required: true
          schema: {type: string}
      responses:
        '200': {description: Devices visible in the region, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Device'}}}}}}}
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/devices/{code}/calibrations:
    post:
      operationId: recordDeviceCalibration
      summary: Record a device calibration and its validity (VF-082)
      tags: [Devices]
      x-itms-permission: device.manage
      x-itms-scope: [region]
      parameters:
        - in: path
          name: code
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [validFrom, validUntil]
              properties:
                validFrom: {type: string, format: date-time}
                validUntil: {type: string, format: date-time}
      responses:
        '200': {description: Calibration recorded, content: {application/json: {schema: {$ref: '#/components/schemas/Device'}}}}
        '404': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/device-captures:
    post:
      operationId: ingestDeviceCapture
      summary: A device reports a capture; good ones become violations, others wait for review (VF-010, VF-011)
      tags: [Captures]
      x-itms-permission: device.capture.ingest
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CaptureRequest'}
      responses:
        '503': { $ref: '#/components/responses/Problem' }
        '201': {description: Capture accepted or queued for review, content: {application/json: {schema: {$ref: '#/components/schemas/Capture'}}}}
        '422': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/device-captures/review-queue:
    get:
      operationId: listCaptureReviewQueue
      summary: Device captures awaiting quality review (VF-081)
      tags: [Captures]
      x-itms-permission: device.capture.review
      x-itms-scope: [region]
      parameters:
        - in: query
          name: region
          required: true
          schema: {type: string}
        - in: query
          name: limit
          schema: {type: integer, default: 100, minimum: 1, maximum: 1000}
      responses:
        '422': { $ref: '#/components/responses/Problem' }
        '200': {description: Captures that need manual review, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Capture'}}}}}}}
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/device-captures/{id}/reviews:
    post:
      operationId: reviewDeviceCapture
      summary: Accept or reject a capture in the quality queue (VF-081)
      tags: [Captures]
      x-itms-permission: device.capture.review
      x-itms-scope: [region]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accept]
              properties:
                accept: {type: boolean}
                ownerFileNumber: {type: string, maxLength: 60}
      responses:
        '503': { $ref: '#/components/responses/Problem' }
        '200': {description: Capture accepted or rejected, content: {application/json: {schema: {$ref: '#/components/schemas/Capture'}}}}
        '404': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
components:
  responses:
    Problem:
      description: Problem details (RFC 9457) in Arabic or English
      content:
        application/problem+json:
          schema:
            type: object
            additionalProperties: true
            required: [status, code]
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              code: { type: string }
              detail: { type: string }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
  schemas:
    Device:
      type: object
      required: [id, code, type, owner, region, latitude, longitude, road, direction, speedLimitKmh, status, createdAt, createdBy]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        type: {type: string, enum: [RADAR, RED_LIGHT_CAMERA, MOBILE_CAMERA]}
        owner: {type: string}
        region: {type: string}
        latitude: {type: number}
        longitude: {type: number}
        road: {type: string}
        direction: {type: string}
        speedLimitKmh: {type: integer}
        status: {type: string, enum: [ACTIVE, SUSPENDED, RETIRED]}
        calibratedAt: {type: [string, 'null'], format: date-time}
        calibrationExpiresAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        createdBy: {type: string}
    Capture:
      type: object
      required: [id, sourceKey, deviceCode, capturedAt, catalogueCode, region, plate, location, speedLimitKmh, evidenceId, status, qualityReasons, receivedAt]
      properties:
        id: {type: string, format: uuid}
        sourceKey: {type: string}
        deviceCode: {type: string}
        capturedAt: {type: string, format: date-time}
        catalogueCode: {type: string}
        region: {type: string}
        plate: {type: string}
        location: {type: string}
        speedLimitKmh: {type: integer}
        measuredSpeedKmh: {type: [integer, 'null']}
        evidenceId: {type: string}
        ownerFileNumber: {type: [string, 'null']}
        status: {type: string, enum: [REVIEW, READY, RECORDED, REJECTED]}
        qualityReasons: {type: array, items: {type: string}}
        violationNumber: {type: [string, 'null']}
        receivedAt: {type: string, format: date-time}
    DeviceRequest:
      type: object
      additionalProperties: false
      required: [code, type, owner, region, latitude, longitude, road, direction, speedLimitKmh]
      properties:
        code: {type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{0,39}$'}
        type: {type: string, enum: [RADAR, RED_LIGHT_CAMERA, MOBILE_CAMERA]}
        owner: {type: string, maxLength: 100}
        region: {type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{0,39}$'}
        latitude: {type: number, minimum: -90, maximum: 90}
        longitude: {type: number, minimum: -180, maximum: 180}
        road: {type: string, maxLength: 120}
        direction: {type: string, maxLength: 40}
        speedLimitKmh: {type: integer, minimum: 5, maximum: 200}
    CaptureRequest:
      type: object
      additionalProperties: false
      required: [sourceKey, deviceCode, capturedAt, catalogueCode, region, plate, location, evidenceId,
        plateReadable, imagePresent]
      properties:
        sourceKey: {type: string, maxLength: 120}
        deviceCode: {type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{0,39}$'}
        capturedAt: {type: string, format: date-time}
        catalogueCode: {type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{0,39}$'}
        region: {type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{0,39}$'}
        plate: {type: string, maxLength: 20}
        location: {type: string, maxLength: 300}
        measuredSpeedKmh: {type: integer, minimum: 0, maximum: 500}
        evidenceId: {type: string, maxLength: 64}
        ownerFileNumber: {type: string, maxLength: 60}
        plateReadable: {type: boolean}
        imagePresent: {type: boolean}
