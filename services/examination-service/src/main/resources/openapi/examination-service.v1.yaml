      - Examination
      operationId: recordPracticalResult
      summary: The assigned examiner records a road or yard result, offline-sync safe (DL-034, DL-035, DL-037, DL-038)
      x-itms-permission: exam.result.record
      x-itms-scope:
      - region
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PracticalRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /v1/result-exceptions:
    get:
      tags:
      - Examination
      operationId: listResultExceptions
      summary: Open flagged results of a region for supervisor review (DL-037)
      x-itms-permission: exam.exception.decide
      x-itms-scope:
      - region
      parameters:
      - name: region
        in: query
        required: true
        schema:
          type: string
          pattern: ^[A-Z0-9_]{1,40}$
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionCollection'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /v1/result-exceptions/{id}/decisions:
    post:
      tags:
      - Examination
      operationId: decideResultException
      summary: Accept or reject a flagged result; a rejected pass does not count (DL-037)
      x-itms-permission: exam.exception.decide
      x-itms-scope:
      - region
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionItem'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9._:-]{8,128}$
  responses:
    Problem:
      description: The request was refused
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          maxLength: 300
        title:
          type: string
          maxLength: 300
        status:
          type: integer
        detail:
          type: string
          maxLength: 2000
        instance:
          type: string
          maxLength: 1000
        code:
          type: string
          maxLength: 80
        requirementRefs:
          type: array
          items:
            type: string
            maxLength: 20
        correlationId:
          type: string
          maxLength: 100
        errors:
          type: array
      additionalProperties: true
    SheetItem:
      type: object
      properties:
        code:
          type: string
          pattern: ^[A-Z0-9_]{1,40}$
        textNl:
          type: string
          maxLength: 300
        textEn:
          type: string
          maxLength: 300
        penalty:
          type: integer
          minimum: 0
          maximum: 1000
        critical:
          type: boolean
      required:
      - code
      - textNl
      - textEn
      - penalty
      - critical
      additionalProperties: false
    TestTypeRequest:
      type: object
      properties:
        kind:
          type: string
          enum:
          - THEORY
          - YARD
          - ROAD
        nameNl:
          type: string
          maxLength: 200
        nameEn:
          type: string
          maxLength: 200
        maxScore:
          type: integer
          minimum: 1
          maximum: 1000
        passMark:
          type: integer
          minimum: 1
          maximum: 1000
        retestWaitDays:
          type: integer
          minimum: 0
          maximum: 365
        feeServiceCode:
          type:
          - string
          - 'null'
          pattern: ^[A-Z0-9_]{1,40}$
        questionCount:
          type: integer
          minimum: 0
          maximum: 200
        sheet:
          type:
          - array
          - 'null'
          maxItems: 100
          items:
            $ref: '#/components/schemas/SheetItem'
        active:
          type: boolean
      required:
      - kind
      - nameNl
      - nameEn
      - maxScore
      - passMark
      - retestWaitDays
      - questionCount
      - active
      additionalProperties: false
    TestType:
      type: object
      properties:
        code:
          type: string
        kind:
          type: string
        nameNl:
          type: string
        nameEn:
          type: string
        maxScore:
          type: integer
        passMark:
          type: integer
        retestWaitDays:
          type: integer
        feeServiceCode:
          type:
          - string
          - 'null'
        questionCount:
          type: integer
        sheet:
          type: array
        active:
          type: boolean
      required:
      - code
      - kind
      - maxScore
      - passMark
      additionalProperties: true
    CertificateTypeRequest:
      type: object
      properties:
        nameNl:
          type: string
          maxLength: 200
        nameEn:
          type: string
          maxLength: 200
        hours:
          type: integer
          minimum: 1
          maximum: 500
      required:
      - nameNl
      - nameEn
      - hours
      additionalProperties: false
    CertificateType:
      type: object
      properties:
        code:
          type: string
        hours:
          type: integer
      required:
      - code
      additionalProperties: true
    QuestionRequest:
      type: object
      properties:
        language:
          type: string
          pattern: ^[a-z]{2}$
        category:
          type: string
          pattern: ^[A-Z0-9_]{1,40}$
        weight:
          type: integer
          minimum: 1
          maximum: 100
        text:
          type: string
          maxLength: 2000
        options:
          type: array
          minItems: 2
          maxItems: 6
          items:
            type: string
            maxLength: 500
        correctOption:
          type: integer
          minimum: 0
          maximum: 5
      required:
      - language
      - category
      - weight
      - text
      - options
      - correctOption
      additionalProperties: false
    QuestionCreated:
      type: object
      properties:
        id:
          type: string
          format: uuid
        testTypeCode:
          type: string
        language:
          type: string
        category:
          type: string
        weight:
          type: integer
      required:
      - id
      additionalProperties: true
    SchoolRequest:
      type: object
      properties:
        code:
          type: string
          pattern: ^[A-Z0-9_]{1,40}$
        nameNl:
          type: string
          maxLength: 200
        nameEn:
          type: string
          maxLength: 200
        region:
          type: string
          pattern: ^[A-Z0-9_]{1,40}$
      required:
      - code
      - nameNl
      - nameEn
      - region
      additionalProperties: false
    School:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        region:
          type: string
        status:
          type: string
      required:
      - id
      - code
      - region
      additionalProperties: true
    BranchRequest:
      type: object
      properties:
        code:
          type: string
          pattern: ^[A-Z0-9_]{1,40}$
        address:
          type: string
          maxLength: 500
        region:
          type: string
          pattern: ^[A-Z0-9_]{1,40}$
      required:
      - code
      - address
      - region
      additionalProperties: false
    Branch:
      type: object
      properties:
        id:
          type: string
          format: uuid
        schoolId:
          type: string
          format: uuid
        code:
          type: string
      required:
      - id
      additionalProperties: true
    VehicleRequest:
      type: object
      properties:
        plate:
          type: string
          maxLength: 40
        classCode:
          type: string
          pattern: ^[A-Z0-9_]{1,40}$
        dualControls:
          type: boolean
      required:
      - plate
      - classCode
      - dualControls
      additionalProperties: false
    SchoolVehicle:
      type: object
      properties:
        id:
          type: string
          format: uuid
        schoolId:
          type: string
          format: uuid
        plate:
          type: string
      required:
      - id
      additionalProperties: true
    InstructorRequest:
      type: object
      properties:
        userId:
          type:
          - string
          - 'null'
          maxLength: 100
        trafficFileNumber:
          type: string
          maxLength: 40
        grade:
          type: string
          pattern: ^[A-Z0-9_]{1,40}$
        classes:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            pattern: ^[A-Z0-9_]{1,40}$
      required:
      - trafficFileNumber
      - grade
      - classes
      additionalProperties: false
    Instructor:
      type: object
      properties:
        id:
          type: string
          format: uuid
        schoolId:
          type: string
          format: uuid
        grade:
          type: string
        classes:
          type: array
      required:
      - id
      additionalProperties: true
    ComplaintRequest:
      type: object
      properties:
        instructorId:
          type:
          - string
          - 'null'
          format: uuid
        summary:
          type: string
          maxLength: 1000
      required:
      - summary
      additionalProperties: false
    Created:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
      - id
      additionalProperties: true
    Rating:
      type: object
      properties:
        subjectId:
          type: string
          format: uuid
        learners:
          type: integer
        firstAttempts:
          type: integer
        firstPasses:
          type: integer
        complaints:
          type: integer
        passRatePerMille:
          type: integer
        complaintsPer100:
          type: integer
      required:
      - subjectId
      - passRatePerMille
      additionalProperties: true
    FileRequest:
      type: object
      properties:
        trafficFileNumber:
          type: string
          maxLength: 40
        classCode:
          type: string
          pattern: ^[A-Z0-9_]{1,40}$
        gearbox:
          type: string
          enum:
          - MANUAL
          - AUTOMATIC
        region:
          type: string
          pattern: ^[A-Z0-9_]{1,40}$
        schoolId:
          type:
          - string
          - 'null'
          format: uuid
        instructorId:
          type:
          - string
          - 'null'
          format: uuid
      required:
      - trafficFileNumber
      - classCode
      - gearbox
      - region
      additionalProperties: false
    LearningFile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        trafficFileNumber:
          type: string
        classCode:
          type: string
        gearbox:
          type: string
        region:
          type: string
        schoolId:
          type:
          - string
          - 'null'
          format: uuid
        instructorId:
          type:
          - string
          - 'null'
          format: uuid
        status:
          type: string
          enum:
          - OPEN
          - IN_TRAINING
          - READY_FOR_TEST
          - PASSED
          - FAILED
          - EXPIRED
          - CANCELLED
        failedAttempts:
          type: integer
        extraHoursRequired:
          type: integer
        trainingHours:
          type: integer
        openedAt:
          type: string
          format: date-time
        lastProgressAt:
          type: string
          format: date-time
        version:
          type: integer
      required:
      - id
      - number
      - status
      - region
      additionalProperties: true
    MoveRequest:
      type: object
      properties:
        action:
          type: string
          enum:
          - start-training
          - ready-for-test
          - cancel
        reason:
          type:
          - string
          - 'null'
          maxLength: 500
      required:
      - action
      additionalProperties: false
    TrainingRequest:
      type: object
      properties:
        instructorId:
          type:
          - string
          - 'null'
          format: uuid
        hours:
          type: integer
          minimum: 1
          maximum: 12
        certificateType:
          type:
          - string
          - 'null'
          pattern: ^[A-Z0-9_]{1,40}$
        heldOn:
          type: string
          format: date
      required:
      - hours
      - heldOn
      additionalProperties: false
    Result:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        fileId:
          type: string
          format: uuid
        testTypeCode:
          type: string
        examinerId:
          type:
          - string
          - 'null'
        clientResultId:
          type:
          - string
          - 'null'
        score:
          type: integer
        passed:
          type: boolean
        faults:
          type: array
          items:
            type: string
        recordedAt:
          type: string
          format: date-time
        firstAttempt:
          type: boolean
        exceptions:
          type: array
          items:
            type: string
      required:
      - id
      - bookingId
      - score
      - passed
      - exceptions
      additionalProperties: true
    ResultCollection:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Result'
      required:
      - items
      additionalProperties: true
    TransferView:
      type: object
      properties:
        status:
          type: string
          enum:
          - PENDING
          - SENT
        attempts:
          type: integer
        licensingTransferId:
          type:
          - string
          - 'null'
      required:
      - status
      additionalProperties: true
    Member:
      type: object
      properties:
        userId:
          type: string
          maxLength: 100
        role:
          type: string
          enum:
          - HEAD
          - EXAMINER
          - OBSERVER
      required:
      - userId
      - role
      additionalProperties: false
    CommitteeRequest:
      type: object
      properties:
        code:
          type: string
          pattern: ^[A-Z0-9_]{1,40}$
        location:
          type: string
          maxLength: 80
        region:
          type: string
          pattern: ^[A-Z0-9_]{1,40}$
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
        members:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/Member'
      required:
      - code
      - location
      - region
      - validFrom
      - validTo
      - members
      additionalProperties: false
    Committee:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        members:
          type: array
      required:
      - id
      additionalProperties: true
    SlotRequest:
      type: object
      properties:
        classCode:
          type: string
          pattern: ^[A-Z0-9_]{1,40}$
        testTypeCode:
          type: string
          pattern: ^[A-Z0-9_]{1,40}$
        startsAt:
          type: string
          format: date-time
        capacity:
          type: integer
          minimum: 1
          maximum: 500
      required:
      - classCode
      - testTypeCode
      - startsAt
      - capacity
      additionalProperties: false
    Slot:
      type: object
      properties:
        id:
          type: string
          format: uuid
        committeeId:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
        capacity:
          type: integer
        booked:
          type: integer
      required:
      - id
      additionalProperties: true
    SlotUsage:
      type: object
      properties:
        slotId:
          type: string
          format: uuid
        location:
          type: string
        classCode:
          type: string
        testTypeCode:
          type: string
        startsAt:
          type: string
          format: date-time
        capacity:
          type: integer
        booked:
          type: integer
        sat:
          type: integer
        noShows:
          type: integer
      required:
      - slotId
      - capacity
      - booked
      additionalProperties: true
    SlotUsageCollection:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SlotUsage'
      required:
      - items
      additionalProperties: true
    BookingRequest:
      type: object
      properties:
        slotId:
          type: string
          format: uuid
      required:
      - slotId
      additionalProperties: false
    Booking:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slotId:
          type: string
          format: uuid
        fileId:
          type: string
          format: uuid
        testTypeCode:
          type: string
        examinerId:
          type:
          - string
          - 'null'
        status:
          type: string
        bookedAt:
          type: string
          format: date-time
      required:
      - id
      - status
      additionalProperties: true
    PaperQuestion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        category:
          type: string
        text:
          type: string
        options:
          type: array
          items:
            type: string
      required:
      - id
      - text
      - options
      additionalProperties: true
    PaperCollection:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaperQuestion'
      required:
      - items
      additionalProperties: true
    TheoryRequest:
      type: object
      properties:
        language:
          type: string
          pattern: ^[a-z]{2}$
        answers:
          type: object
          maxProperties: 200
          propertyNames:
            pattern: ^[0-9a-f-]{36}$
          additionalProperties:
            type: integer
            minimum: 0
            maximum: 5
      required:
      - language
      - answers
      additionalProperties: false
    RoutePoint:
      type: object
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lon:
          type: number
          minimum: -180
          maximum: 180
        at:
          type: string
          format: date-time
      required:
      - lat
      - lon
      - at
      additionalProperties: false
    PracticalRequest:
      type: object
      properties:
        clientResultId:
          type: string
          pattern: ^[A-Za-z0-9._:-]{8,80}$
        faults:
          type: array
          maxItems: 100
          items:
            type: string
            pattern: ^[A-Z0-9_]{1,40}$
        route:
          type:
          - array
          - 'null'
          maxItems: 5000
          items:
            $ref: '#/components/schemas/RoutePoint'
        recordedAt:
          type: string
          format: date-time
        videoDocumentId:
          type:
          - string
          - 'null'
          format: uuid
      required:
      - clientResultId
      - faults
      - recordedAt
      additionalProperties: false
    ExceptionItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        resultId:
          type: string
          format: uuid
        reason:
          type: string
        status:
          type: string
          enum:
          - OPEN
          - ACCEPTED
          - REJECTED
        raisedAt:
          type: string
          format: date-time
        decidedBy:
          type:
          - string
          - 'null'
        decisionReason:
          type:
          - string
          - 'null'
      required:
      - id
      - reason
      - status
      additionalProperties: true
    ExceptionCollection:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExceptionItem'
      required:
      - items
      additionalProperties: true
    DecisionRequest:
      type: object
      properties:
        accept:
          type: boolean
        reason:
          type: string
          maxLength: 500
      required:
      - accept
      - reason
      additionalProperties: false
