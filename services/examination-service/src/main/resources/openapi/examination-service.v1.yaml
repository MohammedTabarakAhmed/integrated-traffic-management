openapi: 3.1.0
info:
  title: ITMS Examination Service
  version: 1.0.0
  description: Learning files, driving schools, examination committees and calendars, theory and practical tests, exceptions
    and the hand-off of passed files to licensing (DL-030..DL-045, DL-036; ADR-065). Records are scoped by the region of the
    learning file, school or committee (CC-001). Rule values (expiry, failed attempts, extra hours, pass marks, retest waits)
    are configuration and provisional until the Authority confirms them (ADR-064).
servers:
- url: /
security:
- bearerAuth: []
tags:
- name: Examination
paths:
  /v1/test-types/{code}:
    put:
      tags:
      - Examination
      operationId: saveTestType
      summary: 'Create or change a test type: scoring sheet, pass mark, retest wait, fee (DL-043)'
      x-itms-permission: exam.settings.manage
      x-itms-scope: national
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Z0-9_]{1,40}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestTypeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestType'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /v1/test-types/{code}/questions:
    post:
      tags:
      - Examination
      operationId: addQuestion
      summary: Add a question to a theory test's bank, in one language, weighted (DL-033)
      x-itms-permission: exam.settings.manage
      x-itms-scope: national
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Z0-9_]{1,40}$
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionCreated'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
