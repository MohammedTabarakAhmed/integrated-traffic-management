# hold-eligibility-service configuration. All environment-specific values come from environment variables
# (NFR-042, SEC-004); nothing secret is stored here.
spring:
  application:
    name: hold-eligibility-service
  datasource:
    url: ${HOLD_DB_URL}
    username: ${HOLD_DB_USER}
    password: ${HOLD_DB_PASSWORD}
  flyway:
    locations: classpath:db/platform,classpath:db/migration
  messages:
    basename: messages
    fallback-to-system-locale: false
  threads:
    virtual:
      enabled: true

itms:
  security:
    issuer: ${ITMS_OIDC_ISSUER}
    jwk-set-uri: ${ITMS_OIDC_JWKS_URI}
    audience: itms-api
    # Grants come from iam-service (ADR-022). token-claims is the interim ADR-018 mode, for tests only.
    authorisation-source: ${ITMS_AUTHORISATION_SOURCE:iam}
    iam:
      base-url: ${ITMS_IAM_URL:}
      cache-ttl: ${ITMS_IAM_CACHE_TTL:60s}
  # CC-032, Q-053 (owner decision 2026-10-05: masked per type): hold types the customer is told about when they block
  # a service, each with its next step. Any type not listed (court order, police circular, administrative ban,
  # deceased, external travel restriction, or a new type) is shown only as RESTRICTED with CONTACT_AUTHORITY.
  # Business configuration, set per environment (ITMS_ELIGIBILITY_DISCLOSED_HOLD_TYPES_<n>_HOLD_TYPE/_NEXT_STEP);
  # every code needs a customer text in messages*.properties or the service does not start.
  eligibility:
    disclosed-hold-types:
      - hold-type: UNPAID_FINES
        next-step: PAY_FINES
      - hold-type: EXPIRED_INSURANCE
        next-step: RENEW_INSURANCE
      - hold-type: FAILED_INSPECTION
        next-step: PASS_INSPECTION
      - hold-type: MORTGAGE
        next-step: CLEAR_MORTGAGE
      - hold-type: IMPOUND
        next-step: RELEASE_VEHICLE
      - hold-type: DRIVING_BAN
        next-step: CONTACT_AUTHORITY
  # API_SPECIFICATION §2, ADR-032: placing, lifting and overriding holds need an Idempotency-Key; a retry with the same
  # key and request replays the stored response. Retention and lock timeout are set per environment (Q-052).
  idempotency:
    enabled: true
    paths:
      - /v1/holds
      - /v1/holds/*/lifts
      - /v1/holds/*/overrides
    retention: ${ITMS_IDEMPOTENCY_RETENTION:24h}
    lock-timeout: ${ITMS_IDEMPOTENCY_LOCK_TIMEOUT:30s}
    cleanup-interval: ${ITMS_IDEMPOTENCY_CLEANUP_INTERVAL:15m}
    cleanup-batch-size: ${ITMS_IDEMPOTENCY_CLEANUP_BATCH_SIZE:500}

# Observability (NFR-040, ADR-037). Probes and the Prometheus scrape are served on a separate management port, reached
# only from the operations network; on that port they need no token (ManagementRequests). Traces and logs go to an
# OpenTelemetry collector only when its endpoints are set, for example
# MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://otel-collector:4318/v1/traces and
# MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT=http://otel-collector:4318/v1/logs.
management:
  server:
    port: ${ITMS_MANAGEMENT_PORT:8090}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
  tracing:
    sampling:
      probability: ${ITMS_TRACING_SAMPLING_PROBABILITY:0.1}

server:
  error:
    include-stacktrace: never
    include-message: never

# Log levels are set per service (NFR-040): ITMS_LOG_LEVEL for ITMS code, ITMS_LOG_LEVEL_ROOT for everything else.
logging:
  level:
    root: ${ITMS_LOG_LEVEL_ROOT:INFO}
    gov.itms: ${ITMS_LOG_LEVEL:INFO}
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
    correlation: "[%X{traceId:-},%X{spanId:-}] "
