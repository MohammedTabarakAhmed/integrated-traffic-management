# Plain-language problem messages (CH-053). English; national-language bundle: messages_ar.properties.
problem.VALIDATION_FAILED=Some fields are missing or invalid. Correct them and try again.
problem.FORBIDDEN=You do not have permission to do this. Ask your administrator if you need access.
problem.NOT_FOUND=The requested resource was not found.
problem.METHOD_NOT_ALLOWED=This action is not available for this resource.
problem.UNSUPPORTED_MEDIA_TYPE=The request must be sent as JSON.
problem.AUTHORISATION_UNAVAILABLE=Access rights cannot be checked right now, so the request was not processed. Try again shortly.
problem.INTERNAL_ERROR=Something went wrong on our side. Try again later; if it continues, contact support with the reference number.
problem.INVALID_CODE={0} must be 1 to 40 characters using A-Z, 0-9 or underscore.
problem.INVALID_SERVICE_CODE=A service code must be 2 to 20 characters using A-Z, 0-9 or underscore, starting with a letter.
problem.LIST_SIZE_INVALID={0} needs {1} to {2} entries.
problem.LIST_DUPLICATES={0} lists the same entry twice. Remove the repeated entry.
problem.REASON_REQUIRED=Give a reason of at least 3 characters.
problem.REASON_TOO_LONG=The reason can be at most 500 characters.
problem.BUSINESS_NUMBER_INVALID={0} must be 1 to 40 characters of A-Z, 0-9 or -, starting with a letter or a digit.
problem.CHANNEL_REQUIRED=The request does not say through which channel it was made. Use a supported channel and try again.
problem.IDEMPOTENCY_KEY_REQUIRED=Send an Idempotency-Key header with this request, so that a retry is not processed twice.
problem.IDEMPOTENCY_KEY_INVALID=The Idempotency-Key must be 8 to 128 characters using letters, digits, dot, underscore, colon or hyphen.
problem.IDEMPOTENCY_KEY_REUSED=This Idempotency-Key was already used for a different request. Use a new key for a new request.
problem.IDEMPOTENCY_REQUEST_IN_PROGRESS=A request with this Idempotency-Key is still being processed. Try again shortly.
problem.SCOPE_EXCEEDED=You can only work with holds in your own modules.
problem.SUBJECT_TYPE_REQUIRED=Choose what the hold is on: a traffic file, licence, vehicle or plate.
problem.INVALID_ROLE_CODE=A role code must be 2 to 60 characters using A-Z, 0-9 or underscore, starting with a letter.
problem.INVALID_SOURCE_REF=The source reference must be 1 to 100 characters using letters, digits, dot, underscore, colon, slash or hyphen.
problem.SERVICES_ALL_MIXED=Choose either every service (*) or a list of services, not both.
problem.HOLD_DATES_INVALID=The end date cannot be before the start date.
problem.HOLD_END_IN_PAST=The end date has passed, so the hold would never apply. Choose today or a later date.
problem.HOLD_NOT_FOUND=The hold was not found.
problem.HOLD_NOT_ACTIVE=This hold is no longer active ({0}), so it cannot be lifted.
problem.LIFT_NOT_ALLOWED=Only holders of these roles may lift this hold: {0}.
problem.DUPLICATE_SOURCE_REF={0} already placed a hold with the reference {1}.
problem.INVALID_TRANSACTION_REFERENCE=The transaction reference must look like SERVICE-REGION-YYYY-0000001.
problem.INVALID_DOCUMENT_NUMBER=The document number must be 1 to 100 characters using letters, digits, dot, underscore, colon, slash or hyphen.
problem.OVERRIDE_NOT_ALLOWED=Only an authorised supervisor of this hold's module may override it.
problem.OVERRIDE_HOLD_NOT_ACTIVE=This hold is no longer active ({0}), so there is nothing to override.
problem.OVERRIDE_NOT_NEEDED=This hold does not block service {0}, so it does not need an override.
problem.OVERRIDE_BY_PLACER=You placed this hold, so you cannot override it. Ask another supervisor.
problem.OVERRIDE_EXISTS=This hold is already overridden for transaction {0}.
problem.TRANSACTION_SERVICE_MISMATCH=The transaction reference does not belong to service {0}.
# Eligibility before submission (CC-032): what the customer is told when a hold blocks a service. Reason and next
# step are joined into one message. RESTRICTED / CONTACT_AUTHORITY is shown for masked hold types (Q-053).
eligibility.reason.RESTRICTED=A restriction on this record stops this service.
eligibility.reason.UNPAID_FINES=There are unpaid fines on this record.
eligibility.reason.EXPIRED_INSURANCE=The vehicle insurance has expired.
eligibility.reason.FAILED_INSPECTION=The vehicle has not passed its technical inspection.
eligibility.reason.MORTGAGE=The vehicle is mortgaged.
eligibility.reason.IMPOUND=The vehicle is impounded.
eligibility.reason.DRIVING_BAN=A driving ban is in force.
eligibility.next-step.CONTACT_AUTHORITY=Contact the Authority or visit a service centre for help.
eligibility.next-step.PAY_FINES=Pay the outstanding fines, then try again.
eligibility.next-step.RENEW_INSURANCE=Renew the insurance with your insurer, then try again.
eligibility.next-step.PASS_INSPECTION=Have the vehicle inspected at an approved centre, then try again.
eligibility.next-step.CLEAR_MORTGAGE=Ask the lender to release the mortgage, then try again.
eligibility.next-step.RELEASE_VEHICLE=Have the vehicle released from impound, then try again.
