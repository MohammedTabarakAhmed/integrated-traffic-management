# Plain-language problem messages (CH-053), national language. Arabic texts are DRAFT (Q-006).
problem.VALIDATION_FAILED=بعض الحقول ناقصة أو غير صحيحة. صحّحها ثم حاول مرة أخرى.
problem.FORBIDDEN=ليست لديك صلاحية للقيام بذلك. اطلب الصلاحية من المسؤول إن كنت تحتاجها.
problem.NOT_FOUND=المورد المطلوب غير موجود.
problem.METHOD_NOT_ALLOWED=هذا الإجراء غير متاح لهذا المورد.
problem.UNSUPPORTED_MEDIA_TYPE=يجب إرسال الطلب بصيغة JSON.
problem.AUTHORISATION_UNAVAILABLE=لا يمكن التحقق من الصلاحيات الآن، لذلك لم يُنفَّذ الطلب. حاول مرة أخرى بعد قليل.
problem.INTERNAL_ERROR=حدث خطأ من جهتنا. حاول لاحقاً، وإذا استمر الخطأ تواصل مع الدعم مع ذكر الرقم المرجعي.
problem.INVALID_CODE=يجب أن يتكون {0} من 1 إلى 40 حرفاً من A-Z أو 0-9 أو الشرطة السفلية.
problem.INVALID_SERVICE_CODE=يجب أن يتكون رمز الخدمة من 2 إلى 20 حرفاً من A-Z أو 0-9 أو الشرطة السفلية، وأن يبدأ بحرف.
problem.LIST_SIZE_INVALID=يحتاج {0} إلى عدد من {1} إلى {2} من الإدخالات.
problem.LIST_DUPLICATES=يحتوي {0} على إدخال مكرر. احذف الإدخال المكرر.
problem.REASON_REQUIRED=اذكر سبباً لا يقل عن 3 أحرف.
problem.REASON_TOO_LONG=يجب ألا يزيد السبب على 500 حرف.
problem.BUSINESS_NUMBER_INVALID=يجب أن يتكون {0} من 1 إلى 40 حرفاً من A-Z أو 0-9 أو -، ويبدأ بحرف أو رقم.
problem.CHANNEL_REQUIRED=لا يحدد الطلب القناة التي قُدِّم من خلالها. استخدم قناة معتمدة وحاول مرة أخرى.
problem.IDEMPOTENCY_KEY_REQUIRED=أرسل الترويسة Idempotency-Key مع هذا الطلب حتى لا تتم معالجة إعادة المحاولة مرتين.
problem.IDEMPOTENCY_KEY_INVALID=يجب أن يتكون Idempotency-Key من 8 إلى 128 حرفاً من الحروف أو الأرقام أو النقطة أو الشرطة السفلية أو النقطتين أو الشرطة.
problem.IDEMPOTENCY_KEY_REUSED=استُخدم هذا المفتاح Idempotency-Key من قبل لطلب مختلف. استخدم مفتاحاً جديداً لكل طلب جديد.
problem.IDEMPOTENCY_REQUEST_IN_PROGRESS=ما زال طلب بهذا المفتاح Idempotency-Key قيد المعالجة. حاول مرة أخرى بعد قليل.
problem.SCOPE_EXCEEDED=يمكنك التعامل مع الحجوزات في وحداتك فقط.
problem.SUBJECT_TYPE_REQUIRED=اختر محل الحجز: ملف مروري أو رخصة أو مركبة أو لوحة.
problem.INVALID_ROLE_CODE=يجب أن يتكون رمز الدور من 2 إلى 60 حرفاً من A-Z أو 0-9 أو الشرطة السفلية، ويبدأ بحرف.
problem.INVALID_SOURCE_REF=يجب أن يتكون مرجع الجهة من 1 إلى 100 حرف من الحروف أو الأرقام أو النقطة أو الشرطة السفلية أو النقطتين أو الشرطة المائلة أو الشرطة.
problem.SERVICES_ALL_MIXED=اختر إما جميع الخدمات (*) أو قائمة خدمات، وليس كليهما.
problem.HOLD_DATES_INVALID=لا يمكن أن يكون تاريخ الانتهاء قبل تاريخ البدء.
problem.HOLD_END_IN_PAST=تاريخ الانتهاء قد مضى، فلن يسري الحجز أبداً. اختر اليوم أو تاريخاً لاحقاً.
problem.HOLD_NOT_FOUND=لم يتم العثور على الحجز.
problem.HOLD_NOT_ACTIVE=هذا الحجز لم يعد سارياً ({0})، فلا يمكن رفعه.
problem.LIFT_NOT_ALLOWED=لا يرفع هذا الحجز إلا أصحاب هذه الأدوار: {0}.
problem.DUPLICATE_SOURCE_REF=سبق أن وضعت الجهة {0} حجزاً بالمرجع {1}.
