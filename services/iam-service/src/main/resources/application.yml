# iam-service configuration. All environment-specific values come from environment variables
# (NFR-042, SEC-004); nothing secret is stored here.
spring:
  application:
    name: iam-service
  datasource:
    url: ${IAM_DB_URL}
    username: ${IAM_DB_USER}
    password: ${IAM_DB_PASSWORD}
  flyway:
    locations: classpath:db/platform,classpath:db/migration
  messages:
    basename: messages
    fallback-to-system-locale: false
  threads:
    virtual:
      enabled: true

itms:
  security:
    issuer: ${ITMS_OIDC_ISSUER}
    jwk-set-uri: ${ITMS_OIDC_JWKS_URI}
    audience: itms-api
    # iam-service is the source of grants: it resolves its own callers locally (ADR-022).
  iam:
    # One-time bootstrap of the first administrator per environment (IamConfiguration); empty = disabled.
    bootstrap-admin:
      subject: ${ITMS_IAM_BOOTSTRAP_ADMIN_SUBJECT:}
      username: ${ITMS_IAM_BOOTSTRAP_ADMIN_USERNAME:}
    # How often access must be reviewed (SEC-007 "every quarter", ADR-026): ISO-8601 period, rolling on UTC.
    access-review:
      period: ${ITMS_IAM_ACCESS_REVIEW_PERIOD:P3M}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

server:
  error:
    include-stacktrace: never
    include-message: never

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
