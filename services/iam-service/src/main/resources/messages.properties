# Plain-language problem messages (CH-053). English; national-language bundle: messages_ar.properties.
problem.VALIDATION_FAILED=Some fields are missing or invalid. Correct them and try again.
problem.FORBIDDEN=You do not have permission to do this. Ask your administrator if you need access.
problem.NOT_FOUND=The requested resource was not found.
problem.INTERNAL_ERROR=Something went wrong on our side. Try again later; if it continues, contact support with the reference number.
problem.AUTHORISATION_UNAVAILABLE=Access rights cannot be checked right now, so the request was not processed. Try again shortly.
problem.NAME_REQUIRED=Enter the name in both languages.
problem.NAME_TOO_LONG=Names can be at most 200 characters.
problem.INVALID_ROLE_CODE=The role code must be 2 to 60 characters using A-Z, 0-9 or underscore, starting with a letter.
problem.INVALID_PERMISSION_CODE=The permission {0} is not written correctly.
problem.INVALID_SUBJECT=The user identifier is missing or invalid.
problem.REASON_REQUIRED=Give a reason of at least 3 characters.
problem.REASON_TOO_LONG=The reason can be at most 500 characters.
problem.DESCRIPTION_TOO_LONG=The description can be at most 1000 characters.
problem.PERMISSIONS_REQUIRED=Include the list of permissions (it may be empty).
problem.TOO_MANY_PERMISSIONS=A role can have at most 500 permissions.
problem.UNKNOWN_PERMISSION=These permissions do not exist: {0}. Choose permissions from the catalogue.
problem.ROLE_EXISTS=The role {0} already exists.
problem.ROLE_NOT_FOUND=The role {0} does not exist.
problem.ROLE_INACTIVE=The role {0} is inactive, so it cannot be assigned.
problem.STALE_ROLE=Someone else changed this role after you opened it. Open it again and repeat your change.
problem.ROLE_HELD_BY_ACTOR=You hold this role yourself, so another administrator must change it.
problem.SCOPE_REQUIRED=Choose at least one value for {0}, or * for all.
problem.SCOPE_TOO_LARGE={0} can have at most 100 values.
problem.SCOPE_VALUE_INVALID={0} contains a value that is not a valid code.
problem.SCOPE_ALL_EXCLUSIVE=When {0} is * (all), it cannot have other values.
problem.SCOPE_EXCEEDED=You can only manage roles within your own regions, service centres and modules.
problem.VALIDITY_INVALID=The end of the validity period must be after its start.
problem.VALIDITY_IN_PAST=The validity period you entered is already over.
problem.SELF_ASSIGNMENT=You cannot assign a role to yourself. Another administrator must do it.
problem.ASSIGNMENT_EXISTS=This person already holds this role with the same scopes for an overlapping period.
problem.ASSIGNMENT_NOT_FOUND=The role assignment does not exist.
problem.ASSIGNMENT_NOT_ACTIVE=This role assignment has already been revoked.
