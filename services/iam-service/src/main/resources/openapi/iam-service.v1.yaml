openapi: 3.1.0
info:
  title: ITMS Identity and Access Management Service
  version: 1.0.0
  description: |
    Owns ITMS authorisation (ADR-004, ADR-022): the permission catalogue, roles, role assignments with data scopes
    (region, service centre, module) and the effective authorisation of a signed-in subject (CC-001).
    Authentication stays with the identity provider; this service decides what an authenticated subject may do.

    - Administrators create roles and change their permissions at runtime, without code changes (CC-005).
    - Every change is audited with old and new values (CC-120); role definitions keep a full version history
      (DAT-002, CC-121). Assignments are never deleted: they end by validity date or by revocation.
    - Segregation of duties (CC-002): nobody can assign a role to themselves, and nobody can change the definition
      of a role they currently hold.
    - Data scopes (CC-001): an administrator can only see, create or revoke assignments whose scopes lie within their
      own scope for that permission. Out-of-scope assignments are reported as not found.

    - Approval limits (CC-003): each role carries configurable limits (limit type + currency + maximum amount in
      minor units). A subject's limit for a target is the highest limit among their grants that reach it; no limit
      means no authority to approve. Values are never hard-coded.
    - Delegation (CC-004): the holder of an assignment (or an administrator whose `iam.delegation.create` scope
      covers it) can delegate it to another subject for a set period. The delegation is a role assignment with
      `source = DELEGATION`; it grants nothing once its source is revoked or expired, and cannot be re-delegated.
      A subject lists their own assignments at `/v1/me/assignments`.
    - Conflicting roles (CC-002): administrators configure pairs of roles that one subject must not hold together.
      Assigning or delegating a role that conflicts with one the subject already holds is refused. The list starts
      empty (Q-030); adding a pair revokes nothing, and current holders of both roles are listed as violations.
    - Leavers (SEC-007): the directory feed (or an administrator) deactivates a subject, which revokes all of their
      assignments and delegations in one step. Disabling the sign-in itself stays with the identity provider.
    - Access reviews (SEC-007, ADR-026): an administrator opens a review over a data scope with a due date; every
      ACTIVE DIRECT assignment in that scope becomes a review item. Reviewers (role ACCESS_REVIEWER, "managers")
      keep or revoke the items within their own scope; a REVOKE revokes the assignment at once. Undecided items are
      flagged overdue and are never revoked automatically. Assignments not kept by a review within the configured
      period (default `P3M`, "every quarter") are listed at `/v1/access-reviews/overdue-assignments`.

    Scope values: `*` means "all" for that dimension and must then be the only value. Otherwise values are codes
    (`^[A-Z0-9_]{1,40}$`) owned by geo-service (regions, centres) and reference data (modules); see Q-027.
    Only GET/POST/PUT are used (INT-003); business actions are POSTs to sub-resources.

    Request input (SEC-022), all endpoints, enforced once in itms-platform: enum values are exactly their names as
    JSON strings (a number, padding or a control character is refused), also in query parameters; integers are
    JSON integers (a fraction, exponent form, string or boolean is refused, never truncated); text is a JSON
    string without the NUL character (U+0000); every `date-time` / `date` is an RFC 3339 string with a
    four-digit year (`0001-01-01T00:00:00Z` .. `9999-12-31T23:59:59.999999Z`; dates `0001-01-01` .. `9999-12-31`).
    A request that breaks one of these rules is refused with 400 `VALIDATION_FAILED`.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: Permissions
  - name: Roles
  - name: Role assignments
  - name: Approval limits
  - name: Delegations
  - name: Role conflicts
  - name: Subjects
  - name: Access reviews
  - name: Effective authorisation

paths:
  /v1/permissions:
    get:
      tags: [Permissions]
      operationId: listPermissions
      summary: The permission catalogue
      description: |
        Permissions are declared by each service's API (`x-itms-permission`) and registered here by migration.
        Roles may only contain catalogue permissions.
      x-itms-permission: iam.permission.read
      x-itms-scope: national
      responses:
        '200':
          description: Permissions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }

  /v1/roles:
    get:
      tags: [Roles]
      operationId: listRoles
      summary: All roles
      x-itms-permission: iam.role.read
      x-itms-scope: national
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Roles]
      operationId: createRole
      summary: Create a role (CC-005)
      x-itms-permission: iam.role.manage
      x-itms-scope: national
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoleRequest' }
      responses:
        '201':
          description: Role created
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/roles/{roleCode}:
    get:
      tags: [Roles]
      operationId: getRole
      summary: One role
      x-itms-permission: iam.role.read
      x-itms-scope: national
      parameters:
        - $ref: '#/components/parameters/RoleCode'
      responses:
        '200':
          description: Role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [Roles]
      operationId: updateRole
      summary: Replace a role's names, description, active flag and permissions (CC-005)
      description: |
        Full replacement of the role definition. `version` must be the version the administrator saw; a stale version
        is refused with 409. Takes effect for every holder of the role at their next authorisation refresh.
      x-itms-permission: iam.role.manage
      x-itms-scope: national
      parameters:
        - $ref: '#/components/parameters/RoleCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRoleRequest' }
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/roles/{roleCode}/history:
    get:
      tags: [Roles]
      operationId: getRoleHistory
      summary: Every version of a role definition (DAT-002, CC-121)
      x-itms-permission: iam.history.read
      x-itms-scope: national
      parameters:
        - $ref: '#/components/parameters/RoleCode'
      responses:
        '200':
          description: Versions, oldest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleVersionCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/roles/{roleCode}/approval-limits:
    get:
      tags: [Approval limits]
      operationId: getRoleApprovalLimits
      summary: Approval limits of a role (CC-003)
      x-itms-permission: iam.role.read
      x-itms-scope: national
      parameters:
        - $ref: '#/components/parameters/RoleCode'
      responses:
        '200':
          description: The role's limits and its current version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleApprovalLimits' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [Approval limits]
      operationId: replaceRoleApprovalLimits
      summary: Replace all approval limits of a role (CC-003)
      description: |
        Full replacement: limits left out are removed. `version` must be the role version the administrator saw;
        the change creates a new role version (409 if stale). Each (limitType, currency) may appear once. The caller
        cannot change limits of a role they hold (CC-002). Audited with the old and new limits (CC-120); every
        limit keeps a history (DAT-002).
      x-itms-permission: iam.role.manage
      x-itms-scope: national
      parameters:
        - $ref: '#/components/parameters/RoleCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceApprovalLimitsRequest' }
      responses:
        '200':
          description: Limits replaced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleApprovalLimits' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/role-assignments:
    get:
      tags: [Role assignments]
      operationId: listRoleAssignments
      summary: Role assignments within the caller's scope
      description: Only assignments whose scopes lie within the caller's `iam.assignment.read` scope are returned.
      x-itms-permission: iam.assignment.read
      x-itms-scope: [region, centre, module]
      parameters:
        - name: subjectId
          in: query
          schema: { $ref: '#/components/schemas/SubjectId' }
        - name: roleCode
          in: query
          schema: { $ref: '#/components/schemas/RoleCode' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AssignmentStatus' }
      responses:
        '200':
          description: Assignments, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleAssignmentCollection' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Role assignments]
      operationId: createRoleAssignment
      summary: Assign a role to a subject with data scopes and a validity period (CC-001)
      description: |
        The requested scopes must lie within the caller's own `iam.assignment.manage` scope, and the caller cannot
        assign a role to themselves (CC-002). `validFrom` defaults to now; `validTo` is optional. A role that
        conflicts with one the subject holds (an ACTIVE pair in `/v1/role-conflicts`) is refused with 403
        `ROLE_CONFLICT` (CC-002).
      x-itms-permission: iam.assignment.manage
      x-itms-scope: [region, centre, module]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoleAssignmentRequest' }
      responses:
        '201':
          description: Assignment created
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleAssignment' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/role-assignments/{assignmentId}:
    get:
      tags: [Role assignments]
      operationId: getRoleAssignment
      summary: One assignment (404 if outside the caller's scope)
      x-itms-permission: iam.assignment.read
      x-itms-scope: [region, centre, module]
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
      responses:
        '200':
          description: Assignment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleAssignment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/role-assignments/{assignmentId}/revocations:
    post:
      tags: [Role assignments]
      operationId: revokeRoleAssignment
      summary: Revoke an active assignment, with a reason
      x-itms-permission: iam.assignment.manage
      x-itms-scope: [region, centre, module]
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: Assignment revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleAssignment' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /v1/delegations:
    get:
      tags: [Delegations]
      operationId: listDelegations
      summary: Delegations where a subject is the delegate, the delegator or the holder of the source (CC-004)
      description: |
        `subjectId` defaults to the caller. A caller always sees delegations they are party to (delegate,
        delegator or holder of the source); others are returned only within the caller's `iam.delegation.read`
        scope. A listed ACTIVE delegation grants nothing outside its period or once its source has ended.
      x-itms-permission: authenticated
      x-itms-scope: [own, region, centre, module]
      parameters:
        - name: subjectId
          in: query
          schema: { $ref: '#/components/schemas/SubjectId' }
      responses:
        '200':
          description: Delegations, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleAssignmentCollection' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Delegations]
      operationId: createDelegation
      summary: Delegate an assignment to another subject for a set period (CC-004)
      description: |
        Allowed for the holder of the source assignment, or for a caller whose `iam.delegation.create` scope covers
        the source's scopes (on behalf of an absent holder). The delegation copies the source's role and scopes.
        Rules: `validTo` is required and cannot be later than the source's `validTo`; the source must be ACTIVE,
        not expired and not itself a delegation; nobody delegates to themselves (CC-002) or to the holder. Which
        roles may be delegated is open (Q-033; interim: all). A role that conflicts with one the delegate holds is
        refused with 403 `ROLE_CONFLICT` (CC-002). Audited as `IAM_DELEGATION_CREATED`.
      x-itms-permission: authenticated
      x-itms-scope: [own, region, centre, module]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDelegationRequest' }
      responses:
        '201':
          description: Delegation created
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleAssignment' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/delegations/{delegationId}/revocations:
    post:
      tags: [Delegations]
      operationId: revokeDelegation
      summary: Revoke an active delegation, with a reason (CC-004)
      description: |
        Allowed for the delegator, the holder of the source, or a caller whose `iam.delegation.create` scope covers
        the delegation. Audited as `IAM_DELEGATION_REVOKED`. 404 if the id is not a delegation visible to the caller.
      x-itms-permission: authenticated
      x-itms-scope: [own, region, centre, module]
      parameters:
        - name: delegationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: Delegation revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleAssignment' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /v1/role-conflicts:
    get:
      tags: [Role conflicts]
      operationId: listRoleConflicts
      summary: Configured pairs of conflicting roles (CC-002)
      description: ACTIVE pairs are enforced; RETIRED pairs are kept for history. Newest first.
      x-itms-permission: iam.role.read
      x-itms-scope: national
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/RoleConflictStatus' }
      responses:
        '200':
          description: Role conflicts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleConflictCollection' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Role conflicts]
      operationId: createRoleConflict
      summary: Declare that two roles must not be held by the same subject (CC-002)
      description: |
        The pair is stored with the role codes in alphabetical order, so (A, B) and (B, A) are the same pair; only
        one ACTIVE pair per two roles. A role cannot conflict with itself. From now on, assigning or delegating either
        role to a subject who holds (ACTIVE and not yet ended) the other is refused with 403 `ROLE_CONFLICT`. Adding
        a pair revokes nothing: current holders of both roles appear in `/v1/role-conflicts/violations`. Which pairs
        apply is a business decision (Q-030; the list starts empty). Audited as `IAM_ROLE_CONFLICT_CREATED`.
      x-itms-permission: iam.role.manage
      x-itms-scope: national
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoleConflictRequest' }
      responses:
        '201':
          description: Pair created
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleConflict' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/role-conflicts/violations:
    get:
      tags: [Role conflicts]
      operationId: listRoleConflictViolations
      summary: Subjects who currently hold both roles of an ACTIVE pair (CC-002)
      description: |
        A subject holds a role when they have an ACTIVE assignment or delegation of it that has not ended (it may
        start later). Only assignments within the caller's `iam.assignment.read` scope are considered, so a violation
        is listed only when the caller can see an assignment of each role.
      x-itms-permission: iam.assignment.read
      x-itms-scope: [region, centre, module]
      responses:
        '200':
          description: Violations, by role pair and subject
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleConflictViolationCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }

  /v1/role-conflicts/{conflictId}/retirements:
    post:
      tags: [Role conflicts]
      operationId: retireRoleConflict
      summary: Retire an ACTIVE pair, with a reason (CC-002)
      description: The pair is no longer enforced but is kept for history. Audited as `IAM_ROLE_CONFLICT_RETIRED`.
      x-itms-permission: iam.role.manage
      x-itms-scope: national
      parameters:
        - name: conflictId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: Pair retired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleConflict' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /v1/subjects/{subjectId}/deactivations:
    post:
      tags: [Subjects]
      operationId: deactivateSubject
      summary: Leaver - revoke every assignment and delegation of a subject in one step (SEC-007)
      description: |
        Called by the directory feed on the day a person leaves (or by an administrator). In one transaction it
        revokes every ACTIVE assignment of the subject (DIRECT and received delegations) and every ACTIVE delegation
        made from the subject's assignments. The caller's `iam.subject.deactivate` scope must cover the scopes of
        every assignment to be revoked; otherwise 403 `SCOPE_EXCEEDED` and nothing is revoked. Idempotent: a repeat
        call (or a subject with nothing to revoke) returns 200 with `revokedCount: 0`. Audited as
        `IAM_SUBJECT_DEACTIVATED`, plus `IAM_ROLE_REVOKED` or `IAM_DELEGATION_REVOKED` per revocation. Disabling the
        sign-in itself is done by the identity provider and directory, not here.
      x-itms-permission: iam.subject.deactivate
      x-itms-scope: [region, centre, module]
      parameters:
        - name: subjectId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/SubjectId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: Subject deactivated; what was revoked by this call
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubjectDeactivation' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/access-reviews:
    get:
      tags: [Access reviews]
      operationId: listAccessReviews
      summary: Access reviews within the caller's scope, newest first (SEC-007)
      description: Only reviews whose scopes lie within the caller's `iam.review.read` scope are returned.
      x-itms-permission: iam.review.read
      x-itms-scope: [region, centre, module]
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AccessReviewStatus' }
      responses:
        '200':
          description: Access reviews, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessReviewCollection' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Access reviews]
      operationId: openAccessReview
      summary: Open an access review over a data scope with a due date (SEC-007)
      description: |
        Every ACTIVE DIRECT role assignment that has not ended (upcoming ones included) and whose scopes lie within
        the review's scopes becomes a PENDING review item, with a snapshot of the assignment. A national (`*`)
        assignment is therefore only reviewed by a national review. Delegations are not reviewed (Q-039). An
        assignment already PENDING in another open review is skipped and counted in `skippedUnderReview`. A review
        with no items is allowed. The caller's `iam.review.manage` scope must cover the review's scopes (403
        `SCOPE_EXCEEDED`); `dueAt` must be in the future (422 `ACCESS_REVIEW_DUE_IN_PAST`) and no later than
        `9999-12-31T23:59:59.999999Z` (400 `VALIDATION_FAILED`, RFC 3339 range). Audited as
        `IAM_ACCESS_REVIEW_OPENED`.
      x-itms-permission: iam.review.manage
      x-itms-scope: [region, centre, module]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessReviewRequest' }
      responses:
        '201':
          description: Review opened
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessReview' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/access-reviews/overdue-assignments:
    get:
      tags: [Access reviews]
      operationId: listAssignmentsOverdueForReview
      summary: Assignments not kept by a review within the configured review period (SEC-007)
      description: |
        ACTIVE DIRECT assignments that have not ended, were assigned more than one review period ago and have no
        KEPT review decision within the last period. The period is configuration (`reviewPeriod`, ISO-8601, default
        `P3M`), evaluated as a rolling period on the UTC clock (Q-038). `pendingItemId` is the open review item of
        the assignment, if any. Only assignments within the caller's `iam.review.read` scope are listed. Nothing is
        revoked automatically (Q-037).
      x-itms-permission: iam.review.read
      x-itms-scope: [region, centre, module]
      responses:
        '200':
          description: Assignments overdue for review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OverdueAssignments' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }

  /v1/access-reviews/{reviewId}:
    get:
      tags: [Access reviews]
      operationId: getAccessReview
      summary: One access review with its counts (404 if outside the caller's scope)
      x-itms-permission: iam.review.read
      x-itms-scope: [region, centre, module]
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      responses:
        '200':
          description: Access review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessReview' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/access-reviews/{reviewId}/closures:
    post:
      tags: [Access reviews]
      operationId: closeAccessReview
      summary: Close an open access review, with a reason (SEC-007)
      description: |
        Allowed at any time while the review is OPEN, once (409 `ACCESS_REVIEW_CLOSED` afterwards). Each PENDING
        item becomes ENDED if its assignment was revoked or has ended meanwhile, otherwise NOT_REVIEWED. Nothing is
        revoked: NOT_REVIEWED assignments stay on the overdue listing. The caller's `iam.review.manage` scope must
        cover the review's scopes. Audited as `IAM_ACCESS_REVIEW_CLOSED` with the counts and the NOT_REVIEWED items.
      x-itms-permission: iam.review.manage
      x-itms-scope: [region, centre, module]
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: Review closed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessReview' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/access-review-items:
    get:
      tags: [Access reviews]
      operationId: listAccessReviewItems
      summary: Review items within the caller's scope - the reviewer's queue across reviews (SEC-007)
      description: |
        Items are visible individually when the caller's `iam.review.read` scope covers the item's scopes, so a
        regional reviewer works the items of a national review in their region. `status` defaults to PENDING.
        A `campaignId` that matches no visible item returns an empty list.
      x-itms-permission: iam.review.read
      x-itms-scope: [region, centre, module]
      parameters:
        - name: campaignId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AccessReviewItemStatus' }
        - name: subjectId
          in: query
          schema: { $ref: '#/components/schemas/SubjectId' }
      responses:
        '200':
          description: Review items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessReviewItemCollection' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/access-review-items/{itemId}/decisions:
    post:
      tags: [Access reviews]
      operationId: decideAccessReviewItem
      summary: Keep or revoke the assignment under review (SEC-007)
      description: |
        The caller's `iam.review.decide` scope must cover the item's scopes (403 `SCOPE_EXCEEDED`). The review must
        be OPEN (409 `ACCESS_REVIEW_CLOSED`) and the item PENDING (409 `ACCESS_REVIEW_ITEM_DECIDED`). Nobody reviews
        their own access (403 `ACCESS_REVIEW_SELF`) or an assignment they granted (403 `ACCESS_REVIEW_OWN_GRANT`)
        (CC-002). The assignment must still be ACTIVE and not ended (409 `ACCESS_REVIEW_ASSIGNMENT_ENDED`). REVOKE
        needs a reason (422 `REASON_REQUIRED`) and revokes the assignment immediately, in the same transaction
        (audited as `IAM_ROLE_REVOKED`); delegations made from it stop granting at once. KEEP needs no reason.
        Decisions after `dueAt` are allowed while the review is open and are marked `decidedLate`. Audited as
        `IAM_ACCESS_REVIEW_DECIDED`.
      x-itms-permission: iam.review.decide
      x-itms-scope: [region, centre, module]
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessReviewDecisionRequest' }
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessReviewItem' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/me/assignments:
    get:
      tags: [Effective authorisation]
      operationId: listMyAssignments
      summary: The caller's own role assignments, direct and received by delegation (CC-001, CC-004)
      description: |
        Any authenticated subject may list their own assignments; holders use the `id` of a DIRECT assignment as
        `sourceAssignmentId` when they delegate it. `status` defaults to ACTIVE. Newest first. An ACTIVE entry may
        lie outside its validity period; `/v1/me/authorisation` shows what is in force now.
      x-itms-permission: authenticated
      x-itms-scope: [own]
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AssignmentStatus' }
      responses:
        '200':
          description: Assignments, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleAssignmentCollection' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me/authorisation:
    get:
      tags: [Effective authorisation]
      operationId: getMyAuthorisation
      summary: The caller's effective authorisation now (CC-001)
      description: |
        Grants from every assignment that is active now (status ACTIVE, inside its validity period, role active;
        for a delegation, its source must be active now too). Each grant carries its role's approval limits (CC-003).
        Each grant keeps its own scopes; grants are never merged across assignments, so a permission held in one
        scope is not widened by another assignment. Every ITMS service resolves its callers' permissions from this
        endpoint by forwarding the caller's bearer token (ADR-022). Any authenticated subject may read their own.
      x-itms-permission: authenticated
      x-itms-scope: [own]
      responses:
        '200':
          description: Effective authorisation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectiveAuthorisation' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    RoleCode:
      name: roleCode
      in: path
      required: true
      schema: { $ref: '#/components/schemas/RoleCode' }
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Missing or invalid bearer token
    Problem:
      description: Problem details (RFC 9457, API_SPECIFICATION §3)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    RoleCode:
      type: string
      pattern: '^[A-Z][A-Z0-9_]{1,59}$'
    PermissionCode:
      type: string
      pattern: '^[a-z][a-z0-9-]*(\.[a-z][a-z0-9-]*){1,4}$'
    SubjectId:
      type: string
      description: Stable subject identifier issued by the identity provider (`sub`).
      pattern: '^[A-Za-z0-9._@:-]{1,100}$'
    ScopeValue:
      type: string
      pattern: '^(\*|[A-Z0-9_]{1,40})$'
    ScopeValues:
      type: array
      minItems: 1
      maxItems: 100
      uniqueItems: true
      items: { $ref: '#/components/schemas/ScopeValue' }
    Scopes:
      type: object
      additionalProperties: false
      description: Data scopes of an assignment (CC-001). `["*"]` means all values of that dimension.
      required: [regions, centres, modules]
      properties:
        regions: { $ref: '#/components/schemas/ScopeValues' }
        centres: { $ref: '#/components/schemas/ScopeValues' }
        modules: { $ref: '#/components/schemas/ScopeValues' }
    BilingualName:
      type: object
      additionalProperties: false
      required: [nl, en]
      properties:
        nl: { type: string, minLength: 1, maxLength: 200, description: National language (RTL) }
        en: { type: string, minLength: 1, maxLength: 200 }
    Reason:
      type: string
      minLength: 3
      maxLength: 500
    Actor:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { type: string }
        username: { oneOf: [ { type: string }, { type: 'null' } ] }

    Permission:
      type: object
      additionalProperties: false
      required: [code, service, description]
      properties:
        code: { $ref: '#/components/schemas/PermissionCode' }
        service: { type: string }
        description: { $ref: '#/components/schemas/BilingualName' }
    PermissionCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Permission' } }

    Role:
      type: object
      additionalProperties: false
      required: [code, name, active, permissions, version]
      properties:
        code: { $ref: '#/components/schemas/RoleCode' }
        name: { $ref: '#/components/schemas/BilingualName' }
        description: { oneOf: [ { type: string }, { type: 'null' } ] }
        active: { type: boolean }
        permissions: { type: array, items: { $ref: '#/components/schemas/PermissionCode' } }
        version: { type: integer, format: int64 }
    RoleCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Role' } }
    CreateRoleRequest:
      type: object
      additionalProperties: false
      required: [code, name, permissions, reason]
      properties:
        code: { $ref: '#/components/schemas/RoleCode' }
        name: { $ref: '#/components/schemas/BilingualName' }
        description: { type: string, maxLength: 1000 }
        permissions:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { $ref: '#/components/schemas/PermissionCode' }
        reason: { $ref: '#/components/schemas/Reason' }
    UpdateRoleRequest:
      type: object
      additionalProperties: false
      required: [name, active, permissions, version, reason]
      properties:
        name: { $ref: '#/components/schemas/BilingualName' }
        description: { type: string, maxLength: 1000 }
        active: { type: boolean }
        permissions:
          type: array
          maxItems: 500
          uniqueItems: true
          items: { $ref: '#/components/schemas/PermissionCode' }
        version: { type: integer, format: int64, minimum: 1 }
        reason: { $ref: '#/components/schemas/Reason' }
    RoleVersion:
      type: object
      additionalProperties: false
      description: One historical version of a role and the period during which it was current (DAT-002).
      required: [code, name, active, permissions, version, validFrom, changedBy]
      properties:
        code: { $ref: '#/components/schemas/RoleCode' }
        name: { $ref: '#/components/schemas/BilingualName' }
        description: { oneOf: [ { type: string }, { type: 'null' } ] }
        active: { type: boolean }
        permissions: { type: array, items: { $ref: '#/components/schemas/PermissionCode' } }
        version: { type: integer, format: int64 }
        validFrom: { type: string, format: date-time }
        validTo: { oneOf: [ { type: string, format: date-time }, { type: 'null' } ] }
        changedBy: { type: string }
    RoleVersionCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RoleVersion' } }

    LimitType:
      type: string
      description: Kind of approval, for example `REFUND_AMOUNT` or `FINE_REDUCTION_AMOUNT` (CC-003).
      pattern: '^[A-Z0-9_]{1,40}$'
    CurrencyCode:
      type: string
      description: ISO 4217 alphabetic code (Q-006; `XTS` in tests).
      pattern: '^[A-Z]{3}$'
    ApprovalLimit:
      type: object
      additionalProperties: false
      required: [limitType, maxAmountMinor, currency]
      properties:
        limitType: { $ref: '#/components/schemas/LimitType' }
        maxAmountMinor:
          type: integer
          format: int64
          minimum: 0
          description: Highest amount the holder may approve, in minor units of `currency`.
        currency: { $ref: '#/components/schemas/CurrencyCode' }
    RoleApprovalLimits:
      type: object
      additionalProperties: false
      required: [roleCode, version, items]
      properties:
        roleCode: { $ref: '#/components/schemas/RoleCode' }
        version: { type: integer, format: int64, description: Current role version }
        items: { type: array, items: { $ref: '#/components/schemas/ApprovalLimit' } }
    ReplaceApprovalLimitsRequest:
      type: object
      additionalProperties: false
      required: [limits, version, reason]
      properties:
        limits:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { $ref: '#/components/schemas/ApprovalLimit' }
        version: { type: integer, format: int64, minimum: 1 }
        reason: { $ref: '#/components/schemas/Reason' }

    AssignmentStatus:
      type: string
      enum: [ACTIVE, REVOKED]
    AssignmentSource:
      type: string
      description: DIRECT = assigned by an administrator; DELEGATION = delegated from `delegatedFrom` (CC-004).
      enum: [DIRECT, DELEGATION]
    CreateDelegationRequest:
      type: object
      additionalProperties: false
      required: [sourceAssignmentId, delegateSubjectId, validTo, reason]
      properties:
        sourceAssignmentId: { type: string, format: uuid }
        delegateSubjectId: { $ref: '#/components/schemas/SubjectId' }
        delegateUsername: { type: string, minLength: 1, maxLength: 200 }
        validFrom: { type: string, format: date-time, description: Defaults to now }
        validTo: { type: string, format: date-time }
        reason: { $ref: '#/components/schemas/Reason' }
    RoleAssignment:
      type: object
      additionalProperties: false
      required: [id, subjectId, roleCode, scopes, validFrom, status, source, reason, assignedBy, assignedAt]
      properties:
        id: { type: string, format: uuid }
        source: { $ref: '#/components/schemas/AssignmentSource' }
        delegatedFrom:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
          description: Source assignment of a delegation; null for DIRECT.
        subjectId: { $ref: '#/components/schemas/SubjectId' }
        subjectUsername: { oneOf: [ { type: string }, { type: 'null' } ] }
        roleCode: { $ref: '#/components/schemas/RoleCode' }
        scopes: { $ref: '#/components/schemas/Scopes' }
        validFrom: { type: string, format: date-time }
        validTo: { oneOf: [ { type: string, format: date-time }, { type: 'null' } ] }
        status: { $ref: '#/components/schemas/AssignmentStatus' }
        reason: { type: string }
        assignedBy: { $ref: '#/components/schemas/Actor' }
        assignedAt: { type: string, format: date-time }
        revokedBy: { oneOf: [ { $ref: '#/components/schemas/Actor' }, { type: 'null' } ] }
        revokedAt: { oneOf: [ { type: string, format: date-time }, { type: 'null' } ] }
        revocationReason: { oneOf: [ { type: string }, { type: 'null' } ] }
    RoleAssignmentCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RoleAssignment' } }
    CreateRoleAssignmentRequest:
      type: object
      additionalProperties: false
      required: [subjectId, roleCode, scopes, reason]
      properties:
        subjectId: { $ref: '#/components/schemas/SubjectId' }
        subjectUsername: { type: string, minLength: 1, maxLength: 200 }
        roleCode: { $ref: '#/components/schemas/RoleCode' }
        scopes: { $ref: '#/components/schemas/Scopes' }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time }
        reason: { $ref: '#/components/schemas/Reason' }
    ReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { $ref: '#/components/schemas/Reason' }

    RoleConflictStatus:
      type: string
      enum: [ACTIVE, RETIRED]
    RoleConflict:
      type: object
      additionalProperties: false
      description: Two roles that one subject must not hold at the same time (CC-002). `roleA` sorts before `roleB`.
      required: [id, roleA, roleB, reason, status, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        roleA: { $ref: '#/components/schemas/RoleCode' }
        roleB: { $ref: '#/components/schemas/RoleCode' }
        reason: { type: string }
        status: { $ref: '#/components/schemas/RoleConflictStatus' }
        createdBy: { $ref: '#/components/schemas/Actor' }
        createdAt: { type: string, format: date-time }
        retiredBy: { oneOf: [ { $ref: '#/components/schemas/Actor' }, { type: 'null' } ] }
        retiredAt: { oneOf: [ { type: string, format: date-time }, { type: 'null' } ] }
        retirementReason: { oneOf: [ { type: string }, { type: 'null' } ] }
    RoleConflictCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RoleConflict' } }
    CreateRoleConflictRequest:
      type: object
      additionalProperties: false
      required: [roleA, roleB, reason]
      properties:
        roleA: { $ref: '#/components/schemas/RoleCode' }
        roleB: { $ref: '#/components/schemas/RoleCode' }
        reason: { $ref: '#/components/schemas/Reason' }
    RoleConflictViolation:
      type: object
      additionalProperties: false
      description: A subject who currently holds both roles of an ACTIVE pair, with the assignments involved.
      required: [conflictId, roleA, roleB, subjectId, assignmentIds]
      properties:
        conflictId: { type: string, format: uuid }
        roleA: { $ref: '#/components/schemas/RoleCode' }
        roleB: { $ref: '#/components/schemas/RoleCode' }
        subjectId: { $ref: '#/components/schemas/SubjectId' }
        subjectUsername: { oneOf: [ { type: string }, { type: 'null' } ] }
        assignmentIds:
          type: array
          minItems: 2
          items: { type: string, format: uuid }
    RoleConflictViolationCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/RoleConflictViolation' } }

    SubjectDeactivation:
      type: object
      additionalProperties: false
      description: Result of a leaver deactivation (SEC-007). `revoked` lists what this call revoked.
      required: [subjectId, deactivatedAt, revokedCount, revoked]
      properties:
        subjectId: { $ref: '#/components/schemas/SubjectId' }
        deactivatedAt: { type: string, format: date-time }
        revokedCount: { type: integer, minimum: 0 }
        revoked: { type: array, items: { $ref: '#/components/schemas/RoleAssignment' } }

    AccessReviewStatus:
      type: string
      enum: [OPEN, CLOSED]
    AccessReviewItemStatus:
      type: string
      description: |
        PENDING = awaiting a decision; KEPT / REVOKED = decided by a reviewer; NOT_REVIEWED = still undecided when
        the review closed (nothing revoked); ENDED = the assignment was revoked or ended before anyone decided.
      enum: [PENDING, KEPT, REVOKED, NOT_REVIEWED, ENDED]
    AccessReviewDecision:
      type: string
      description: The decision as a string; a number (for example `1`) is refused with 400.
      enum: [KEEP, REVOKE]
    AccessReviewRequest:
      type: object
      additionalProperties: false
      required: [title, scopes, dueAt, reason]
      properties:
        title: { type: string, minLength: 3, maxLength: 200 }
        scopes: { $ref: '#/components/schemas/Scopes' }
        dueAt:
          type: string
          format: date-time
          description: Must be in the future and no later than `9999-12-31T23:59:59.999999Z` (RFC 3339 range).
        reason: { $ref: '#/components/schemas/Reason' }
    AccessReviewCounts:
      type: object
      additionalProperties: false
      description: Items by status; `overdue` counts the PENDING items once the due date has passed.
      required: [total, pending, overdue, kept, revoked, notReviewed, ended]
      properties:
        total: { type: integer, minimum: 0 }
        pending: { type: integer, minimum: 0 }
        overdue: { type: integer, minimum: 0 }
        kept: { type: integer, minimum: 0 }
        revoked: { type: integer, minimum: 0 }
        notReviewed: { type: integer, minimum: 0 }
        ended: { type: integer, minimum: 0 }
    AccessReview:
      type: object
      additionalProperties: false
      description: An access review campaign over a data scope (SEC-007).
      required: [id, title, scopes, dueAt, reason, status, createdBy, createdAt, overdue, counts]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        scopes: { $ref: '#/components/schemas/Scopes' }
        dueAt: { type: string, format: date-time }
        reason: { type: string }
        status: { $ref: '#/components/schemas/AccessReviewStatus' }
        createdBy: { $ref: '#/components/schemas/Actor' }
        createdAt: { type: string, format: date-time }
        closedBy: { oneOf: [ { $ref: '#/components/schemas/Actor' }, { type: 'null' } ] }
        closedAt: { oneOf: [ { type: string, format: date-time }, { type: 'null' } ] }
        closureReason: { oneOf: [ { type: string }, { type: 'null' } ] }
        overdue: { type: boolean, description: OPEN and past its due date }
        counts: { $ref: '#/components/schemas/AccessReviewCounts' }
        skippedUnderReview:
          oneOf: [ { type: integer, minimum: 0 }, { type: 'null' } ]
          description: |
            Only in the response to opening a review: assignments in scope that were not added because they are
            PENDING in another open review.
    AccessReviewCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AccessReview' } }
    AccessReviewItem:
      type: object
      additionalProperties: false
      description: |
        One assignment under review, with a snapshot of the assignment taken when the review opened, and the
        decision.
      required: [id, campaignId, campaignDueAt, assignmentId, subjectId, roleCode, scopes, assignedBy, validFrom,
                 status, overdue, decidedLate]
      properties:
        id: { type: string, format: uuid }
        campaignId: { type: string, format: uuid }
        campaignDueAt: { type: string, format: date-time }
        assignmentId: { type: string, format: uuid }
        subjectId: { $ref: '#/components/schemas/SubjectId' }
        subjectUsername: { oneOf: [ { type: string }, { type: 'null' } ] }
        roleCode: { $ref: '#/components/schemas/RoleCode' }
        scopes: { $ref: '#/components/schemas/Scopes' }
        assignedBy: { $ref: '#/components/schemas/Actor' }
        validFrom: { type: string, format: date-time }
        validTo: { oneOf: [ { type: string, format: date-time }, { type: 'null' } ] }
        status: { $ref: '#/components/schemas/AccessReviewItemStatus' }
        overdue: { type: boolean, description: PENDING and past the review's due date }
        decidedBy: { oneOf: [ { $ref: '#/components/schemas/Actor' }, { type: 'null' } ] }
        decidedAt: { oneOf: [ { type: string, format: date-time }, { type: 'null' } ] }
        decisionReason: { oneOf: [ { type: string }, { type: 'null' } ] }
        decidedLate: { type: boolean, description: Decided after the review's due date }
    AccessReviewItemCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AccessReviewItem' } }
    AccessReviewDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { $ref: '#/components/schemas/AccessReviewDecision' }
        reason:
          allOf: [ { $ref: '#/components/schemas/Reason' } ]
          description: Required for REVOKE, optional for KEEP
    OverdueAssignment:
      type: object
      additionalProperties: false
      required: [assignment, reviewDueSince]
      properties:
        assignment: { $ref: '#/components/schemas/RoleAssignment' }
        lastReviewedAt:
          oneOf: [ { type: string, format: date-time }, { type: 'null' } ]
          description: When a review last kept the assignment; null if never
        reviewDueSince:
          type: string
          format: date-time
          description: One review period after it was assigned or last kept
        pendingItemId:
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
          description: The assignment's PENDING item in an open review, if any
    OverdueAssignments:
      type: object
      additionalProperties: false
      required: [reviewPeriod, evaluatedAt, assignments]
      properties:
        reviewPeriod: { type: string, description: 'Configured review period, ISO-8601 (for example P3M)' }
        evaluatedAt: { type: string, format: date-time }
        assignments: { type: array, items: { $ref: '#/components/schemas/OverdueAssignment' } }

    Grant:
      type: object
      additionalProperties: false
      required: [roleCode, permissions, scopes, approvalLimits]
      properties:
        roleCode: { $ref: '#/components/schemas/RoleCode' }
        permissions: { type: array, items: { $ref: '#/components/schemas/PermissionCode' } }
        scopes: { $ref: '#/components/schemas/Scopes' }
        approvalLimits:
          type: array
          description: The role's approval limits (CC-003); they apply within this grant's scopes only.
          items: { $ref: '#/components/schemas/ApprovalLimit' }
        validTo: { oneOf: [ { type: string, format: date-time }, { type: 'null' } ] }
    EffectiveAuthorisation:
      type: object
      additionalProperties: false
      required: [subjectId, evaluatedAt, grants]
      properties:
        subjectId: { $ref: '#/components/schemas/SubjectId' }
        evaluatedAt: { type: string, format: date-time }
        grants: { type: array, items: { $ref: '#/components/schemas/Grant' } }

    Problem:
      type: object
      required: [status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        instance: { type: string }
        correlationId: { type: string }
        requirementRefs: { type: array, items: { type: string } }
        errors: { type: array, items: { type: object } }
