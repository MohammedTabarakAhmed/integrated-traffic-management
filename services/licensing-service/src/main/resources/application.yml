# licensing-service configuration. All environment-specific values come from environment variables
# (NFR-042, SEC-004); nothing secret is stored here.
spring:
  application:
    name: licensing-service
  # Secrets arrive as files, one per property, named after it (SEC-004, ADR-038): mounted by the platform
  # (Kubernetes secrets from the secret store; compose secrets locally), never as environment variables.
  config:
    import: "optional:configtree:${ITMS_SECRETS_DIR:/run/secrets/}"
  datasource:
    url: ${LIC_DB_URL}
    username: ${LIC_DB_USER:}
    password: ${LIC_DB_PASSWORD:}
  flyway:
    locations: classpath:db/platform,classpath:db/migration
    # Platform migrations (db/platform, V0_x) can be added after the service's own; apply them out of order
    # (ADR-040). Each is additive and touches only platform tables.
    out-of-order: true
  # Message broker (INT-005, ADR-002). Producer defaults are kept: acks=all and idempotence on.
  kafka:
    bootstrap-servers: ${ITMS_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  messages:
    basename: messages
    fallback-to-system-locale: false
  threads:
    virtual:
      enabled: true

itms:
  # Domain events and audit records leave through the transactional outbox (INT-005, CC-120, ADR-040). Off by default
  # so the service runs without a broker; rows wait in the outbox until the relay is switched on.
  events:
    enabled: ${ITMS_EVENTS_ENABLED:false}
    audit-topic: ${ITMS_EVENTS_AUDIT_TOPIC:itms.audit.v1}
    domain-topic: ${ITMS_EVENTS_DOMAIN_TOPIC:}
    batch-size: ${ITMS_EVENTS_BATCH_SIZE:100}
    send-timeout: ${ITMS_EVENTS_SEND_TIMEOUT:10s}
    relay-interval: ${ITMS_EVENTS_RELAY_INTERVAL:1s}
  security:
    issuer: ${ITMS_OIDC_ISSUER}
    jwk-set-uri: ${ITMS_OIDC_JWKS_URI}
    audience: itms-api
    # Grants come from iam-service (ADR-022). token-claims is the interim ADR-018 mode, for tests only.
    authorisation-source: ${ITMS_AUTHORISATION_SOURCE:iam}
    iam:
      base-url: ${ITMS_IAM_URL:}
      cache-ttl: ${ITMS_IAM_CACHE_TTL:60s}
  # Driving licences (DL-021…023, DL-050). BRD default probation 2 years (DL-050). One fees-service and
  # hold-eligibility-service code per paid transaction; condition codes are the list DL-023 gives examples of (Q-076).
  licensing:
    probation-months: ${ITMS_LICENSING_PROBATION_MONTHS:24}
    consumer-enabled: ${ITMS_LICENSING_CONSUMER_ENABLED:false}
    payment-topic: ${ITMS_LICENSING_PAYMENT_TOPIC:itms.payment-service.events.v1}
    service-codes:
      "[ISSUE]": LIC_ISSUE
      "[RENEWAL]": LIC_RENEWAL
      "[REPLACEMENT]": LIC_REPLACEMENT
      "[CHANGE]": LIC_CHANGE
    condition-codes: ${ITMS_LICENSING_CONDITION_CODES:CORRECTIVE_LENSES,HEARING_AID,ADAPTED_VEHICLE}
    # Renewal (DL-051; BRD default window 90 days). Eye test validity and the auto-renewal notice period are interim
    # answers (Q-077).
    renewal-window-days: ${ITMS_LICENSING_RENEWAL_WINDOW_DAYS:90}
    eye-test-validity-days: ${ITMS_LICENSING_EYE_TEST_VALIDITY_DAYS:180}
    lenses-condition: ${ITMS_LICENSING_LENSES_CONDITION:CORRECTIVE_LENSES}
    traffic-file-topic: ${ITMS_LICENSING_TRAFFIC_FILE_TOPIC:itms.traffic-file-service.events.v1}
    auto-renewal:
      enabled: ${ITMS_LICENSING_AUTO_RENEWAL_ENABLED:true}
      notice-days: ${ITMS_LICENSING_AUTO_RENEWAL_NOTICE_DAYS:14}
      interval: ${ITMS_LICENSING_AUTO_RENEWAL_INTERVAL:1h}
      batch-size: ${ITMS_LICENSING_AUTO_RENEWAL_BATCH_SIZE:200}
  # Calls to other services with this service's own client-credentials account (ADR-034).
  clients:
    fees:
      base-url: ${ITMS_FEES_URL:http://localhost:8086}
      token-uri: ${ITMS_OIDC_TOKEN_URI:http://localhost:8180/realms/itms/protocol/openid-connect/token}
      client-id: ${ITMS_SERVICE_CLIENT_ID:itms-licensing-service}
      client-secret: ${ITMS_SERVICE_CLIENT_SECRET:}
      timeout: ${ITMS_FEES_TIMEOUT:3s}
    payments:
      base-url: ${ITMS_PAYMENTS_URL:http://localhost:8094}
      token-uri: ${ITMS_OIDC_TOKEN_URI:http://localhost:8180/realms/itms/protocol/openid-connect/token}
      client-id: ${ITMS_SERVICE_CLIENT_ID:itms-licensing-service}
      client-secret: ${ITMS_SERVICE_CLIENT_SECRET:}
      timeout: ${ITMS_PAYMENTS_TIMEOUT:3s}
    holds:
      base-url: ${ITMS_HOLDS_URL:http://localhost:8084}
      token-uri: ${ITMS_OIDC_TOKEN_URI:http://localhost:8180/realms/itms/protocol/openid-connect/token}
      client-id: ${ITMS_SERVICE_CLIENT_ID:itms-licensing-service}
      client-secret: ${ITMS_SERVICE_CLIENT_SECRET:}
      timeout: ${ITMS_HOLDS_TIMEOUT:3s}
  # API_SPECIFICATION §2, ADR-032: submitting and deciding licence class versions need an Idempotency-Key; a retry with
  # the same key and request replays the stored response.
  idempotency:
    enabled: true
    paths:
      - /v1/licence-class-versions
      - /v1/licence-class-versions/*/approvals
      - /v1/licence-class-versions/*/rejections
      - /v1/licence-number-ranges
      - /v1/licence-number-ranges/*/approvals
      - /v1/licence-number-ranges/*/rejections
      - /v1/examination-transfers
      - /v1/examination-transfers/*/reversal
      - /v1/licence-issues
      - /v1/licences/*/conditions
      - /v1/licences/*/conditions/*/removal
      - /v1/licences/*/renewals
      - /v1/licences/*/replacements
      - /v1/licences/*/changes
      - /v1/licences/*/auto-renewal
      - /v1/licences/*/auto-renewal/withdrawal
      - /v1/eye-tests
    retention: ${ITMS_IDEMPOTENCY_RETENTION:24h}
    lock-timeout: ${ITMS_IDEMPOTENCY_LOCK_TIMEOUT:30s}
    cleanup-interval: ${ITMS_IDEMPOTENCY_CLEANUP_INTERVAL:15m}
    cleanup-batch-size: ${ITMS_IDEMPOTENCY_CLEANUP_BATCH_SIZE:500}

# Observability (NFR-040, ADR-037). Probes and the Prometheus scrape are served on a separate management port, reached
# only from the operations network; on that port they need no token (ManagementRequests). Traces and logs go to an
# OpenTelemetry collector only when its endpoints are set, for example
# MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://otel-collector:4318/v1/traces and
# MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT=http://otel-collector:4318/v1/logs.
management:
  server:
    port: ${ITMS_MANAGEMENT_PORT:8090}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
  tracing:
    sampling:
      probability: ${ITMS_TRACING_SAMPLING_PROBABILITY:0.1}

server:
  error:
    include-stacktrace: never
    include-message: never

# Log levels are set per service (NFR-040): ITMS_LOG_LEVEL for ITMS code, ITMS_LOG_LEVEL_ROOT for everything else.
logging:
  level:
    root: ${ITMS_LOG_LEVEL_ROOT:INFO}
    gov.itms: ${ITMS_LOG_LEVEL:INFO}
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
    correlation: "[%X{traceId:-},%X{spanId:-}] "
