      type: object
      additionalProperties: false
      required: [id, number, purpose, addressee, verificationCode, issuedOn, validUntil, issuedAt]
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        purpose: { type: string }
        addressee: { type: string }
        verificationCode: { type: string }
