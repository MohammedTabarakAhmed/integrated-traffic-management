  /v1/licences/{licenceId}/cancellations:
    post:
      tags: [Licence status]
      operationId: endLicence
      summary: Cancel a licence or record its surrender (DL-058)
      description: |
        `REQUEST` surrenders the licence; `DEATH` and `COURT_ORDER` cancel it and need the reference of the death record or
        order (422 `REFERENCE_REQUIRED`). Every class and live card is cancelled; `itms.licence.surrendered` or
        `itms.licence.cancelled` is published. A cancelled or surrendered licence never changes (409 `LICENCE_ENDED`).
        Deaths reported by the identity register (`itms.traffic-file.deceased`) cancel the person's licences automatically.
        Black-point suspensions come from violation-service (`itms.violation.licence-suspended`, VF-032, UAT-1): the licence
        and its classes are suspended to the end date and in force again the day after; with
        `itms.licensing.status.cancel-after-suspensions` set, that suspension cancels the licence instead (CONF-001, off by
        default).
      x-itms-permission: licensing.licence.cancel
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/LicenceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EndRequest' }
      responses:
        '200':
          description: OK
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
