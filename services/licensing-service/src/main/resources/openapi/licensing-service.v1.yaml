openapi: 3.1.0
info:
  title: ITMS Licensing Service
  version: 1.0.0
  description: |
    Driving licences (DL-020..DL-023, DL-050..DL-065). This version covers the licence class catalogue (slice 3.1), licence number ranges (slice 3.2), licences issued from passed examination files (slice 3.3) and renewal, automatic renewal, replacement, change of details, cards and eye tests (slice 3.4), cancellation, suspension, status enquiry and no-objection certificates (slice 3.5).

    Licence classes (DL-020, DL-062; BRD §6.2): a class (for example `LIGHT`) has rules per customer category —
    minimum age, optional maximum age, the required tests in order (test type codes of examination-service, DL-043),
    minimum training hours, whether medical fitness is needed, the validity in months and whether, for residents, the
    licence never outlives the residency. A rule without `customerCategory` applies to every category not listed. A
    class may record the gearbox of the test vehicle (`gearboxRecorded`, DL-022).

    Versions: a class version is submitted PENDING (`licensing.class.submit`) and approved or rejected once by someone
    else (`licensing.class.approve`); the maker may withdraw their own pending version. A version never starts in the
    past. Approving a version ends the previous approved version of the class the day before; an approved version that
    starts on or after the new start date is an overlap (409). Versions never change otherwise and are never deleted.

    Classes are national configuration, so their operations are `national` in scope.

    Licence numbers (DL-061; format per region, Q-022): a range of a region has a prefix, a width (digits, padded with
    zeros) and first and last numbers. A range is submitted PENDING (`licensing.number-range.submit`) and approved
    (ACTIVE) or rejected once by someone else (`licensing.number-range.approve`); the maker may withdraw their own.
    Ranges with the same prefix never overlap, in any region, so licence numbers are unique nationally. Licence issue
    takes the next number of the region from its earliest approved active range with numbers left. Every number
    handed out is kept; the report shows total, used and available numbers. Range operations are scoped to the region.
    The channel is the `X-Channel` header. Submitting and deciding need an `Idempotency-Key` (ADR-032).
    Only GET/POST are used (INT-003). Request input (SEC-022) is hardened once in itms-platform.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: Licence status
  - name: Licence transactions
  - name: Licence classes
  - name: Licence numbers
  - name: Licences

paths:
  /v1/licence-class-versions:
    post:
      tags: [Licence classes]
      operationId: submitLicenceClassVersion
      summary: Submit a licence class version for approval (DL-020, DL-062)
      description: |
        Refused when: no known `X-Channel` (422 `CHANNEL_REQUIRED`); a field is malformed (422 `FIELD_INVALID`);
        rules are missing, too many or repeat a category or a test (422 `LIST_SIZE_INVALID`, `LIST_DUPLICATES`); the
        maximum age is below the minimum (422 `CLASS_AGES_INVALID`); the end date is before the start
        (422 `CLASS_DATES_INVALID`) or the start is in the past (422 `CLASS_START_IN_PAST`).
      x-itms-permission: licensing.class.submit
      x-itms-scope: national
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitClassRequest' }
      responses:
        '201':
          description: Submitted (or, on a retry with the same Idempotency-Key, the stored response)
          headers:
            Location: { schema: { type: string } }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassVersion' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    get:
      tags: [Licence classes]
      operationId: listLicenceClassVersions
      summary: Versions of a licence class, oldest first, optionally of one status
      x-itms-permission: licensing.class.read
      x-itms-scope: national
      parameters:
        - name: classCode
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ClassCode' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/VersionStatus' }
      responses:
        '200':
          description: Versions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassVersionCollection' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/licence-class-versions/{versionId}:
    get:
      tags: [Licence classes]
      operationId: getLicenceClassVersion
      summary: A licence class version
      x-itms-permission: licensing.class.read
      x-itms-scope: national
      parameters:
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200':
          description: Licence class version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassVersion' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/licence-class-versions/{versionId}/approvals:
    post:
      tags: [Licence classes]
      operationId: approveLicenceClassVersion
      summary: Approve a pending licence class version (DL-020, CC-002)
      description: |
        Refused when the approver submitted it (403 `SAME_MAKER_CHECKER`), it is already decided (409
        `CLASS_VERSION_DECIDED`), it would overlap a later-starting approved version (409 `CLASS_VERSION_OVERLAP`) or
        its start date has passed (422 `CLASS_START_IN_PAST`).
      x-itms-permission: licensing.class.approve
      x-itms-scope: national
      parameters:
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '200':
          description: Approved
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassVersion' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/licence-class-versions/{versionId}/rejections:
    post:
      tags: [Licence classes]
      operationId: rejectLicenceClassVersion
      summary: Reject a pending licence class version, or withdraw one's own
      description: |
        A checker (`licensing.class.approve`) rejects; the maker may withdraw their own pending version. Refused when
        it is already decided (409 `CLASS_VERSION_DECIDED`).
      x-itms-permission: licensing.class.approve
      x-itms-scope: national
      parameters:
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectRequest' }
      responses:
        '200':
          description: Rejected or withdrawn
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassVersion' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/licence-classes:
    get:
      tags: [Licence classes]
      operationId: listLicenceClassesInForce
      summary: The version of every licence class in force on a date (today by default)
      x-itms-permission: licensing.class.read
      x-itms-scope: national
      parameters:
        - $ref: '#/components/parameters/OnDate'
      responses:
        '200':
          description: Classes in force, by class code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassVersionCollection' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/licence-classes/{classCode}:
    get:
      tags: [Licence classes]
      operationId: getLicenceClassInForce
      summary: The version of a licence class in force on a date (today by default)
      description: 404 `CLASS_NOT_IN_FORCE` when no approved version covers the date.
      x-itms-permission: licensing.class.read
      x-itms-scope: national
      parameters:
        - $ref: '#/components/parameters/ClassCodePath'
        - $ref: '#/components/parameters/OnDate'
      responses:
        '200':
          description: Class version in force
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassVersion' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/licence-classes/{classCode}/rules/{customerCategory}:
    get:
      tags: [Licence classes]
      operationId: getLicenceClassRule
      summary: The rule of a licence class for one customer category on a date (DL-020, DL-062)
      description: |
        The category's own rule, otherwise the rule for every other category. 404 `CLASS_NOT_IN_FORCE` when no
        approved version covers the date; 404 `CLASS_RULE_NOT_FOUND` when the class has no rule for the category.
      x-itms-permission: licensing.class.read
      x-itms-scope: national
      parameters:
        - $ref: '#/components/parameters/ClassCodePath'
        - name: customerCategory
          in: path
          required: true
          schema: { $ref: '#/components/schemas/CustomerCategory' }
        - $ref: '#/components/parameters/OnDate'
      responses:
        '200':
          description: The resolved rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResolvedRule' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/licence-number-ranges:
    post:
      tags: [Licence numbers]
      operationId: submitLicenceNumberRange
      summary: Submit a licence number range of a region for approval (DL-061)
      description: |
        Refused when: no known `X-Channel` (422 `CHANNEL_REQUIRED`); a field is malformed (422 `FIELD_INVALID`); the
        numbers are out of bounds (422 `NUMBER_RANGE_INVALID`) or do not fit the width (422 `NUMBER_WIDTH_INVALID`);
        a pending or active range with the same prefix overlaps, in any region (409 `NUMBER_RANGE_OVERLAP`).
      x-itms-permission: licensing.number-range.submit
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitNumberRangeRequest' }
      responses:
        '201':
          description: Submitted (or, on a retry with the same Idempotency-Key, the stored response)
          headers:
            Location: { schema: { type: string } }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NumberRange' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    get:
      tags: [Licence numbers]
      operationId: listLicenceNumberRanges
      summary: Licence number ranges of a region, or of every region the caller's grants reach
      x-itms-permission: licensing.number-range.read
      x-itms-scope: [region]
      parameters:
        - name: region
          in: query
          schema: { $ref: '#/components/schemas/Region' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/NumberRangeStatus' }
      responses:
        '200':
          description: Ranges
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NumberRangeCollection' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/licence-number-ranges/{rangeId}:
    get:
      tags: [Licence numbers]
      operationId: getLicenceNumberRange
      summary: A licence number range with its used and available numbers
      x-itms-permission: licensing.number-range.read
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/RangeId'
      responses:
        '200':
          description: Range
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NumberRange' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/licence-number-ranges/{rangeId}/approvals:
    post:
      tags: [Licence numbers]
      operationId: approveLicenceNumberRange
      summary: Approve a pending licence number range (DL-061, CC-002)
      description: |
        Refused when the approver submitted it (403 `SAME_MAKER_CHECKER`), it is already decided (409
        `NUMBER_RANGE_DECIDED`) or a range with the same prefix now overlaps (409 `NUMBER_RANGE_OVERLAP`).
      x-itms-permission: licensing.number-range.approve
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/RangeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '200':
          description: Approved; numbers are handed out from it
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NumberRange' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/licence-number-ranges/{rangeId}/rejections:
    post:
      tags: [Licence numbers]
      operationId: rejectLicenceNumberRange
      summary: Reject a pending licence number range, or withdraw one's own
      description: |
        A checker (`licensing.number-range.approve`) rejects; the maker may withdraw their own pending range. Refused
        when it is already decided (409 `NUMBER_RANGE_DECIDED`).
      x-itms-permission: licensing.number-range.approve
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/RangeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectRequest' }
      responses:
        '200':
          description: Rejected or withdrawn
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NumberRange' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/licence-number-ranges/{rangeId}/numbers:
    get:
      tags: [Licence numbers]
      operationId: listUsedLicenceNumbers
      summary: Numbers handed out from a range, in order, with what they went to (DL-061)
      x-itms-permission: licensing.number-range.read
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/RangeId'
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: Used numbers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsedNumberCollection' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/licence-number-reports/{region}:
    get:
      tags: [Licence numbers]
      operationId: getLicenceNumberReport
      summary: Available and used licence numbers of a region, per range and in total (DL-061)
      description: Rejected ranges are left out; pending ranges show but count as not yet available.
      x-itms-permission: licensing.number-range.read
      x-itms-scope: [region]
      parameters:
        - name: region
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Region' }
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NumberReport' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/examination-transfers:
    post:
      tags: [Licences]
      operationId: receiveExaminationTransfer
      summary: Hand a passed examination file over to licensing (DL-036)
      description: |
        Sent by examination-service with its own account. One transfer per examination file and class (409
        `TRANSFER_EXISTS`); the pass date may not lie in the future (422 `PASSED_IN_FUTURE`).
      x-itms-permission: licensing.transfer.receive
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferRequest' }
      responses:
        '201':
          description: Received
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    get:
      tags: [Licences]
      operationId: listExaminationTransfers
      summary: A person's examination transfers, newest first, in the caller's regions
      x-itms-permission: licensing.licence.read
      x-itms-scope: [region]
      parameters:
        - name: trafficFileNumber
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Ref' }
      responses:
        '200':
          description: Transfers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferCollection' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/examination-transfers/{transferId}:
    get:
      tags: [Licences]
      operationId: getExaminationTransfer
      summary: One examination transfer
      x-itms-permission: licensing.licence.read
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: Transfer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/examination-transfers/{transferId}/reversal:
    post:
      tags: [Licences]
      operationId: reverseExaminationTransfer
      summary: Reverse a transfer, with a reason, while no licence was issued from it (DL-036)
      description: |
        Refused when the transfer was used or reversed already (409 `TRANSFER_NOT_OPEN`) or a licence request waiting
        for payment uses it (409 `TRANSFER_IN_REQUEST`). Publishes `itms.licensing.transfer-reversed`.
      x-itms-permission: licensing.transfer.reverse
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/TransferId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectRequest' }
      responses:
        '200':
          description: Reversed
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/licence-issues:
    post:
      tags: [Licences]
      operationId: requestLicenceIssue
      summary: Ask for a new licence from passed examination files (DL-050)
      description: |
        Checks, before any fee: every transfer is open and of this person, one per class (422
        `LICENCE_CLASS_DUPLICATE`); the person holds no licence in force (409 `LICENCE_EXISTS`, use add class, DL-053)
        and has no other issue request waiting (409 `REQUEST_OPEN`); the conditions are in the list (422
        `CONDITION_UNKNOWN`); each class has a rule in force for the customer category (404 `CLASS_NOT_IN_FORCE`,
        `CLASS_RULE_NOT_FOUND`); a residency end date is given when a class links validity to it (422
        `RESIDENCY_EXPIRY_REQUIRED`, `RESIDENCY_ENDED`); no hold blocks service `LIC_ISSUE` for the traffic file (422
        `ELIGIBILITY_BLOCKED` with `blocks` and `nextStep`). Then the fee is quoted at fees-service (quantity `CLASSES`)
        and the payable registered at payment-service (item reference `LR-<request id>`). When payment-service
        confirms payment, the licence is issued: the next number of the region (DL-061), one class per transfer with
        its own issue date (DL-021), automatic-only when tested in an automatic vehicle of a class recording the
        gearbox (DL-022), the conditions (DL-023), the shortest validity of its classes for the customer category and
        never past a linked residency (DL-062), probation for a first licence (DL-050); `itms.licence.issued` is
        published. 503 when fees-service, payment-service or hold-eligibility-service cannot be reached.
      x-itms-permission: licensing.licence.issue
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueRequest' }
      responses:
        '201':
          description: Request opened; waits for payment
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LicenceRequest' }
        '400': { $ref: '#/components/responses/Problem' }
