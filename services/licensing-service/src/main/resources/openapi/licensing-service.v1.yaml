  /v1/licences/{licenceId}/renewals:
    post:
      tags: [Licence transactions]
      operationId: requestLicenceRenewal
      summary: Ask for a licence renewal (DL-051)
      description: |
        Allowed from `itms.licensing.renewal-window-days` (default 90) before expiry and after it (422 `RENEWAL_TOO_EARLY`);
        only an ACTIVE licence (409 `LICENCE_NOT_ACTIVE`) with no other request waiting (409 `REQUEST_OPEN`). A passed eye
        test of the last `eye-test-validity-days` covering every class in force is needed (422 `EYE_TEST_REQUIRED`). The new
        expiry runs from the current one (from today when expired) for the shortest class validity of the customer category,
        never past a linked residency (422 `RESIDENCY_TOO_SHORT`). Holds are checked for service `LIC_RENEWAL` (422
        `ELIGIBILITY_BLOCKED`); the fee is quoted with the current expiry date so fees-service adds the late fee. On payment
        the licence is renewed, the corrective lenses condition added when the eye test needs it, a new card issued and
        `itms.licence.renewed` published.
      x-itms-permission: licensing.licence.renew
      x-itms-scope: [region]
