      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [countryCode, mode, reason]
              properties:
                countryCode: { $ref: '#/components/schemas/CountryCode' }
                mode: { type: string, enum: [DIRECT_EXCHANGE, TEST_REQUIRED] }
                classMap:
                  type: object
                  maxProperties: 30
                  propertyNames: { pattern: '^[A-Z][A-Z0-9_]{0,39}$' }
                  additionalProperties: { $ref: '#/components/schemas/Code' }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '201': { description: Rule submitted for approval, content: { application/json: { schema: { $ref: '#/components/schemas/CountryRule' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listExchangeCountryRules
      summary: Foreign-licence exchange rules per country (DL-054)
      tags: [Foreign licences]
      x-itms-permission: licensing.licence.read
      x-itms-scope: national
      parameters:
        - { name: countryCode, in: query, required: false, schema: { $ref: '#/components/schemas/CountryCode' } }
      responses:
        '200': { description: Exchange country rules, content: { application/json: { schema: { $ref: '#/components/schemas/CountryRuleCollection' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/exchange-country-rules/{ruleId}/approvals:
    post:
      operationId: approveExchangeCountryRule
      summary: Approve a proposed exchange rule (checker, never the maker; CC-002)
      tags: [Foreign licences]
      x-itms-permission: licensing.exchange-country.approve
      x-itms-scope: national
      parameters:
        - $ref: '#/components/parameters/RuleId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '200': { description: Rule approved; the earlier rule of the country is superseded, content: { application/json: { schema: { $ref: '#/components/schemas/CountryRule' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/exchange-country-rules/{ruleId}/rejections:
    post:
      operationId: rejectExchangeCountryRule
      summary: Reject a proposed exchange rule (checker), or withdraw it (its maker)
      tags: [Foreign licences]
      x-itms-permission: licensing.exchange-country.approve
      x-itms-scope: national
      parameters:
        - $ref: '#/components/parameters/RuleId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectRequest' }
      responses:
        '200': { description: Rule rejected or withdrawn, content: { application/json: { schema: { $ref: '#/components/schemas/CountryRule' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/foreign-licences:
    post:
      operationId: recordForeignLicence
      summary: Record a foreign licence on a traffic file (DL-063)
      tags: [Foreign licences]
      x-itms-permission: licensing.foreign.record
      x-itms-scope: national
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [trafficFileNumber, countryCode, foreignNumber, classes, expiresOn, language, documentId]
              properties:
                trafficFileNumber: { $ref: '#/components/schemas/Ref' }
                countryCode: { $ref: '#/components/schemas/CountryCode' }
                foreignNumber: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_./:-]{0,59}$' }
                classes: { type: array, minItems: 1, maxItems: 30, uniqueItems: true, items: { $ref: '#/components/schemas/Code' } }
                issuedOn: { type: [string, 'null'], format: date }
                expiresOn: { type: string, format: date }
                language: { type: string, pattern: '^[a-z]{2,3}$' }
                documentId: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_./:-]{0,59}$' }
                translationDocumentId: { type: [string, 'null'], pattern: '^[A-Za-z0-9][A-Za-z0-9_./:-]{0,59}$' }
      responses:
        '201': { description: Foreign licence recorded, content: { application/json: { schema: { $ref: '#/components/schemas/ForeignLicence' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listForeignLicences
      summary: Foreign licences of a traffic file, or the master file by country and expiry (DL-063)
      tags: [Foreign licences]
      x-itms-permission: licensing.licence.read
      x-itms-scope: national
      parameters:
        - { name: trafficFileNumber, in: query, required: false, schema: { $ref: '#/components/schemas/Ref' } }
        - { name: countryCode, in: query, required: false, schema: { $ref: '#/components/schemas/CountryCode' } }
        - { name: expiringBefore, in: query, required: false, schema: { type: string, format: date } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 100 } }
      responses:
        '200': { description: Foreign licence records, content: { application/json: { schema: { $ref: '#/components/schemas/ForeignLicenceCollection' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/foreign-licences/{foreignLicenceId}/exchanges:
    post:
      operationId: requestForeignLicenceExchange
      summary: Exchange a valid foreign licence for a local one; issued on payment (DL-054)
      tags: [Foreign licences]
      x-itms-permission: licensing.licence.exchange
      x-itms-scope: [region]
      parameters:
        - { name: foreignLicenceId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [region, customerCategory]
              properties:
                region: { $ref: '#/components/schemas/Region' }
                customerCategory: { $ref: '#/components/schemas/CustomerCategory' }
                residencyExpiresOn: { type: [string, 'null'], format: date }
                delivery: { oneOf: [ { $ref: '#/components/schemas/Delivery' }, { type: 'null' } ] }
                address: { type: [string, 'null'], minLength: 5, maxLength: 300 }
      responses:
        '201': { description: Exchange awaiting payment, content: { application/json: { schema: { $ref: '#/components/schemas/LicenceRequest' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/temporary-permits:
    post:
      operationId: requestTemporaryPermit
      summary: Request a temporary driving permit for a visitor or while the card is pending (DL-055)
      tags: [Temporary permits]
      x-itms-permission: licensing.permit.issue
      x-itms-scope: [region]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, trafficFileNumber, region]
              properties:
                kind: { type: string, enum: [VISITOR, CARD_PENDING] }
                trafficFileNumber: { $ref: '#/components/schemas/Ref' }
                region: { $ref: '#/components/schemas/Region' }
                licenceId: { type: [string, 'null'], format: uuid }
                foreignLicenceId: { type: [string, 'null'], format: uuid }
      responses:
        '201': { description: Permit request awaiting payment, content: { application/json: { schema: { $ref: '#/components/schemas/LicenceRequest' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listTemporaryPermits
      summary: Temporary permits of a traffic file, or the master file by expiry (DL-063)
      tags: [Temporary permits]
      x-itms-permission: licensing.licence.read
      x-itms-scope: national
      parameters:
        - { name: trafficFileNumber, in: query, required: false, schema: { $ref: '#/components/schemas/Ref' } }
        - { name: expiringBefore, in: query, required: false, schema: { type: string, format: date } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 100 } }
      responses:
        '200': { description: Temporary permits, content: { application/json: { schema: { $ref: '#/components/schemas/TemporaryPermitCollection' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/temporary-permits/{permitId}/cancellation:
    post:
      operationId: cancelTemporaryPermit
      summary: Cancel a temporary driving permit with a reason (DL-055)
      tags: [Temporary permits]
      x-itms-permission: licensing.permit.issue
      x-itms-scope: [region]
      parameters:
        - { name: permitId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectRequest' }
      responses:
        '200': { description: Temporary permit cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/TemporaryPermit' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/licences/{licenceId}/international-permits:
    post:
      operationId: requestInternationalPermit
      summary: Request an international driving permit against a valid licence (DL-056)
      tags: [International permits]
      x-itms-permission: licensing.idp.issue
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/LicenceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                printer: { oneOf: [ { $ref: '#/components/schemas/Code' }, { type: 'null' } ] }
      responses:
        '201': { description: Permit request awaiting payment, content: { application/json: { schema: { $ref: '#/components/schemas/LicenceRequest' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listInternationalPermits
      summary: International driving permits of a licence (DL-056)
      tags: [International permits]
      x-itms-permission: licensing.licence.read
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/LicenceId'
      responses:
        '200': { description: International permits, content: { application/json: { schema: { $ref: '#/components/schemas/InternationalPermitCollection' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/international-permits/{permitId}/printed:
    post:
      operationId: recordInternationalPermitPrint
      summary: The centre or approved partner reports the permit printed (DL-056)
      tags: [International permits]
      x-itms-permission: licensing.idp.print
      x-itms-scope: national
      parameters:
        - { name: permitId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [printer]
              properties:
                printer: { $ref: '#/components/schemas/Code' }
      responses:
        '200': { description: Print recorded, content: { application/json: { schema: { $ref: '#/components/schemas/InternationalPermit' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    VersionId:
      name: versionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClassCodePath:
      name: classCode
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ClassCode' }
    OnDate:
      name: on
      in: query
      description: The date to read for (YYYY-MM-DD); today when absent
      schema: { type: string, format: date }
    RangeId:
      name: rangeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TransferId:
      name: transferId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RuleId:
      name: ruleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LicenceId:
      name: licenceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Chosen by the client, new for every intended action, and sent again unchanged on a retry (API_SPECIFICATION
        §2, ADR-032). A retry with the same key and request gets the stored response, marked `Idempotent-Replayed`.
      schema: { type: string, pattern: '^[A-Za-z0-9._:-]{8,128}$' }

  headers:
    IdempotentReplayed:
      description: '`true` when the response is the stored response of an earlier request with the same Idempotency-Key'
      schema: { type: string, enum: ['true'] }

  responses:
    Unauthorized:
      description: Missing or invalid bearer token
    Problem:
      description: Problem details (RFC 9457, API_SPECIFICATION §3)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    ClassCode:
      type: string
      pattern: '^[A-Z][A-Z0-9_]{0,19}$'
    CustomerCategory:
      type: string
      pattern: '^[A-Z][A-Z0-9_]{0,39}$'
    TestType:
      type: string
      pattern: '^[A-Z][A-Z0-9_]{0,29}$'
    Channel:
      type: string
      enum: [PORTAL, APP, BACKOFFICE, PARTNER, KIOSK, CALLCENTRE, FIELD, ASSISTANT, AGENT]
    VersionStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
    CategoryRule:
      type: object
      additionalProperties: false
      required: [minAgeYears, minTrainingHours, medicalRequired, validityMonths, residencyLinked]
      properties:
        customerCategory:
          description: The customer category; absent or null = every category not listed
          oneOf: [ { $ref: '#/components/schemas/CustomerCategory' }, { type: 'null' } ]
        minAgeYears: { type: integer, minimum: 10, maximum: 120 }
        maxAgeYears: { oneOf: [ { type: integer, minimum: 10, maximum: 120 }, { type: 'null' } ] }
        requiredTests:
          type: array
          maxItems: 10
          description: Test type codes of examination-service (DL-043), in the order they are taken
          items: { $ref: '#/components/schemas/TestType' }
        minTrainingHours: { type: integer, minimum: 0, maximum: 1000 }
        medicalRequired: { type: boolean }
        validityMonths: { type: integer, minimum: 1, maximum: 240 }
        residencyLinked:
          type: boolean
          description: For residents, the licence never outlives the residency (DL-062)
    SubmitClassRequest:
      type: object
      additionalProperties: false
      required: [classCode, nameNl, nameEn, vehicleTypeNl, vehicleTypeEn, gearboxRecorded, rules, effectiveFrom,
                 reason]
      properties:
        classCode: { $ref: '#/components/schemas/ClassCode' }
        nameNl: { type: string, maxLength: 200 }
        nameEn: { type: string, maxLength: 200 }
        vehicleTypeNl: { type: string, maxLength: 200 }
        vehicleTypeEn: { type: string, maxLength: 200 }
        gearboxRecorded:
          type: boolean
          description: The gearbox of the test vehicle is recorded; automatic restricts the class (DL-022)
        rules: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/CategoryRule' } }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { oneOf: [ { type: string, format: date }, { type: 'null' } ] }
        reason: { type: string, minLength: 3, maxLength: 500 }
    DecisionRequest:
      type: object
      additionalProperties: false
      properties:
        reason: { oneOf: [ { type: string, minLength: 3, maxLength: 500 }, { type: 'null' } ] }
    RejectRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
    Decision:
      type: object
      additionalProperties: false
      required: [actorId, channel, at]
      properties:
        actorId: { type: string }
        actorUsername: { oneOf: [ { type: string }, { type: 'null' } ] }
        channel: { $ref: '#/components/schemas/Channel' }
        at: { type: string, format: date-time }
        reason: { oneOf: [ { type: string }, { type: 'null' } ] }
    ClassVersion:
      type: object
      additionalProperties: false
      required: [id, classCode, versionNo, nameNl, nameEn, vehicleTypeNl, vehicleTypeEn, gearboxRecorded, rules,
                 effectiveFrom, status, submitted]
      properties:
        id: { type: string, format: uuid }
        classCode: { type: string }
        versionNo: { type: integer, minimum: 1 }
        nameNl: { type: string }
        nameEn: { type: string }
        vehicleTypeNl: { type: string }
        vehicleTypeEn: { type: string }
        gearboxRecorded: { type: boolean }
        rules: { type: array, items: { $ref: '#/components/schemas/CategoryRule' } }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { oneOf: [ { type: string, format: date }, { type: 'null' } ] }
        status: { $ref: '#/components/schemas/VersionStatus' }
        submitted: { $ref: '#/components/schemas/Decision' }
        decided: { oneOf: [ { $ref: '#/components/schemas/Decision' }, { type: 'null' } ] }
    ClassVersionCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ClassVersion' } }
    ResolvedRule:
      type: object
      additionalProperties: false
      required: [classCode, versionId, versionNo, customerCategory, gearboxRecorded, rule]
      properties:
        classCode: { type: string }
        versionId: { type: string, format: uuid }
        versionNo: { type: integer, minimum: 1 }
        customerCategory: { type: string }
        gearboxRecorded: { type: boolean }
        rule: { $ref: '#/components/schemas/CategoryRule' }
    Region:
      type: string
      pattern: '^[A-Z][A-Z0-9_]{0,39}$'
    NumberRangeStatus:
      type: string
      enum: [PENDING, ACTIVE, REJECTED]
    SubmitNumberRangeRequest:
      type: object
      additionalProperties: false
      required: [region, width, firstNumber, lastNumber, reason]
      properties:
        region: { $ref: '#/components/schemas/Region' }
        prefix:
          type: string
          pattern: '^[A-Z0-9]{0,5}$'
          description: Shown before the number; empty when absent
        width: { type: integer, minimum: 1, maximum: 12, description: Digits shown, padded with zeros }
        firstNumber: { type: integer, format: int64, minimum: 1, maximum: 999999999999 }
        lastNumber: { type: integer, format: int64, minimum: 1, maximum: 999999999999 }
        reason: { type: string, minLength: 3, maxLength: 500 }
    NumberRange:
      type: object
      additionalProperties: false
      required: [id, region, prefix, width, firstNumber, lastNumber, nextNumber, status, total, used, available,
                 submitted]
      properties:
        id: { type: string, format: uuid }
        region: { type: string }
        prefix: { type: string }
        width: { type: integer }
        firstNumber: { type: integer, format: int64 }
        lastNumber: { type: integer, format: int64 }
        nextNumber: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/NumberRangeStatus' }
        total: { type: integer, format: int64 }
        used: { type: integer, format: int64 }
        available: { type: integer, format: int64 }
        submitted: { $ref: '#/components/schemas/Decision' }
        decided: { oneOf: [ { $ref: '#/components/schemas/Decision' }, { type: 'null' } ] }
    NumberRangeCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/NumberRange' } }
    NumberReport:
      type: object
      additionalProperties: false
      required: [region, ranges, total, used, available]
      properties:
        region: { type: string }
        ranges: { type: array, items: { $ref: '#/components/schemas/NumberRange' } }
        total: { type: integer, format: int64, description: Numbers in the active ranges }
        used: { type: integer, format: int64 }
        available: { type: integer, format: int64 }
    UsedNumber:
      type: object
      additionalProperties: false
      required: [licenceNumber, rangeId, region, number, allocatedAt, allocatedTo]
      properties:
        licenceNumber: { type: string }
        rangeId: { type: string, format: uuid }
        region: { type: string }
        number: { type: integer, format: int64 }
        allocatedAt: { type: string, format: date-time }
        allocatedTo: { type: string, description: The licence or permit the number went to }
    UsedNumberCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/UsedNumber' } }
    Ref:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,59}$'
    Code:
      type: string
      pattern: '^[A-Z][A-Z0-9_]{0,39}$'
    Gearbox:
      type: string
      enum: [MANUAL, AUTOMATIC]
    TransferStatus:
      type: string
      enum: [TRANSFERRED, REVERSED, USED]
    TransferRequest:
      type: object
      additionalProperties: false
