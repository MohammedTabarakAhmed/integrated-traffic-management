        noticeAt: { oneOf: [ { type: string, format: date-time }, { type: 'null' } ] }
        attemptForExpiry: { oneOf: [ { type: string, format: date }, { type: 'null' } ] }
        withdrawnAt: { oneOf: [ { type: string, format: date-time }, { type: 'null' } ] }
    EndRequest:
      type: object
      additionalProperties: false
      required: [ground, reason]
      properties:
        ground: { type: string, enum: [REQUEST, DEATH, COURT_ORDER] }
        reference: { oneOf: [ { type: string, minLength: 3, maxLength: 200 }, { type: 'null' } ] }
        reason: { type: string, minLength: 3, maxLength: 500 }
    Suspension:
      type: object
      additionalProperties: false
      required: [id, source, sourceRef, ordinal, from, until, receivedAt]
      properties:
        id: { type: string, format: uuid }
        source: { type: string }
        sourceRef: { type: string }
        ordinal: { type: integer }
        from: { type: string, format: date }
        until: { type: string, format: date }
        receivedAt: { type: string, format: date-time }
    SuspensionCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Suspension' } }
    LicenceStatus:
      type: object
      additionalProperties: false
      required: [licenceNumber, status, expiresOn, probationary, classes]
      properties:
        licenceNumber: { type: string }
        status: { type: string, enum: [ACTIVE, EXPIRED, SUSPENDED, CANCELLED, SURRENDERED] }
