          maxItems: 10
          items: { type: string, format: uuid }
        customerCategory: { $ref: '#/components/schemas/CustomerCategory' }
        residencyExpiresOn: { oneOf: [ { type: string, format: date }, { type: 'null' } ] }
        conditions:
          oneOf:
            - { type: array, maxItems: 20, items: { $ref: '#/components/schemas/ConditionRequest' } }
            - { type: 'null' }
        delivery: { oneOf: [ { $ref: '#/components/schemas/Delivery' }, { type: 'null' } ] }
        address: { oneOf: [ { type: string, minLength: 5, maxLength: 300 }, { type: 'null' } ] }
    AddConditionRequest:
      type: object
      additionalProperties: false
      required: [code, reason]
      properties:
        code: { $ref: '#/components/schemas/Code' }
        note: { oneOf: [ { type: string, maxLength: 200 }, { type: 'null' } ] }
        reason: { type: string, minLength: 3, maxLength: 500 }
    RequestKind:
      type: string
      enum: [ISSUE, RENEWAL, REPLACEMENT, CHANGE, NOC, EXCHANGE, TEMP_PERMIT, IDP]
    LicenceRequest:
      type: object
      additionalProperties: false
      required: [id, kind, status, trafficFileNumber, region, amountMinor, transferIds, requestedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/RequestKind' }
        status: { type: string, enum: [AWAITING_PAYMENT, COMPLETED] }
        licenceId: { oneOf: [ { type: string, format: uuid }, { type: 'null' } ] }
        trafficFileNumber: { type: string }
        region: { type: string }
        payableId: { oneOf: [ { type: string, format: uuid }, { type: 'null' } ] }
        amountMinor: { type: integer, format: int64 }
        currency: { oneOf: [ { type: string }, { type: 'null' } ] }
        transferIds: { type: array, items: { type: string, format: uuid } }
        requestedAt: { type: string, format: date-time }
        completedAt: { oneOf: [ { type: string, format: date-time }, { type: 'null' } ] }
    LicenceClass:
      type: object
      additionalProperties: false
      required: [classCode, classVersionId, issuedOn, status, automaticOnly]
      properties:
        classCode: { type: string }
        classVersionId: { type: string, format: uuid }
        issuedOn: { type: string, format: date }
        status: { type: string, enum: [ACTIVE, SUSPENDED, CANCELLED] }
        automaticOnly: { type: boolean, description: Tested in an automatic vehicle (DL-022) }
    Condition:
      type: object
      additionalProperties: false
      required: [code, since]
      properties:
        code: { type: string }
        note: { oneOf: [ { type: string }, { type: 'null' } ] }
        since: { type: string, format: date }
    Licence:
      type: object
      additionalProperties: false
      required: [id, licenceNumber, trafficFileNumber, region, customerCategory, status, issuedOn, expiresOn,
                 probationary, classes, conditions, version]
      properties:
        id: { type: string, format: uuid }
        licenceNumber: { type: string }
        trafficFileNumber: { type: string }
        region: { type: string }
        customerCategory: { type: string }
        status: { type: string, enum: [ACTIVE, EXPIRED, SUSPENDED, CANCELLED, SURRENDERED] }
        issuedOn: { type: string, format: date }
        expiresOn: { type: string, format: date }
        probationUntil: { oneOf: [ { type: string, format: date }, { type: 'null' } ] }
        probationary: { type: boolean }
        residencyExpiresOn: { oneOf: [ { type: string, format: date }, { type: 'null' } ] }
        suspendedUntil: { oneOf: [ { type: string, format: date }, { type: 'null' } ] }
        classes: { type: array, items: { $ref: '#/components/schemas/LicenceClass' } }
        conditions: { type: array, items: { $ref: '#/components/schemas/Condition' } }
        version: { type: integer, format: int64 }
    LicenceCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Licence' } }
    HistoryEntry:
      type: object
      additionalProperties: false
      required: [event, actorId, detail, at]
      properties:
        event: { type: string }
        actorId: { type: string }
        detail: { type: object }
        at: { type: string, format: date-time }
    HistoryCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } }
    CodeCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { type: string } }
    Delivery:
      type: string
      enum: [CENTRE, COURIER]
      description: Printed at a centre, or by a card printer with courier delivery (DL-060); address needed for COURIER
    RenewRequest:
      type: object
      additionalProperties: false
      properties:
        customerCategory: { oneOf: [ { $ref: '#/components/schemas/CustomerCategory' }, { type: 'null' } ] }
        residencyExpiresOn: { oneOf: [ { type: string, format: date }, { type: 'null' } ] }
        delivery: { oneOf: [ { $ref: '#/components/schemas/Delivery' }, { type: 'null' } ] }
        address: { oneOf: [ { type: string, minLength: 5, maxLength: 300 }, { type: 'null' } ] }
    ReplacementRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, enum: [LOST, DAMAGED] }
        delivery: { oneOf: [ { $ref: '#/components/schemas/Delivery' }, { type: 'null' } ] }
        address: { oneOf: [ { type: string, minLength: 5, maxLength: 300 }, { type: 'null' } ] }
    ChangeRequest:
      type: object
      additionalProperties: false
      required: [description, evidenceDocumentId]
      properties:
        customerCategory: { oneOf: [ { $ref: '#/components/schemas/CustomerCategory' }, { type: 'null' } ] }
        residencyExpiresOn: { oneOf: [ { type: string, format: date }, { type: 'null' } ] }
        description: { type: string, minLength: 3, maxLength: 500 }
        evidenceDocumentId: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,99}$' }
        delivery: { oneOf: [ { $ref: '#/components/schemas/Delivery' }, { type: 'null' } ] }
        address: { oneOf: [ { type: string, minLength: 5, maxLength: 300 }, { type: 'null' } ] }
    Card:
      type: object
      additionalProperties: false
      required: [id, serial, reason, delivery, status, createdAt, statusAt]
      properties:
        id: { type: string, format: uuid }
        serial: { type: integer }
        reason: { type: string, enum: [ISSUE, RENEWAL, REPLACEMENT, CHANGE, CLASS_ADDED] }
        delivery: { $ref: '#/components/schemas/Delivery' }
        address: { oneOf: [ { type: string }, { type: 'null' } ] }
        status:
          type: string
          enum: [PENDING_PRINT, SENT_TO_PRINTER, PRINTED, DISPATCHED, DELIVERED, COLLECTED, RETURNED, CANCELLED]
        trackingRef: { oneOf: [ { type: string }, { type: 'null' } ] }
        createdAt: { type: string, format: date-time }
        statusAt: { type: string, format: date-time }
    CardCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Card' } }
    EyeTestRequest:
      type: object
      additionalProperties: false
      required: [trafficFileNumber, centreCode, reference, testedOn, result, correctiveLenses]
      properties:
        trafficFileNumber: { $ref: '#/components/schemas/Ref' }
        centreCode: { $ref: '#/components/schemas/Code' }
        reference: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,99}$' }
        testedOn: { type: string, format: date }
        result: { type: string, enum: [PASS, FAIL] }
        correctiveLenses: { type: boolean }
        permittedClasses:
          oneOf:
            - { type: array, maxItems: 30, items: { $ref: '#/components/schemas/Code' } }
            - { type: 'null' }
    EyeTest:
      type: object
      additionalProperties: false
      required: [id, trafficFileNumber, centreCode, reference, testedOn, result, correctiveLenses, permittedClasses,
                 receivedAt]
      properties:
        id: { type: string, format: uuid }
        trafficFileNumber: { type: string }
        centreCode: { type: string }
        reference: { type: string }
        testedOn: { type: string, format: date }
        result: { type: string, enum: [PASS, FAIL] }
        correctiveLenses: { type: boolean }
        permittedClasses: { type: array, items: { type: string } }
        receivedAt: { type: string, format: date-time }
    EyeTestCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/EyeTest' } }
    ConsentRequest:
      type: object
      additionalProperties: false
      required: [paymentMethodRef]
      properties:
        paymentMethodRef: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,99}$' }
    AutoRenewal:
      type: object
      additionalProperties: false
