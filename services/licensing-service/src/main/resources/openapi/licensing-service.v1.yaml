      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ForeignLicence' } }
    TemporaryPermit:
      type: object
      required: [id, permitNumber, kind, trafficFileNumber, region, classes, validFrom, validUntil, status, issuedAt]
      properties:
        id: { type: string, format: uuid }
        permitNumber: { type: string }
        kind: { type: string, enum: [VISITOR, CARD_PENDING] }
        trafficFileNumber: { type: string }
        region: { type: string }
        licenceId: { type: [string, 'null'], format: uuid }
        foreignLicenceId: { type: [string, 'null'], format: uuid }
        classes: { type: array, items: { type: string } }
        validFrom: { type: string, format: date }
        validUntil: { type: string, format: date }
        status: { type: string, enum: [ACTIVE, EXPIRED, CANCELLED] }
        issuedAt: { type: string, format: date-time }
    TemporaryPermitCollection:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/TemporaryPermit' } }
    InternationalPermit:
      type: object
      required: [id, permitNumber, licenceId, issuedOn, validUntil, printer, status, issuedAt]
      properties:
        id: { type: string, format: uuid }
        permitNumber: { type: string }
        licenceId: { type: string, format: uuid }
        issuedOn: { type: string, format: date }
        validUntil: { type: string, format: date }
        printer: { type: string }
        status: { type: string, enum: [ISSUED, PRINTED, CANCELLED] }
        printedAt: { type: [string, 'null'], format: date-time }
        issuedAt: { type: string, format: date-time }
    InternationalPermitCollection:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/InternationalPermit' } }
    Problem:
      type: object
      required: [status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        instance: { type: string }
        correlationId: { type: string }
        requirementRefs: { type: array, items: { type: string } }
        errors: { type: array, items: { type: object } }
        nextStep:
          type: string
          description: '`ELIGIBILITY_BLOCKED` only (DL-050): the next step of the first reason, as a code'
        blocks:
          type: array
          description: '`ELIGIBILITY_BLOCKED` only (DL-050): every reason the transaction is blocked, as the customer may see it'
          items:
            type: object
            additionalProperties: false
            required: [reasonCode, nextStep, message]
            properties:
              reasonCode: { type: string, description: 'A disclosed hold type code, or `RESTRICTED`' }
              nextStep: { type: string }
              message: { type: string }
