    CertificateCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Certificate' } }
    CertificateCheck:
      type: object
      additionalProperties: false
      required: [certificateNumber, licenceNumber, issuedOn, validUntil, valid, licenceStatus]
      properties:
        certificateNumber: { type: string }
        licenceNumber: { type: string }
        issuedOn: { type: string, format: date }
        validUntil: { type: string, format: date }
        valid: { type: boolean, description: Genuine and valid today }
        licenceStatus: { type: string }
    CountryCode:
      type: string
      pattern: '^[A-Z]{2,3}$'
    CountryRule:
      type: object
      required: [id, countryCode, mode, classMap, status, submittedBy, submittedAt]
      properties:
        id: { type: string, format: uuid }
        countryCode: { type: string }
        mode: { type: string, enum: [DIRECT_EXCHANGE, TEST_REQUIRED] }
        classMap: { type: object, additionalProperties: { type: string } }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, SUPERSEDED] }
        submittedBy: { type: string }
        submittedAt: { type: string, format: date-time }
        decidedBy: { type: [string, 'null'] }
        decidedAt: { type: [string, 'null'], format: date-time }
    CountryRuleCollection:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CountryRule' } }
    ForeignLicence:
      type: object
      required: [id, trafficFileNumber, countryCode, foreignNumber, classes, expiresOn, language, translated, status,
                 recordedAt]
      properties:
        id: { type: string, format: uuid }
        trafficFileNumber: { type: string }
        countryCode: { type: string }
        foreignNumber: { type: string }
        classes: { type: array, items: { type: string } }
        issuedOn: { type: [string, 'null'], format: date }
        expiresOn: { type: string, format: date }
        language: { type: string }
        translated: { type: boolean }
        status: { type: string, enum: [RECORDED, EXCHANGED, TEST_REQUIRED] }
        licenceId: { type: [string, 'null'], format: uuid }
        recordedAt: { type: string, format: date-time }
