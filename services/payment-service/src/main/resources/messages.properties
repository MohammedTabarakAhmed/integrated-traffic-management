# Plain-language problem messages (CH-053). English; national-language bundle: messages_ar.properties.
problem.VALIDATION_FAILED=Some fields are missing or invalid. Correct them and try again.
problem.FORBIDDEN=You do not have permission to do this. Ask your administrator if you need access.
problem.NOT_FOUND=The requested resource was not found.
problem.METHOD_NOT_ALLOWED=This action is not available for this resource.
problem.UNSUPPORTED_MEDIA_TYPE=The request must be sent as JSON.
problem.AUTHORISATION_UNAVAILABLE=Access rights cannot be checked right now, so the request was not processed. Try again shortly.
problem.INTERNAL_ERROR=Something went wrong on our side. Try again later; if it continues, contact support with the reference number.
problem.INVALID_CODE={0} must be 1 to 40 characters using A-Z, 0-9 or underscore.
problem.INVALID_SERVICE_CODE=A service code must be 2 to 20 characters using A-Z, 0-9 or underscore, starting with a letter.
problem.LIST_SIZE_INVALID={0} needs {1} to {2} entries.
problem.LIST_DUPLICATES={0} lists the same entry twice. Remove the repeated entry.
problem.REASON_REQUIRED=Give a reason of at least 3 characters.
problem.REASON_TOO_LONG=The reason can be at most 500 characters.
problem.BUSINESS_NUMBER_INVALID={0} must be 1 to 40 characters of A-Z, 0-9 or -, starting with a letter or a digit.
problem.CHANNEL_REQUIRED=The request does not say through which channel it was made. Use a supported channel and try again.
problem.IDEMPOTENCY_KEY_REQUIRED=Send an Idempotency-Key header with this request, so that a retry is not processed twice.
problem.IDEMPOTENCY_KEY_INVALID=The Idempotency-Key must be 8 to 128 characters using letters, digits, dot, underscore, colon or hyphen.
problem.IDEMPOTENCY_KEY_REUSED=This Idempotency-Key was already used for a different request. Use a new key for a new request.
problem.IDEMPOTENCY_REQUEST_IN_PROGRESS=A request with this Idempotency-Key is still being processed. Try again shortly.
problem.SCOPE_EXCEEDED=You do not have the right to do this with payments.
problem.FIELD_INVALID={0} is missing or not in the expected format.
problem.REASON_INVALID=Give a reason of 3 to 500 characters.
problem.VERSION_MISMATCH=Someone changed this record at the same time. Reload it.
problem.AMOUNT_INVALID=The amount must be more than zero.
problem.PAYABLE_EXISTS=Item {0} can already be paid.
problem.PAYABLE_NOT_OPEN=Item {0} cannot be paid now ({1}).
problem.PAYABLE_NOT_FOUND=The payable item was not found.
problem.BASKET_INVALID=A basket has 1 to 100 different items.
problem.BASKET_NOT_FOUND=The basket was not found.
problem.BASKET_PAID=This basket is already paid.
problem.CURRENCY_MIXED=All items of a basket must be in the same currency.
problem.METHOD_NOT_ACCEPTED=This payment method is not accepted here.
problem.PAYMENT_IN_PROGRESS=A payment of this basket is already in progress. Wait for it to finish.
problem.PAYMENT_NOT_FOUND=The payment was not found.
problem.PAYMENT_NOT_PENDING=This payment is already {0}.
problem.SIGNATURE_INVALID=The callback signature is not valid.
problem.GATEWAY_UNAVAILABLE=Online payment is not available right now. Nothing was charged. Try again shortly.
problem.RECEIPT_NOT_FOUND=The receipt was not found.
problem.RECEIPT_CANCELLED=This receipt is already cancelled.
problem.RECEIPT_NOT_SAME_DAY=A receipt can be cancelled only on the day it was issued ({0}). Use a refund instead.
