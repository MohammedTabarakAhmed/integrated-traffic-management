openapi: 3.1.0
info:
  title: ITMS Payment Service
  version: 1.0.0
  description: |
    Payments (FN-001..FN-005, FN-010, FN-011, FN-014, FN-022; ADR-054).

    Payables (FN-002): the owning services register what is owed (a transaction's fees, a violation's fine, general
    income), itemised by financial item, beneficiary and cost centre, in minor units. Payment-service never prices anything.

    Baskets and payments (FN-001, FN-002): open payables of one or more traffic files go into a basket, paid in one
    payment. Online methods open a session on the gateway's hosted pages (ITMS never sees card data, ICD-03) and wait
    for the callback; counter methods (cash, card terminal, cheque if accepted) are recorded by a cashier with
    `payment.collect` and confirmed at once. Accepted methods are configuration.

    Callbacks (FN-004, UAT-4): `POST /v1/payments/{paymentId}/callbacks` from the gateway adapter, with an HMAC
    signature. The first valid SUCCESS confirms the payment, marks the items paid and issues exactly one receipt
    (event `itms.payment.confirmed`); every repeat is logged as a duplicate and answered 200 with the same receipt. An
    amount or currency mismatch sends the payment to EXCEPTION. A job asks the gateway about PENDING payments after 5
    minutes and moves unresolved ones to EXCEPTION after 30 (configurable, FN-005).

    Receipts (FN-003, FN-010, FN-011, FN-014, FN-022): itemised by financial item, typed (service, violation, general,
    deposit), numbered `R-<region>-<channel>-<year>-<8 digits>` from a gapless sequence, searchable by staff, and
    cancellable only on their business day by a supervisor with a reason (the items become payable again).

    The channel is the `X-Channel` header. Only GET/POST are used (INT-003).
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: Payables
  - name: Payments
  - name: Receipts
  - name: Finance

paths:
  /v1/payables:
    post:
      tags: [Payables]
      operationId: registerPayable
      summary: Register an item to be paid (owning services, FN-002)
      description: Refused when the item is already payable (409 `PAYABLE_EXISTS`) or the amount is not positive (422).
      x-itms-permission: payment.payable.register
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Registered
          headers:
            Location: { schema: { type: string } }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payable' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/payables/{payableId}:
    get:
      tags: [Payables]
      operationId: getPayable
      summary: A payable item and its status
      x-itms-permission: authenticated
      x-itms-scope: national
      parameters:
        - $ref: '#/components/parameters/PayableId'
      responses:
        '200':
          description: Payable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payable' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/payables/{payableId}/cancellations:
    post:
      tags: [Payables]
      operationId: cancelPayable
      summary: The owner withdraws an open payable
      x-itms-permission: payment.payable.register
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/PayableId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payable' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/me/payables:
    get:
      tags: [Payments]
      operationId: listOwnPayables
      summary: The signed-in customer's own items with their itemised lines, newest first (CC-047, ADR-067 d; audited)
      description: >-
        For customer tokens only (subject_type=CUSTOMER with a national_id claim); staff tokens get 403. The items are
        those of the traffic file traffic-file-service finds for the national id in the token (the token is relayed),
        never a parameter. `paused` marks an open item under objection, which cannot be paid now (VF-052).
        404 `OWN_FILE_NOT_FOUND` without a traffic file; 503 `TRAFFIC_FILES_UNAVAILABLE`.
      x-itms-permission: customer.payment.make
      x-itms-scope: [own]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [OPEN, PAID, CANCELLED] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: The customer's items
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [payable, paused]
                      properties:
                        payable: { $ref: '#/components/schemas/Payable' }
                        paused: { type: boolean }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/me/baskets:
    post:
      tags: [Payments]
      operationId: createOwnBasket
      summary: Put one, several or all of the customer's own open items in one basket (VF-070, ADR-067 d)
      description: |
        For customer tokens only. Without `payableIds` the basket holds every open item of the customer's file that is
        not paused (422 `NOTHING_TO_PAY` when there is none). Naming an item of another file answers 404
        `PAYABLE_NOT_FOUND`. The customer then pays the basket online with `POST /v1/baskets/{basketId}/payments`
        (FN-001). 503 `TRAFFIC_FILES_UNAVAILABLE`.
      x-itms-permission: customer.payment.make
      x-itms-scope: [own]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                payableIds: { type: array, maxItems: 100, items: { type: string, format: uuid } }
      responses:
        '201':
          description: Created
          headers:
            Location: { schema: { type: string } }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Basket' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/baskets:
    post:
      tags: [Payments]
      operationId: createBasket
      summary: Put open payables of one currency in a basket (FN-002)
      x-itms-permission: authenticated
      x-itms-scope: national
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BasketRequest' }
      responses:
        '201':
          description: Created
          headers:
            Location: { schema: { type: string } }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Basket' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/baskets/{basketId}:
    get:
      tags: [Payments]
      operationId: getBasket
      summary: A basket (its creator, or payment staff)
      x-itms-permission: payment.receipt.read
      x-itms-scope: [own]
      parameters:
        - $ref: '#/components/parameters/BasketId'
      responses:
        '200':
          description: Basket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Basket' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/baskets/{basketId}/payments:
    post:
      tags: [Payments]
      operationId: payBasket
      summary: Pay a basket online (gateway session) or at a counter (FN-001)
      description: |
        Online: 201 with `redirectUrl` to the gateway's page; the payment stays PENDING until the callback. Counter
        (`payment.collect` in the basket's region): 201 with the receipt. Refused when the method is not accepted (422
        `METHOD_NOT_ACCEPTED`), a payment is already in progress (409 `PAYMENT_IN_PROGRESS`), the basket or an item is
        already paid (409), the counter reference is already used in the basket's region for the same method (409
        `TRANSACTION_REFERENCE_USED`, Q-073),
        or the gateway is down (503 `GATEWAY_UNAVAILABLE`).
      x-itms-permission: payment.collect
      x-itms-scope: [own, region]
      parameters:
        - $ref: '#/components/parameters/BasketId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayRequest' }
      responses:
        '201':
          description: Started (online) or paid (counter)
          headers:
            Location: { schema: { type: string } }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Started' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/payments/{paymentId}:
    get:
      tags: [Payments]
      operationId: getPayment
      summary: A payment's status (its payer, or payment staff)
      x-itms-permission: payment.receipt.read
      x-itms-scope: [own]
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Payment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/payments/{paymentId}/callbacks:
    post:
      tags: [Payments]
      operationId: paymentCallback
      summary: Gateway confirmation, processed idempotently (FN-004, UAT-4, ICD-03)
      description: |
        401 `SIGNATURE_INVALID` (audited, no state change); 404 unknown payment. A repeat answers 200 with
        `duplicate: true` and the same receipt; it creates no second receipt and no second event.
      x-itms-permission: payment.gateway.callback
      x-itms-scope: national
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CallbackRequest' }
      responses:
        '200':
          description: Processed (first time or duplicate)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [paymentId, status, duplicate]
                properties:
                  paymentId: { type: string, format: uuid }
                  status: { $ref: '#/components/schemas/PaymentStatus' }
                  receiptNumber: { oneOf: [ { type: string }, { type: 'null' } ] }
                  duplicate: { type: boolean }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /v1/receipts:
    get:
      tags: [Receipts]
      operationId: searchReceipts
      summary: Enquire receipts by customer, file, date, amount, channel, item or region (FN-014); audited
      x-itms-permission: payment.receipt.read
      x-itms-scope: national
      parameters:
        - { name: trafficFileNumber, in: query, schema: { type: string, maxLength: 60 } }
        - { name: payerId, in: query, schema: { type: string, maxLength: 100 } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: amountMinor, in: query, schema: { type: integer, minimum: 0 } }
        - { name: channel, in: query, schema: { type: string, maxLength: 20 } }
        - { name: financialItem, in: query, schema: { type: string, maxLength: 40 } }
        - { name: region, in: query, schema: { type: string, maxLength: 40 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
      responses:
        '200':
          description: Receipts, newest first
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Receipt' } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/receipts/{number}:
    get:
      tags: [Receipts]
      operationId: getReceipt
      summary: A receipt (its payer, or staff; staff reads audited)
      x-itms-permission: payment.receipt.read
      x-itms-scope: [own]
      parameters:
        - $ref: '#/components/parameters/ReceiptNumber'
      responses:
        '200': { $ref: '#/components/responses/Receipt' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/receipts/{number}/cancellations:
    post:
      tags: [Receipts]
      operationId: cancelReceipt
      summary: Cancel a receipt on its business day, by a supervisor, with a reason (FN-011)
      description: After the business day 409 `RECEIPT_NOT_SAME_DAY` (use a refund).
      x-itms-permission: payment.receipt.cancel
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/ReceiptNumber'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200': { $ref: '#/components/responses/Receipt' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/payments/{id}/refund-requests:
    post:
      operationId: requestRefund
      summary: Request a refund of a payment (maker; FN-006)
      tags: [Refunds]
      x-itms-permission: payment.refund.request
      x-itms-scope: [region]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amountMinor, reason]
              properties:
                amountMinor: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '201': { description: 'Refund request awaiting independent approval', content: { application/json: { schema: { $ref: '#/components/schemas/Refund' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /v1/payables/{id}/holds:
    post:
      operationId: pausePayable
      tags: [Payables]
      summary: Pause collection of a payable while it is under objection (VF-052)
      x-itms-permission: payment.payable.hold
      x-itms-scope: [region]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sourceRef, reason]
              properties:
                sourceRef: { type: string, maxLength: 80 }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '204': { description: Payable paused }
        '422': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '400': { $ref: '#/components/responses/Problem' }

  /v1/payables/{id}/hold-lifts:
    post:
      operationId: resumePayable
      tags: [Payables]
      summary: Resume a payable after objection review
      x-itms-permission: payment.payable.hold
      x-itms-scope: [region]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sourceRef, reason]
              properties:
                sourceRef: { type: string, maxLength: 80 }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '204': { description: Payable resumed }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '400': { $ref: '#/components/responses/Problem' }

  /v1/refund-requests/{id}/approvals:
    post:
      operationId: approveRefund
      summary: Approve a refund request (checker, never the maker; FN-006)
      tags: [Refunds]
      x-itms-permission: payment.refund.approve
      x-itms-scope: [region]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200': { description: 'Refund approved within the reviewer''s limit', content: { application/json: { schema: { $ref: '#/components/schemas/Refund' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '400': { $ref: '#/components/responses/Problem' }

  /v1/refund-requests/{id}/rejections:
    post:
      operationId: rejectRefund
      summary: Reject a refund request (checker; FN-006)
      tags: [Refunds]
      x-itms-permission: payment.refund.approve
      x-itms-scope: [region]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200': { description: 'Refund request rejected with reason', content: { application/json: { schema: { $ref: '#/components/schemas/Refund' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '400': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/settlement-imports:
    post:
      operationId: importSettlement
      summary: Import gateway or bank settlement lines for reconciliation (FN-012, FN-040)
      tags: [Finance]
      x-itms-permission: payment.settlement.import
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [lines]
              properties:
                lines:
                  type: array
                  minItems: 1
                  maxItems: 10000
                  items:
                    type: object
                    additionalProperties: false
                    required: [source, externalRef, region, currency, amountMinor]
                    properties:
                      source: { type: string, maxLength: 40, pattern: '^[A-Z][A-Z0-9_]{1,39}$' }
                      externalRef: { type: string, maxLength: 200 }
                      paidAt: { type: [string, 'null'], format: date-time }
                      region: { type: string, maxLength: 40 }
                      currency: { type: string, pattern: '^[A-Z]{3}$' }
                      amountMinor: { type: integer, minimum: 0 }
      responses:
        '200': { description: 'Imported rows with automatic matches and exceptions', content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ReconciliationItem' } } } } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /v1/reconciliation-exceptions:
    get:
      operationId: listReconciliationExceptions
      summary: Open reconciliation exceptions (FN-040)
      tags: [Finance]
      x-itms-permission: payment.finance.read
      x-itms-scope: national
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 100, minimum: 1, maximum: 1000 } }
      responses:
        '200': { description: 'Unmatched settlement lines for finance investigation', content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ReconciliationItem' } } } } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/reconciliation-exceptions/{id}/resolutions:
    post:
      operationId: resolveReconciliationException
      summary: Resolve a reconciliation exception with a reason (FN-041)
      tags: [Finance]
      x-itms-permission: payment.finance.resolve
      x-itms-scope: [region]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [paymentId, reason]
              properties:
                paymentId: { type: string, format: uuid }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200': { description: 'Reconciliation item resolved against a confirmed matching payment', content: { application/json: { schema: { $ref: '#/components/schemas/ReconciliationItem' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '400': { $ref: '#/components/responses/Problem' }

  /v1/bank-deposits:
    post:
      tags: [Finance]
      operationId: recordBankDeposit
      summary: Group issued receipts into a bank deposit (FN-021)
      x-itms-permission: payment.settlement.import
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [depositRef, bank, receiptNumbers]
              properties:
                depositRef: { type: string, maxLength: 120 }
                bank: { type: string, maxLength: 120 }
                receiptNumbers: { type: array, minItems: 1, maxItems: 500, uniqueItems: true,
                  items: { type: string, maxLength: 100 } }
      responses:
        '201': { description: 'Deposit group created with receipt total', content: { application/json: { schema: { $ref: '#/components/schemas/BankDeposit' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/bank-statement-imports:
    post:
      tags: [Finance]
      operationId: importBankStatement
      summary: Match bank statement lines against recorded deposits (FN-021)
      x-itms-permission: payment.settlement.import
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [lines]
              properties:
                lines:
                  type: array
                  minItems: 1
                  maxItems: 10000
                  items:
                    type: object
                    additionalProperties: false
                    required: [source, externalRef, bank, region, currency, amountMinor]
                    properties:
                      source: { type: string, maxLength: 40, pattern: '^[A-Z][A-Z0-9_]{1,39}$' }
                      externalRef: { type: string, maxLength: 200 }
                      bank: { type: string, maxLength: 120 }
                      bookedAt: { type: [string, 'null'], format: date-time }
                      region: { type: string, maxLength: 40 }
                      currency: { type: string, pattern: '^[A-Z]{3}$' }
                      amountMinor: { type: integer, minimum: 0 }
      responses:
        '200': { description: 'Statement lines with exact deposit matches and exceptions', content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/BankStatementLine' } } } } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /v1/bank-deposit-exceptions:
    get:
      tags: [Finance]
      operationId: listBankDepositExceptions
      summary: List unmatched bank statement lines
      x-itms-permission: payment.finance.read
      x-itms-scope: national
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 100, minimum: 1, maximum: 1000 } }
      responses:
        '200': { description: 'Unmatched bank statement lines', content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/BankStatementLine' } } } } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/bank-deposit-exceptions/{id}/resolutions:
    post:
      tags: [Finance]
      operationId: resolveBankDepositException
      summary: Resolve a bank statement exception against a deposit
      x-itms-permission: payment.finance.resolve
      x-itms-scope: [region]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [depositId, reason]
              properties:
                depositId: { type: string, format: uuid }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200': { description: 'Bank statement exception resolved against a matching deposit', content: { application/json: { schema: { $ref: '#/components/schemas/BankStatementLine' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '400': { $ref: '#/components/responses/Problem' }

  /v1/tills:
    post:
      tags: [Finance]
      operationId: openTill
      summary: Open a cashier till with its opening cash amount (FN-020)
      x-itms-permission: payment.till.manage
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [region, openingAmountMinor]
              properties:
                region: { type: string, maxLength: 40 }
                openingAmountMinor: { type: integer, minimum: 0 }
      responses:
        '201': { description: 'Till opened', content: { application/json: { schema: { $ref: '#/components/schemas/Till' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/tills/{id}/closures:
    post:
      tags: [Finance]
      operationId: closeTill
      summary: Reconcile and close the caller's till (FN-020)
      x-itms-permission: payment.till.manage
      x-itms-scope: [own, region]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [totals, reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
                totals:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items:
                    type: object
                    additionalProperties: false
                    required: [method, actualMinor]
                    properties:
                      method: { type: string, enum: [CASH, CARD_TERMINAL, CHEQUE] }
                      actualMinor: { type: integer, minimum: 0 }
      responses:
        '200': { description: 'Till closed with expected, actual and difference totals', content: { application/json: { schema: { $ref: '#/components/schemas/Till' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '400': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PayableId:
      name: payableId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BasketId:
      name: basketId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReceiptNumber:
      name: number
      in: path
      required: true
      schema: { type: string, pattern: '^R-[A-Z0-9_]{1,40}-[A-Z]{2,20}-[0-9]{4}-[0-9]{8}$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Chosen by the client, new for every intended action, and sent again unchanged on a retry (API_SPECIFICATION
        §2, ADR-032). A retry with the same key and request gets the stored response, marked `Idempotent-Replayed`.
      schema: { type: string, pattern: '^[A-Za-z0-9._:-]{8,128}$' }

  headers:
    IdempotentReplayed:
      description: '`true` when the response is the stored response of an earlier request with the same Idempotency-Key'
      schema: { type: string, enum: ['true'] }

  responses:
    Unauthorized:
      description: Missing or invalid bearer token
    Problem:
      description: Problem details (RFC 9457, API_SPECIFICATION §3)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Receipt:
      description: Receipt
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Receipt' }

  schemas:
    Code:
      type: string
      pattern: '^[A-Z0-9][A-Z0-9_]{1,39}$'
    Ref:
      type: string
      pattern: '^[A-Z0-9][A-Z0-9-]{0,59}$'
    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
    Refund:
      type: object
      required: [id, paymentId, receiptNumber, region, currency, amountMinor, status, requestedBy, requestedAt]
      properties:
        id: { type: string, format: uuid }
        paymentId: { type: string, format: uuid }
        receiptNumber: { type: string }
        region: { type: string }
        currency: { type: string }
        amountMinor: { type: integer }
        reason: { $ref: '#/components/schemas/NullableString' }
        status: { type: string, enum: [PENDING, APPROVED, SUBMITTED, REJECTED, FAILED] }
        requestedBy: { type: string }
        requestedAt: { type: string, format: date-time }
        decidedBy: { $ref: '#/components/schemas/NullableString' }
        decidedAt: { $ref: '#/components/schemas/NullableTime' }
        remoteRef: { $ref: '#/components/schemas/NullableString' }
    ReconciliationItem:
      type: object
      required: [id, source, externalRef, region, currency, amountMinor, status, receivedAt]
      properties:
        id: { type: string, format: uuid }
        source: { type: string }
        externalRef: { type: string }
        paidAt: { $ref: '#/components/schemas/NullableTime' }
        region: { type: string }
        currency: { type: string }
        amountMinor: { type: integer }
        paymentId: { oneOf: [ { type: string, format: uuid }, { type: 'null' } ] }
        status: { type: string, enum: [MATCHED, EXCEPTION, RESOLVED] }
        reason: { $ref: '#/components/schemas/NullableString' }
        receivedAt: { type: string, format: date-time }
    BankDeposit:
      type: object
      required: [id, depositRef, bank, region, currency, totalMinor, status, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        depositRef: { type: string }
        bank: { type: string }
        region: { type: string }
        currency: { type: string }
        totalMinor: { type: integer }
        status: { type: string, enum: [OPEN, MATCHED, EXCEPTION] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        matchedAt: { $ref: '#/components/schemas/NullableTime' }
        reason: { $ref: '#/components/schemas/NullableString' }
    BankStatementLine:
      type: object
      required: [id, source, externalRef, bank, region, currency, amountMinor, status, receivedAt]
      properties:
        id: { type: string, format: uuid }
        source: { type: string }
        externalRef: { type: string }
        bank: { type: string }
        region: { type: string }
        currency: { type: string }
        amountMinor: { type: integer }
        depositId: { oneOf: [ { type: string, format: uuid }, { type: 'null' } ] }
        status: { type: string, enum: [MATCHED, EXCEPTION, RESOLVED] }
        reason: { $ref: '#/components/schemas/NullableString' }
        receivedAt: { type: string, format: date-time }
    Till:
      type: object
      required: [id, cashierId, region, openingAmountMinor, openedAt, status, totals]
      properties:
        id: { type: string, format: uuid }
        cashierId: { type: string }
        region: { type: string }
        openingAmountMinor: { type: integer }
        openedAt: { type: string, format: date-time }
        status: { type: string, enum: [OPEN, CLOSED] }
        closedAt: { $ref: '#/components/schemas/NullableTime' }
        totals:
          type: array
          items:
            type: object
            required: [method, expectedMinor, actualMinor, differenceMinor]
            properties:
              method: { type: string, enum: [CASH, CARD_TERMINAL, CHEQUE] }
              expectedMinor: { type: integer }
              actualMinor: { type: integer }
              differenceMinor: { type: integer }
    NullableString:
      oneOf: [ { type: string }, { type: 'null' } ]
    NullableTime:
      oneOf: [ { type: string, format: date-time }, { type: 'null' } ]
    ItemType:
      type: string
      enum: [TRANSACTION, VIOLATION, GENERAL, DEPOSIT]
    Method:
      type: string
      enum: [GATEWAY_CARD, E_PAYMENT, MOBILE_WALLET, BANK_TRANSFER, DIRECT_DEBIT, CASH, CARD_TERMINAL, CHEQUE,
             COLLECTION_PARTNER]
    PaymentStatus:
      type: string
      enum: [PENDING, CONFIRMED, FAILED, EXCEPTION]
    Line:
      type: object
      additionalProperties: false
      required: [financialItem, beneficiary, amountMinor]
      properties:
        financialItem: { $ref: '#/components/schemas/Code' }
        beneficiary: { $ref: '#/components/schemas/Code' }
        costCentre: { $ref: '#/components/schemas/Code' }
        description: { oneOf: [ { type: string, maxLength: 200 }, { type: 'null' } ] }
        amountMinor: { type: integer, minimum: 0, maximum: 1000000000000 }
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [itemType, itemRef, region, currency, lines]
      properties:
        itemType: { $ref: '#/components/schemas/ItemType' }
        itemRef: { $ref: '#/components/schemas/Ref' }
        trafficFileNumber: { oneOf: [ { $ref: '#/components/schemas/Ref' }, { type: 'null' } ] }
        region: { $ref: '#/components/schemas/Code' }
        currency: { $ref: '#/components/schemas/Currency' }
        lines: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/Line' } }
    Payable:
      type: object
      additionalProperties: false
      required: [id, itemType, itemRef, region, currency, lines, total, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        itemType: { $ref: '#/components/schemas/ItemType' }
        itemRef: { type: string }
        trafficFileNumber: { $ref: '#/components/schemas/NullableString' }
        region: { type: string }
        currency: { type: string }
        lines: { type: array, items: { $ref: '#/components/schemas/Line' } }
        total: { type: integer }
        status: { type: string, enum: [OPEN, PAID, CANCELLED] }
        createdAt: { type: string, format: date-time }
    ReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
    BasketRequest:
      type: object
      additionalProperties: false
      required: [payableIds]
      properties:
        payableIds: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { type: string, format: uuid } }
        region: { oneOf: [ { $ref: '#/components/schemas/Code' }, { type: 'null' } ] }
    Basket:
      type: object
      additionalProperties: false
      required: [id, payableIds, region, currency, totalMinor, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        payableIds: { type: array, items: { type: string, format: uuid } }
        region: { type: string }
        currency: { type: string }
        totalMinor: { type: integer }
        status: { type: string, enum: [OPEN, PAID] }
        createdAt: { type: string, format: date-time }
    PayRequest:
      type: object
      additionalProperties: false
      required: [method]
      properties:
        method: { $ref: '#/components/schemas/Method' }
        returnUrl: { oneOf: [ { type: string, format: uri, maxLength: 500 }, { type: 'null' } ] }
        counterReference: { oneOf: [ { type: string, pattern: '^[A-Za-z0-9-]{1,60}$' }, { type: 'null' } ] }
    Payment:
      type: object
      additionalProperties: false
      required: [id, basketId, method, amountMinor, currency, channel, region, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        basketId: { type: string, format: uuid }
        method: { $ref: '#/components/schemas/Method' }
        amountMinor: { type: integer }
        currency: { type: string }
        channel: { type: string }
        region: { type: string }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        gatewayTxnId: { $ref: '#/components/schemas/NullableString' }
        createdAt: { type: string, format: date-time }
        confirmedAt: { $ref: '#/components/schemas/NullableTime' }
        exceptionReason: { $ref: '#/components/schemas/NullableString' }
    Started:
      type: object
      additionalProperties: false
      required: [payment]
      properties:
        payment: { $ref: '#/components/schemas/Payment' }
        redirectUrl: { $ref: '#/components/schemas/NullableString' }
        receipt: { oneOf: [ { $ref: '#/components/schemas/Receipt' }, { type: 'null' } ] }
    CallbackRequest:
      type: object
      additionalProperties: false
      required: [gatewayTxnId, merchantRef, status, amountMinor, currency, signature]
      properties:
        gatewayTxnId: { type: string, maxLength: 200 }
        merchantRef: { type: string, format: uuid }
        status: { type: string, enum: [SUCCESS, FAILED] }
        amountMinor: { type: integer, minimum: 0 }
        currency: { $ref: '#/components/schemas/Currency' }
        paidAt: { oneOf: [ { type: string, maxLength: 40 }, { type: 'null' } ] }
        signature: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
    Receipt:
      type: object
      additionalProperties: false
      required: [number, paymentId, type, region, channel, method, currency, totalMinor, lines, issuedAt, businessDay,
                 status]
      properties:
        number: { type: string }
        paymentId: { type: string, format: uuid }
        type: { type: string, enum: [SERVICE, VIOLATION, GENERAL, DEPOSIT] }
        region: { type: string }
        channel: { type: string }
        method: { $ref: '#/components/schemas/Method' }
        currency: { type: string }
        totalMinor: { type: integer }
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [payableId, itemType, itemRef, financialItem, beneficiary, costCentre, amountMinor]
            properties:
              payableId: { type: string, format: uuid }
              itemType: { $ref: '#/components/schemas/ItemType' }
              itemRef: { type: string }
              trafficFileNumber: { $ref: '#/components/schemas/NullableString' }
              financialItem: { type: string }
              beneficiary: { type: string }
              costCentre: { type: string }
              description: { $ref: '#/components/schemas/NullableString' }
              amountMinor: { type: integer }
        issuedAt: { type: string, format: date-time }
        businessDay: { type: string, format: date }
        status: { type: string, enum: [ISSUED, CANCELLED] }
        cancelledAt: { $ref: '#/components/schemas/NullableTime' }
        cancellationReason: { $ref: '#/components/schemas/NullableString' }
    Problem:
      type: object
      required: [status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        instance: { type: string }
        correlationId: { type: string }
        requirementRefs: { type: array, items: { type: string } }
        errors: { type: array, items: { type: object } }
