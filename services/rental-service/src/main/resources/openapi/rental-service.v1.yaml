openapi: 3.1.0
info:
  title: ITMS Rental Service
  version: 1.0.0
  description: Rental companies and timestamped contracts (TR-020, TR-021, TR-030, TR-033).
servers: [{ url: / }]
security: [{ bearerAuth: [] }]
tags: [{ name: Rental }]
paths:
  /v1/rental-companies:
    post:
      tags: [Rental]
      summary: Register a rental company
      operationId: registerRentalCompany
      x-itms-permission: rental.company.manage
      x-itms-scope: [region]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [trafficFileNumber, commercialLicence, region]
              properties:
                trafficFileNumber: { type: string, maxLength: 40 }
                commercialLicence: { type: string, maxLength: 100 }
                region: { type: string, maxLength: 40, pattern: '^[A-Z0-9_-]{1,40}$' }
      responses:
        '201': { description: Registered rental company, content: {application/json: {schema: {$ref: '#/components/schemas/Company'}}} }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/rental-companies/{companyFile}/branches:
    post:
      tags: [Rental]
      summary: Register a company branch
      operationId: registerRentalBranch
      x-itms-permission: rental.company.manage
      x-itms-scope: [region]
      parameters:
        - {name: companyFile, in: path, required: true, schema: {type: string, maxLength: 40}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, name, region]
              properties:
                code: {type: string, maxLength: 40, pattern: '^[A-Z0-9][A-Z0-9_-]{0,39}$'}
                name: {type: string, minLength: 1, maxLength: 120}
                region: {type: string, maxLength: 40}
      responses:
        '201': {description: Branch registered, content: {application/json: {schema: {$ref: '#/components/schemas/Branch'}}}}
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/rental-companies/{companyFile}/suspensions:
    post:
      tags: [Rental]
      summary: Suspend a rental company for non-compliance
      operationId: suspendRentalCompany
      x-itms-permission: rental.company.manage
      x-itms-scope: [region]
      parameters:
        - {name: companyFile, in: path, required: true, schema: {type: string, maxLength: 40}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [reason], properties: {reason: {type: string, minLength: 1, maxLength: 500}}}
      responses:
        '200': {description: Company suspended, content: {application/json: {schema: {$ref: '#/components/schemas/Company'}}}}
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/rental-companies/{companyFile}/reinstatements:
    post:
      tags: [Rental]
      summary: Reinstate a suspended rental company
      operationId: reinstateRentalCompany
      x-itms-permission: rental.company.manage
      x-itms-scope: [region]
      parameters:
        - {name: companyFile, in: path, required: true, schema: {type: string, maxLength: 40}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [reason], properties: {reason: {type: string, minLength: 1, maxLength: 500}}}
      responses:
        '200': {description: Company reinstated, content: {application/json: {schema: {$ref: '#/components/schemas/Company'}}}}
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/rental-contracts:
    post:
      tags: [Rental]
      summary: Record a rental contract
      operationId: createRentalContract
      x-itms-permission: rental.contract.record
      x-itms-scope: [region]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [companyFile, vehiclePlate, startsAt, endsAt, pickupBranch, returnBranch, type, bondMinor]
              properties:
                companyFile: { type: string, maxLength: 40 }
                vehiclePlate: { type: string, maxLength: 40 }
                renterFile: { type: string, maxLength: 40 }
                visitorPassport: { type: string, maxLength: 100 }
                foreignLicence: { type: string, maxLength: 100 }
                additionalDrivers: { type: array, maxItems: 10, items: { type: string, maxLength: 40 } }
                startsAt: { type: string, format: date-time }
                endsAt: { type: string, format: date-time }
                pickupBranch: { type: string, maxLength: 100 }
                returnBranch: { type: string, maxLength: 100 }
                type: { type: string, enum: [DAILY, MONTHLY, LONG_TERM_LEASE, LEASE_TO_OWN] }
                bondMinor: { type: integer, minimum: 0 }
      responses:
        '201': { description: Contract recorded, content: {application/json: {schema: {$ref: '#/components/schemas/Contract'}}} }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/rental-contracts/coverage:
    get:
      tags: [Rental]
      summary: The contract covering a plate at an instant, for violation transfer to the renter (TR-032, VF-014)
      description: >-
        Asked by violation-service when a violation has no identified driver. A contract covers the instant when it
        is not cancelled and starts at or before it and ends after it; with several, the latest start wins. A visitor
        renter has no traffic file (renterFile null, visitor true). The read is audited.
      operationId: getRentalCoverage
      x-itms-permission: rental.contract.coverage
      x-itms-scope: national
      parameters:
        - { in: query, name: plate, required: true, schema: { type: string, minLength: 1, maxLength: 40 } }
        - { in: query, name: at, required: true, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Coverage (covered false when no contract covers the instant), content: {application/json: {schema: {$ref: '#/components/schemas/Coverage'}}} }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/rental-contracts/{id}:
    get:
      tags: [Rental]
      summary: Read a rental contract
      operationId: getRentalContract
      x-itms-permission: rental.contract.read
      x-itms-scope: [region]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Rental contract, content: {application/json: {schema: {$ref: '#/components/schemas/Contract'}}} }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '400': { $ref: '#/components/responses/Problem' }
  /v1/rental-contracts/{id}/inspections:
    post:
      tags: [Rental]
      summary: Record pickup or return vehicle condition and damage (TR-034)
      operationId: recordRentalInspection
      x-itms-permission: rental.contract.record
      x-itms-scope: [region]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type, inspectedAt, odometerKm, fuelPercent, damageNotes, evidenceIds]
              properties:
                type: { type: string, enum: [PICKUP, RETURN] }
                inspectedAt: { type: string, format: date-time }
                odometerKm: { type: integer, minimum: 0 }
                fuelPercent: { type: integer, minimum: 0, maximum: 100 }
                damageNotes: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 500 } }
                evidenceIds: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 64 } }
                notes: { type: string, maxLength: 1000 }
      responses:
        '201': { description: Inspection snapshot recorded, content: {application/json: {schema: {$ref: '#/components/schemas/Inspection'}}} }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '400': { $ref: '#/components/responses/Problem' }
    get:
      tags: [Rental]
      summary: Read pickup and return inspections
      operationId: listRentalInspections
      x-itms-permission: rental.contract.read
      x-itms-scope: [region]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Inspection snapshots for the contract, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Inspection'}}}} }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '400': { $ref: '#/components/responses/Problem' }
components:
  responses:
    Problem:
      description: Problem details (RFC 9457) in Arabic or English
      content:
        application/problem+json:
          schema:
            type: object
            additionalProperties: true
            required: [status, code]
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              code: { type: string }
              detail: { type: string }
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
  schemas:
    Coverage:
      type: object
      additionalProperties: false
      required: [covered, contractId, companyFile, renterFile, visitor]
      properties:
        covered: { type: boolean }
        contractId: { type: [string, 'null'], format: uuid }
        companyFile: { type: [string, 'null'] }
        renterFile: { type: [string, 'null'] }
        visitor: { type: boolean }
    Company:
      type: object
      required: [id, trafficFileNumber, commercialLicence, region, status, createdAt]
      properties:
        id: {type: string, format: uuid}
        trafficFileNumber: {type: string}
        commercialLicence: {type: string}
        region: {type: string}
        status: {type: string, enum: [ACTIVE, SUSPENDED]}
        createdAt: {type: string, format: date-time}
    Branch:
      type: object
      required: [companyFile, code, name, region, active, createdAt]
      properties:
        companyFile: {type: string}
        code: {type: string}
        name: {type: string}
        region: {type: string}
        active: {type: boolean}
        createdAt: {type: string, format: date-time}
    Contract:
      type: object
      required: [id, companyFile, region, vehiclePlate, additionalDrivers, startsAt, endsAt, pickupBranch, returnBranch, type, bondMinor, status, createdAt]
      properties:
        id: {type: string, format: uuid}
        companyFile: {type: string}
        region: {type: string}
        vehiclePlate: {type: string}
        renterFile: {type: [string, 'null']}
        visitorPassport: {type: [string, 'null']}
        foreignLicence: {type: [string, 'null']}
        additionalDrivers: {type: array, items: {type: string}}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        pickupBranch: {type: string}
        returnBranch: {type: string}
        type: {type: string}
        bondMinor: {type: integer}
        status: {type: string}
        createdAt: {type: string, format: date-time}
    Inspection:
      type: object
      required: [id, contractId, type, inspectedAt, odometerKm, fuelPercent, damageNotes, evidenceIds, inspectedBy]
      properties:
        id: {type: string, format: uuid}
        contractId: {type: string, format: uuid}
        type: {type: string, enum: [PICKUP, RETURN]}
        inspectedAt: {type: string, format: date-time}
        odometerKm: {type: integer}
        fuelPercent: {type: integer}
        damageNotes: {type: array, items: {type: string}}
        evidenceIds: {type: array, items: {type: string}}
        notes: {type: [string, 'null']}
        inspectedBy: {type: string}
