problem.REPORT_NOT_FOUND=لا يوجد تقرير بهذا الرمز.
problem.PERIOD_INVALID=يجب أن يكون تاريخ البداية في تاريخ النهاية أو قبله.
problem.PERIOD_TOO_LONG=الفترة أطول من المسموح لتقرير واحد. اختر فترة أقصر.
problem.REGION_OUT_OF_SCOPE=لا يحق لك الاطلاع على تقارير هذه المنطقة.
problem.KPI_INVALID=يجب أن يكون رمز المؤشر من حرفين إلى 40 حرفًا مستخدمًا الأحرف A-Z أو الأرقام 0-9 أو الشرطة السفلية، ويبدأ بحرف.
problem.KPI_LIMITS_INVALID=ترتيب حدَّي الأحمر والكهرماني مخالف لاتجاه المؤشر: المؤشر الذي يحسب نحو الهدف يحتاج الأحمر في الكهرماني أو دونه، والمؤشر الذي يحسب ضده يحتاج الأحمر في الكهرماني أو فوقه.
problem.KPI_NOT_FOUND=لا يوجد مؤشر مضبوط بهذا الرمز.
