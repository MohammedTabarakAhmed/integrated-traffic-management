openapi: 3.1.0
info: {title: ITMS Road Permit API, version: 1.0.0}
paths:
  /v1/road-permits:
    post:
      operationId: applyForRoadPermit
      summary: Submit a parking, oversize, overweight, restricted-road or road-closure permit request
      tags: [RoadPermits]
      x-itms-permission: road-permit.apply
      x-itms-scope: [own, region]
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Application'}}}}
      responses: {'201': {description: Permit application created}, '400': {$ref: '#/components/responses/Problem'}, '401': {description: Authentication required}, '403': {description: Permission denied}}
  /v1/road-permits/{id}/approvals:
    post:
      operationId: approveRoadPermit
      summary: Record an affected road authority decision
      tags: [RoadPermits]
      x-itms-permission: road-permit.approve
      x-itms-scope: [region]
      security: [{bearerAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Approval'}}}}
      responses: {'200': {description: Approval recorded}, '400': {$ref: '#/components/responses/Problem'}, '401': {description: Authentication required}, '403': {description: Permission denied}}
  /v1/road-permits/{id}/transitions:
    post:
      operationId: transitionRoadPermit
      summary: Issue, cancel or expire an approved road permit
      tags: [RoadPermits]
      x-itms-permission: road-permit.manage
      x-itms-scope: [region]
      security: [{bearerAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Transition'}}}}
      responses: {'200': {description: Permit transition applied}, '400': {$ref: '#/components/responses/Problem'}, '401': {description: Authentication required}, '403': {description: Permission denied}}
components:
  securitySchemes: {bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}}
  parameters:
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
  responses:
    Problem: {description: Invalid request, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
  schemas:
    Application:
      type: object
      additionalProperties: false
      required: [type, applicant, vehicles, region, startsAt, endsAt, vehicleLimit, requiredAuthorities]
      properties:
        type: {type: string, enum: [PARKING, OVERSIZE, OVERWEIGHT, HEAVY_RESTRICTED, ROAD_CLOSURE]}
        applicant: {type: string, minLength: 1, maxLength: 80}
        eligibilityReference: {type: string, maxLength: 120}
        vehicles: {type: array, minItems: 1, maxItems: 20, items: {type: string, minLength: 1, maxLength: 80}}
        routeSegments: {type: array, maxItems: 100, items: {type: string, minLength: 1, maxLength: 80}}
        region: {type: string, minLength: 1, maxLength: 40}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        loadTonnes: {type: number, exclusiveMinimum: 0}
        widthMetres: {type: number, exclusiveMinimum: 0}
        heightMetres: {type: number, exclusiveMinimum: 0}
        lengthMetres: {type: number, exclusiveMinimum: 0}
        vehicleLimit: {type: integer, minimum: 1}
        requiredAuthorities: {type: array, minItems: 1, maxItems: 20, items: {type: string, minLength: 1, maxLength: 80}}
    Approval:
      type: object
      additionalProperties: false
      required: [authority]
      properties: {authority: {type: string, minLength: 1, maxLength: 80}, reason: {type: string, maxLength: 500}}
    Transition:
      type: object
      additionalProperties: false
      required: [action]
      properties: {action: {type: string, enum: [issue, cancel, expire]}, reason: {type: string, maxLength: 500}}
    Problem:
      type: object
      additionalProperties: true
      properties: {type: {type: string, format: uri-reference}, title: {type: string, maxLength: 200}, status: {type: integer}, detail: {type: string, maxLength: 1000}}
