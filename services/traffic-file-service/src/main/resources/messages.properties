# Plain-language problem messages (CH-053). English; national-language bundle: messages_ar.properties.
problem.VALIDATION_FAILED=Some fields are missing or invalid. Correct them and try again.
problem.FORBIDDEN=You do not have permission to do this. Ask your administrator if you need access.
problem.NOT_FOUND=The requested resource was not found.
problem.METHOD_NOT_ALLOWED=This action is not available for this resource.
problem.UNSUPPORTED_MEDIA_TYPE=The request must be sent as JSON.
problem.AUTHORISATION_UNAVAILABLE=Access rights cannot be checked right now, so the request was not processed. Try again shortly.
problem.INTERNAL_ERROR=Something went wrong on our side. Try again later; if it continues, contact support with the reference number.
problem.INVALID_CODE={0} must be 1 to 40 characters using A-Z, 0-9 or underscore.
problem.INVALID_SERVICE_CODE=A service code must be 2 to 20 characters using A-Z, 0-9 or underscore, starting with a letter.
problem.LIST_SIZE_INVALID={0} needs {1} to {2} entries.
problem.LIST_DUPLICATES={0} lists the same entry twice. Remove the repeated entry.
problem.REASON_REQUIRED=Give a reason of at least 3 characters.
problem.REASON_TOO_LONG=The reason can be at most 500 characters.
problem.BUSINESS_NUMBER_INVALID={0} must be 1 to 40 characters of A-Z, 0-9 or -, starting with a letter or a digit.
problem.CHANNEL_REQUIRED=The request does not say through which channel it was made. Use a supported channel and try again.
problem.IDEMPOTENCY_KEY_REQUIRED=Send an Idempotency-Key header with this request, so that a retry is not processed twice.
problem.IDEMPOTENCY_KEY_INVALID=The Idempotency-Key must be 8 to 128 characters using letters, digits, dot, underscore, colon or hyphen.
problem.IDEMPOTENCY_KEY_REUSED=This Idempotency-Key was already used for a different request. Use a new key for a new request.
problem.IDEMPOTENCY_REQUEST_IN_PROGRESS=A request with this Idempotency-Key is still being processed. Try again shortly.
problem.SCOPE_EXCEEDED=You do not have the right to do this for traffic files in this region.
problem.FIELD_INVALID={0} is missing or not in the expected format.
problem.NAME_REQUIRED=Enter the given and family name in at least one language.
problem.DOCUMENT_FIELDS_INVALID=Give either a national identity number, or a passport number with its issuing country.
problem.BIRTH_DATE_IN_FUTURE=The date of birth cannot be in the future.
problem.FILE_NOT_ACTIVE=Traffic file {0} is {1}, so it cannot be changed.
problem.REGISTER_FIELDS_GIVEN=Identity details come from the national identity register for this number. Do not enter them.
problem.REGISTER_PERSON_NOT_FOUND=The national identity register has no person with this number. Check the number, or open the file with a passport if the person is a visitor.
problem.REGISTER_UNAVAILABLE=The national identity register is not answering right now. Try again in a few minutes.
problem.PERSON_DECEASED=The national identity register reports this person as deceased, so a traffic file cannot be opened.
problem.VISITOR_IDENTITY_REQUIRED=For a passport, enter the name, nationality, date of birth and gender exactly as in the passport.
problem.FILE_ALREADY_EXISTS=This person already has traffic file {0}. Use that file.
problem.FILE_NOT_FOUND=Traffic file {0} was not found.
problem.VERSION_MISMATCH=Someone changed this traffic file after you opened it. Reload it and make your change again.
problem.WRONG_FILE_KIND=Traffic file {0} is a {1} file, so this change does not apply to it.
problem.SIGNATORY_REQUIRED=Name at least one authorised signatory of the company.
problem.COMPANY_LICENCE_NOT_FOUND=The licensing authority has no commercial licence with this number. Check the number and the issuing authority.
problem.COMPANY_LICENCE_CANCELLED=The licensing authority reports this commercial licence as cancelled, so a traffic file cannot be opened.
problem.COMPANY_LICENCE_EXPIRED=The commercial licence expired on {0}. Renew it with the licensing authority first.
problem.LICENSING_AUTHORITY_UNAVAILABLE=The licensing authority is not answering right now. Try again in a few minutes.
problem.REPRESENTATIVE_INVALID=These are not active traffic files of individuals: {0}. Signatories and fleet managers need their own traffic file.
problem.PERSON_BANNED=This person is on the ban list, so a traffic file cannot be opened. Contact the unit that placed the ban.
problem.REASON_INVALID=Give a reason of 3 to 500 characters.
problem.BAN_DATES_INVALID=The end date cannot be before the start date.
problem.BAN_END_IN_PAST=The end date has passed, so the ban would never apply. Choose today or a later date.
problem.BAN_NOT_ACTIVE=This ban is no longer active ({0}), so it cannot be lifted.
problem.BAN_NOT_FOUND=The ban entry was not found.
problem.DUPLICATE_SOURCE_REF=This source has already entered a ban with this reference.
problem.MERGE_SAME_FILE=A traffic file cannot be merged into itself. Choose two different files.
problem.MERGE_KIND_MISMATCH=Only files of the same kind can be merged: two individuals' files, or two companies' files.
