openapi: 3.1.0
info:
  title: ITMS Traffic File Service
  version: 1.0.0
  description: |
    Traffic files (§6.1; DL-001..DL-005, DL-012; ADR-041, ADR-042): the master record of a person or a company that
    every licence, vehicle, violation and transaction refers to. A file number is given once
    and never changes.

    Opening an individual's file (DL-001): with a national identity number, the identity (names in both languages,
    nationality, date of birth, gender, residency) comes from the national identity register (ICD-01) and staff cannot
    change it (DL-002; the response lists these `lockedFields`). A visitor's file is opened from the passport, with the
    identity entered by staff. One file per identity document: a second answers 409 `FILE_ALREADY_EXISTS` naming the
    existing file.

    Opening a company's file (DL-003): with the commercial licence number and its source (the issuing region's
    economic licensing authority, ICD-04). The trade names, activities and licence expiry come from the authority and
    are locked; an unknown, cancelled or expired licence is refused. A company names at least one authorised signatory
    and any fleet managers (DL-004), each an active individual's traffic file; they are replaced with
    `/representatives-updates`.

    Duplicates and merges (DL-009; ADR-044): `/probable-duplicates` lists other active individuals' files with the
    same birth date and nationality and a similar name in either language (Jaro-Winkler, threshold in configuration).
    `POST /{fileNumber}/merges` merges another file into this one, with a reason (`trafficfile.merge`). The merged
    file becomes MERGED, names its `survivingFileNumber`, and never changes again; other services move licences,
    vehicles, violations and history when they receive `itms.traffic-file.merged`.

    Ban list (DL-013; ADR-043): people barred from services, entered by identity document (they may have no file),
    with a reason, a source (with its own reference, used once) and a period. A ban is lifted once with a reason, or
    expires after its end date. A person with a ban in force cannot be given a traffic file (422 `PERSON_BANNED`,
    Q-059). The list is national: `trafficfile.ban.place`, `.lift` and `.read` in any grant.

    Data scope (CC-001): opening needs `trafficfile.create` in a grant that reaches `regionOpened`. Reading and
    updating need `trafficfile.read` / `trafficfile.update` in any grant, since a customer may use services in any
    region (CC-113, Q-057).

    Sensitive data (SEC-014): identity numbers are masked to their last four characters, and health-related fields
    (`bloodGroup`, `physicalConditions`, classified secret) are left out, unless the caller holds
    `trafficfile.sensitive.read`. Searches use POST so that an identity number never appears in a URL.

    Every change and every view or search is audited (CC-120, CC-102); every version is kept (DAT-002) and shown by
    `/history`. Opening and profile changes publish `itms.traffic-file.opened` / `itms.traffic-file.profile-updated`
    events without personal data (INT-005).

    Register changes (DL-010; ADR-045): the identity register's adapter posts `IdentityChanged` notices to
    `/v1/identity-register-notifications` (`trafficfile.register.notify`). Each `eventId` is handled once; the service
    re-reads the person from the register and updates the locked identity fields; a death makes the file DECEASED.

    Not yet in this version: photo (DL-006), eye and medical results (DL-007, DL-008), the 360° view (DL-011), rules per
    category (DL-012). Codes are checked for their format only until the reference-data
    client exists (Q-044, Q-057).

    The channel is the `X-Channel` header (set by the gateway or BFF); a file cannot be opened or changed without a
    known channel. Opening and updates need an `Idempotency-Key` (ADR-032).

    Only GET/POST are used (INT-003); business actions are POSTs to sub-resources.
    Request input (SEC-022), all endpoints, enforced once in itms-platform: enum values are exactly their names as
    JSON strings; text is a JSON string without the NUL character (U+0000); every `date-time` / `date` is an RFC 3339
    string with a four-digit year. A request that breaks one of these rules is refused with 400 `VALIDATION_FAILED`.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: Traffic files
  - name: Ban list

paths:
  /v1/traffic-files/individuals:
    post:
      tags: [Traffic files]
      operationId: openIndividualFile
      summary: Open an individual's traffic file (DL-001, DL-002)
      description: |
        Refused when: the request has no known `X-Channel` (422 `CHANNEL_REQUIRED`); the caller's grant of
        `trafficfile.create` does not reach `regionOpened` (403 `SCOPE_EXCEEDED`); the document fields do not match its
        type (422 `DOCUMENT_FIELDS_INVALID`); a national identity number is given with `visitorIdentity` (422
        `REGISTER_FIELDS_GIVEN`), is malformed (422 `FIELD_INVALID`), unknown to the register (422
        `REGISTER_PERSON_NOT_FOUND`) or reported deceased (422 `PERSON_DECEASED`); the person is on the ban list
        (422 `PERSON_BANNED`, DL-013); a passport is given without
        `visitorIdentity` (422 `VISITOR_IDENTITY_REQUIRED`); the birth date lies in the future (422
        `BIRTH_DATE_IN_FUTURE`); the document already has a file (409 `FILE_ALREADY_EXISTS`); the register does not
        answer (503 `REGISTER_UNAVAILABLE`).
      x-itms-permission: trafficfile.create
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenIndividualRequest' }
      responses:
        '201':
          description: File opened (or, on a retry with the same Idempotency-Key, the stored response)
          headers:
            Location: { schema: { type: string } }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrafficFile' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/traffic-files/companies:
    post:
      tags: [Traffic files]
      operationId: openCompanyFile
      summary: Open a company's traffic file from its commercial licence (DL-003, DL-004)
      description: |
        Refused when: no known `X-Channel` (422 `CHANNEL_REQUIRED`); the caller's grant of `trafficfile.create` does
        not reach `regionOpened` (403 `SCOPE_EXCEEDED`); the licence already has a file (409 `FILE_ALREADY_EXISTS`);
        the authority does not know it (422 `COMPANY_LICENCE_NOT_FOUND`), reports it cancelled (422
        `COMPANY_LICENCE_CANCELLED`) or expired (422 `COMPANY_LICENCE_EXPIRED`); a signatory or fleet manager is not an
        active individual's file (422 `REPRESENTATIVE_INVALID`); the authority does not answer (503
        `LICENSING_AUTHORITY_UNAVAILABLE`).
      x-itms-permission: trafficfile.create
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenCompanyRequest' }
      responses:
        '201':
          description: File opened (or, on a retry with the same Idempotency-Key, the stored response)
          headers:
            Location: { schema: { type: string } }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrafficFile' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/traffic-files/searches:
    post:
      tags: [Traffic files]
      operationId: searchTrafficFiles
      summary: Find the file of an identity document (CC-100 exact search; the search is audited, CC-102)
      x-itms-permission: trafficfile.read
      x-itms-scope: national
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchRequest' }
      responses:
        '200':
          description: The file holding the document, or no item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrafficFileCollection' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/traffic-files/name-searches:
    post:
      tags: [Traffic files]
      operationId: searchTrafficFilesByName
      summary: Files of people and companies by name (CC-101; partial, either language, transliterated, phonetic; audited, CC-102)
      description: |
        Every query word must be found within one of a file's names (given + family name in each language, a
        company's names): as text after folding (case, diacritics, Arabic letter forms), or by its phonetic key, which
        is the same for Arabic and Latin script ("محمد", "Mohammed" and "Muhammad" meet). A word whose key is shorter
        than `itms.traffic-file.name-search.min-key-length` must match as text. EXACT (the whole name) comes before
        PARTIAL (every word as text) before PHONETIC; merged-away files are left out (ADR-063). The audit record lists
        the files shown, not the name searched for.
      x-itms-permission: trafficfile.read
      x-itms-scope: national
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NameSearchRequest' }
      responses:
        '200':
          description: Matching files, best first, at most `limit` (capped by `itms.traffic-file.name-search.max-results`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NameHitCollection' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/traffic-files/{fileNumber}:
    get:
      tags: [Traffic files]
      operationId: getTrafficFile
      summary: A traffic file (the view is audited, CC-120)
      x-itms-permission: trafficfile.read
      x-itms-scope: national
      parameters:
        - $ref: '#/components/parameters/FileNumber'
      responses:
        '200':
          description: Traffic file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrafficFile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/me/traffic-file:
    get:
      tags: [Traffic files]
      operationId: getOwnTrafficFile
      summary: The signed-in customer's own traffic file (ADR-067 d, CH-002; the view is audited, CC-120)
      description: >-
        For customer tokens only (subject_type=CUSTOMER with a national_id claim); staff tokens get 403. The file is
        found by the national id in the token, never by a parameter, and is shown unmasked to its owner.
      x-itms-permission: customer.trafficfile.read
      x-itms-scope: [own]
      responses:
        '200':
          description: The customer's traffic file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrafficFile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/traffic-files/{fileNumber}/history:
    get:
      tags: [Traffic files]
      operationId: getTrafficFileHistory
      summary: Every stored version of a traffic file, oldest first (DAT-002, CC-121; the view is audited)
      x-itms-permission: trafficfile.read
      x-itms-scope: national
      parameters:
        - $ref: '#/components/parameters/FileNumber'
      responses:
        '200':
          description: Versions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileVersionCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/traffic-files/{fileNumber}/profile-updates:
    post:
      tags: [Traffic files]
      operationId: updateTrafficFileProfile
      summary: Replace the profile of a traffic file (DL-005); identity fields cannot be changed here (DL-002)
      description: |
        `version` is the version the caller last read; if the file changed since, 409 `VERSION_MISMATCH`. A merged,
        closed or deceased file cannot be changed (409 `FILE_NOT_ACTIVE`).
      x-itms-permission: trafficfile.update
      x-itms-scope: national
      parameters:
        - $ref: '#/components/parameters/FileNumber'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdateRequest' }
      responses:
        '200':
          description: The updated file (or, on a retry with the same Idempotency-Key, the stored response)
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrafficFile' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/traffic-files/{fileNumber}/representatives-updates:
    post:
      tags: [Traffic files]
      operationId: updateCompanyRepresentatives
      summary: Replace a company's authorised signatories and fleet managers (DL-004)
      description: |
        `version` is the version the caller last read (409 `VERSION_MISMATCH` otherwise). Only for company files (422
        `WRONG_FILE_KIND`) that are active (409 `FILE_NOT_ACTIVE`); every named file must be an active individual's
        file (422 `REPRESENTATIVE_INVALID`).
      x-itms-permission: trafficfile.update
      x-itms-scope: national
      parameters:
        - $ref: '#/components/parameters/FileNumber'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RepresentativesUpdateRequest' }
      responses:
        '200':
          description: The updated file (or, on a retry with the same Idempotency-Key, the stored response)
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrafficFile' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/traffic-files/{fileNumber}/probable-duplicates:
    get:
      tags: [Traffic files]
      operationId: getProbableDuplicates
      summary: Probable duplicates of an individual's file, most similar first (DL-009; the view is audited)
      description: Only for individuals' files (422 `WRONG_FILE_KIND`).
      x-itms-permission: trafficfile.read
      x-itms-scope: national
      parameters:
        - $ref: '#/components/parameters/FileNumber'
      responses:
        '200':
          description: Candidates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DuplicateCandidateCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/traffic-files/{fileNumber}/merges:
    post:
      tags: [Traffic files]
      operationId: mergeTrafficFile
      summary: Merge another file into this one, which survives (DL-009)
      description: |
        Refused when: no known `X-Channel` (422 `CHANNEL_REQUIRED`); a file does not exist (404 `FILE_NOT_FOUND`);
        both are the same file (422 `MERGE_SAME_FILE`) or of different kinds (422 `MERGE_KIND_MISMATCH`); either is
        not active (409 `FILE_NOT_ACTIVE`); the reason is missing (422 `REASON_INVALID`). `Location` is the merged
        file.
      x-itms-permission: trafficfile.merge
      x-itms-scope: national
      parameters:
        - $ref: '#/components/parameters/FileNumber'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MergeRequest' }
      responses:
        '201':
          description: Merged (or, on a retry with the same Idempotency-Key, the stored response)
          headers:
            Location: { schema: { type: string } }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Merge' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/identity-register-notifications:
    post:
      tags: [Traffic files]
      operationId: receiveIdentityRegisterNotification
      summary: An identity register change notice (DL-010, ICD-01 IdentityChanged)
      description: |
        Answers 200 with the outcome in every handled case: APPLIED, UNCHANGED, DUPLICATE (this `eventId` was handled
        before), NO_FILE, FILE_NOT_ACTIVE (merged, closed, deceased or a passport file), NOT_IN_REGISTER. If the
        register cannot be read, 503 `REGISTER_UNAVAILABLE` and nothing is recorded, so the register sends it again.
        Idempotent by `eventId`, so no Idempotency-Key header.
      x-itms-permission: trafficfile.register.notify
      x-itms-scope: national
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterNotification' }
      responses:
        '200':
          description: Handled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterNotificationResult' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/ban-entries:
    post:
      tags: [Ban list]
      operationId: placeBan
      summary: Put a person on the ban list (DL-013)
      description: |
        Refused when: no known `X-Channel` (422 `CHANNEL_REQUIRED`); the end date is before the start date (422
        `BAN_DATES_INVALID`) or has passed (422 `BAN_END_IN_PAST`); the source already used `sourceRef` (409
        `DUPLICATE_SOURCE_REF`). `startDate` defaults to today. The person's traffic file, if any, is linked.
      x-itms-permission: trafficfile.ban.place
      x-itms-scope: national
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceBanRequest' }
      responses:
        '201':
          description: Ban placed (or, on a retry with the same Idempotency-Key, the stored response)
          headers:
            Location: { schema: { type: string } }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BanEntry' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/ban-entries/searches:
    post:
      tags: [Ban list]
      operationId: searchBans
      summary: Every ban entry of an identity document, newest first (the search is audited, CC-102)
      x-itms-permission: trafficfile.ban.read
      x-itms-scope: national
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchBansRequest' }
      responses:
        '200':
          description: Ban entries (active, lifted and expired)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BanEntryCollection' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/ban-entries/{banId}:
    get:
      tags: [Ban list]
      operationId: getBan
      summary: A ban entry (the view is audited, CC-120)
      x-itms-permission: trafficfile.ban.read
      x-itms-scope: national
      parameters:
        - $ref: '#/components/parameters/BanId'
      responses:
        '200':
          description: Ban entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BanEntry' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/ban-entries/{banId}/lifts:
    post:
      tags: [Ban list]
      operationId: liftBan
      summary: Lift a ban, with a reason (DL-013)
      description: A ban that is already lifted or has expired answers 409 `BAN_NOT_ACTIVE`.
      x-itms-permission: trafficfile.ban.lift
      x-itms-scope: national
      parameters:
        - $ref: '#/components/parameters/BanId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiftBanRequest' }
      responses:
        '200':
          description: The lifted ban (or, on a retry with the same Idempotency-Key, the stored response)
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BanEntry' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    BanId:
      name: banId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FileNumber:
      name: fileNumber
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Z0-9][A-Z0-9-]{0,19}$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Chosen by the client, new for every intended action, and sent again unchanged on a retry (API_SPECIFICATION
        §2, ADR-032). A retry with the same key and the same request gets the stored successful response again,
        marked `Idempotent-Replayed: true`. The same key with another request answers 409 `IDEMPOTENCY_KEY_REUSED`;
        while the first request still runs, 409 `IDEMPOTENCY_REQUEST_IN_PROGRESS`. A missing key answers 400
        `IDEMPOTENCY_KEY_REQUIRED`, a malformed one 400 `IDEMPOTENCY_KEY_INVALID`.
      schema: { type: string, pattern: '^[A-Za-z0-9._:-]{8,128}$' }

  headers:
    IdempotentReplayed:
      description: '`true` when the response is the stored response of an earlier request with the same Idempotency-Key'
      schema: { type: string, enum: ['true'] }

  responses:
    Unauthorized:
      description: Missing or invalid bearer token
    Problem:
      description: Problem details (RFC 9457, API_SPECIFICATION §3)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Code:
      type: string
      pattern: '^[A-Z0-9_]{1,40}$'
    NullableCode:
      oneOf: [ { $ref: '#/components/schemas/Code' }, { type: 'null' } ]
    Country:
      type: string
      description: ISO 3166-1 alpha-3 country code
      pattern: '^[A-Z]{3}$'
    Channel:
      type: string
      description: Channels of API_SPECIFICATION §2 (`X-Channel`)
      enum: [PORTAL, APP, BACKOFFICE, PARTNER, KIOSK, CALLCENTRE, FIELD, ASSISTANT, AGENT]
    DocumentType:
      type: string
      enum: [NATIONAL_ID, PASSPORT]
    Document:
      type: object
      additionalProperties: false
      description: |
        A national identity number (`nationalIdNo`, format set per environment, Q-057), or a passport
        (`passportNo` and `passportCountry`).
      required: [type]
      properties:
        type: { $ref: '#/components/schemas/DocumentType' }
        nationalIdNo: { oneOf: [ { type: string, maxLength: 40 }, { type: 'null' } ] }
        passportNo: { oneOf: [ { type: string, pattern: '^[A-Z0-9]{5,20}$' }, { type: 'null' } ] }
        passportCountry: { oneOf: [ { $ref: '#/components/schemas/Country' }, { type: 'null' } ] }
    Name:
      type: object
      additionalProperties: false
      description: Given and family name in the national language and in English; at least one complete pair (CC-012)
      properties:
        givenNl: { oneOf: [ { type: string, maxLength: 100 }, { type: 'null' } ] }
        familyNl: { oneOf: [ { type: string, maxLength: 100 }, { type: 'null' } ] }
        givenEn: { oneOf: [ { type: string, maxLength: 100 }, { type: 'null' } ] }
        familyEn: { oneOf: [ { type: string, maxLength: 100 }, { type: 'null' } ] }
    VisitorIdentity:
      type: object
      additionalProperties: false
      required: [name, nationality, birthDate, gender]
      properties:
        name: { $ref: '#/components/schemas/Name' }
        nationality: { $ref: '#/components/schemas/Country' }
        birthDate: { type: string, format: date }
        gender: { $ref: '#/components/schemas/Code' }
    CodeList:
      type: array
      maxItems: 20
      uniqueItems: true
      items: { $ref: '#/components/schemas/Code' }
    Profile:
      type: object
      additionalProperties: false
      description: |
        DL-005. Codes are reference-data codes. `bloodGroup` and `physicalConditions` are health data (secret); in
        responses they are `null` unless the caller holds `trafficfile.sensitive.read`.
      properties:
        mobile: { oneOf: [ { type: string, pattern: '^\+[1-9][0-9]{6,14}$' }, { type: 'null' } ] }
        email: { oneOf: [ { type: string, maxLength: 320 }, { type: 'null' } ] }
        address: { oneOf: [ { type: string, maxLength: 500 }, { type: 'null' } ] }
        bloodGroup: { $ref: '#/components/schemas/NullableCode' }
        educationLevel: { $ref: '#/components/schemas/NullableCode' }
        profession: { $ref: '#/components/schemas/NullableCode' }
        languages: { oneOf: [ { $ref: '#/components/schemas/CodeList' }, { type: 'null' } ] }
        physicalConditions: { oneOf: [ { $ref: '#/components/schemas/CodeList' }, { type: 'null' } ] }
        religion: { $ref: '#/components/schemas/NullableCode' }
        determinationStatus: { $ref: '#/components/schemas/NullableCode' }
    OpenIndividualRequest:
      type: object
      additionalProperties: false
      required: [document, category, type, regionOpened]
      properties:
        document: { $ref: '#/components/schemas/Document' }
        category: { $ref: '#/components/schemas/Code' }
        type: { $ref: '#/components/schemas/Code' }
        regionOpened: { $ref: '#/components/schemas/Code' }
        visitorIdentity: { oneOf: [ { $ref: '#/components/schemas/VisitorIdentity' }, { type: 'null' } ] }
        profile: { oneOf: [ { $ref: '#/components/schemas/Profile' }, { type: 'null' } ] }
    FileNumber:
      type: string
      pattern: '^[A-Z0-9][A-Z0-9-]{0,19}$'
    FileNumberList:
      type: array
      maxItems: 20
      uniqueItems: true
      items: { $ref: '#/components/schemas/FileNumber' }
    Licence:
      type: object
      additionalProperties: false
      required: [source, number]
      properties:
        source:
          $ref: '#/components/schemas/Code'
          description: The issuing authority (reference list of commercial licence sources)
        number: { type: string, pattern: '^[A-Za-z0-9/-]{1,40}$' }
    OpenCompanyRequest:
      type: object
      additionalProperties: false
      required: [licence, category, type, regionOpened, signatories]
      properties:
        licence: { $ref: '#/components/schemas/Licence' }
        category: { $ref: '#/components/schemas/Code' }
        type: { $ref: '#/components/schemas/Code' }
        regionOpened: { $ref: '#/components/schemas/Code' }
        signatories:
          allOf: [ { $ref: '#/components/schemas/FileNumberList' } ]
          minItems: 1
        fleetManagers: { oneOf: [ { $ref: '#/components/schemas/FileNumberList' }, { type: 'null' } ] }
    RepresentativesUpdateRequest:
      type: object
      additionalProperties: false
      required: [version, signatories]
      properties:
        version: { type: integer, minimum: 1 }
        signatories:
          allOf: [ { $ref: '#/components/schemas/FileNumberList' } ]
          minItems: 1
        fleetManagers: { oneOf: [ { $ref: '#/components/schemas/FileNumberList' }, { type: 'null' } ] }
    Company:
      type: object
      additionalProperties: false
      required: [licence, activities, licenceExpiry, signatories, fleetManagers]
      properties:
        licence: { $ref: '#/components/schemas/Licence' }
        nameNl: { oneOf: [ { type: string }, { type: 'null' } ] }
        nameEn: { oneOf: [ { type: string }, { type: 'null' } ] }
        activities: { type: array, items: { $ref: '#/components/schemas/Code' } }
        licenceExpiry: { type: string, format: date }
        signatories: { type: array, items: { $ref: '#/components/schemas/FileNumber' } }
        fleetManagers: { type: array, items: { $ref: '#/components/schemas/FileNumber' } }
    RegisterNotification:
      type: object
      additionalProperties: false
      required: [eventId, nationalIdNo, changeType]
      properties:
        eventId: { type: string, pattern: '^[A-Za-z0-9._:-]{1,100}$' }
        nationalIdNo: { type: string, maxLength: 40 }
        changeType: { type: string, enum: [RESIDENCY, NAME, NATIONALITY, DEATH] }
        effectiveDate: { oneOf: [ { type: string, format: date }, { type: 'null' } ] }
    RegisterNotificationResult:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome: { type: string, enum: [APPLIED, UNCHANGED, DUPLICATE, NO_FILE, FILE_NOT_ACTIVE, NOT_IN_REGISTER] }
        fileNumber: { oneOf: [ { type: string }, { type: 'null' } ] }
    MergeRequest:
      type: object
      additionalProperties: false
      required: [mergedFileNumber, reason]
      properties:
        mergedFileNumber: { $ref: '#/components/schemas/FileNumber' }
        reason: { $ref: '#/components/schemas/Reason' }
    Merge:
      type: object
      additionalProperties: false
      required: [id, mergedFileNumber, survivingFileNumber, reason, actorId, channel, at]
      properties:
        id: { type: string, format: uuid }
        mergedFileNumber: { type: string }
        survivingFileNumber: { type: string }
        reason: { type: string }
        actorId: { type: string }
        channel: { $ref: '#/components/schemas/Channel' }
        at: { type: string, format: date-time }
    DuplicateCandidate:
      type: object
      additionalProperties: false
      required: [file, nameSimilarity]
      properties:
        file: { $ref: '#/components/schemas/TrafficFile' }
        nameSimilarity: { type: number, minimum: 0, maximum: 1 }
    DuplicateCandidateCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DuplicateCandidate' }
    Reason:
      type: string
      minLength: 3
      maxLength: 500
    PlaceBanRequest:
      type: object
      additionalProperties: false
      required: [person, reason, source]
      properties:
        person: { $ref: '#/components/schemas/Document' }
        reason: { $ref: '#/components/schemas/Reason' }
        source: { $ref: '#/components/schemas/Code' }
        sourceRef: { oneOf: [ { type: string, pattern: '^[A-Za-z0-9._:/-]{1,100}$' }, { type: 'null' } ] }
        startDate: { oneOf: [ { type: string, format: date }, { type: 'null' } ] }
        endDate: { oneOf: [ { type: string, format: date }, { type: 'null' } ] }
    LiftBanRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { $ref: '#/components/schemas/Reason' }
    SearchBansRequest:
      type: object
      additionalProperties: false
      required: [person]
      properties:
        person: { $ref: '#/components/schemas/Document' }
    BanChange:
      type: object
      additionalProperties: false
      required: [actorId, channel, at]
      properties:
        actorId: { type: string }
        actorUsername: { oneOf: [ { type: string }, { type: 'null' } ] }
        channel: { $ref: '#/components/schemas/Channel' }
        at: { type: string, format: date-time }
        reason: { oneOf: [ { type: string }, { type: 'null' } ] }
    BanPerson:
      type: object
      additionalProperties: false
      description: Identity numbers are masked to the last four characters unless the caller holds
        `trafficfile.sensitive.read`
      required: [type]
      properties:
        type: { $ref: '#/components/schemas/DocumentType' }
        nationalIdNo: { oneOf: [ { type: string }, { type: 'null' } ] }
        passportNo: { oneOf: [ { type: string }, { type: 'null' } ] }
        passportCountry: { oneOf: [ { $ref: '#/components/schemas/Country' }, { type: 'null' } ] }
    BanEntry:
      type: object
      additionalProperties: false
      required: [id, person, reason, source, startDate, status, inForce, placed, version]
      properties:
        id: { type: string, format: uuid }
        person: { $ref: '#/components/schemas/BanPerson' }
        fileNumber: { oneOf: [ { type: string }, { type: 'null' } ] }
        reason: { type: string }
        source: { $ref: '#/components/schemas/Code' }
        sourceRef: { oneOf: [ { type: string }, { type: 'null' } ] }
        startDate: { type: string, format: date }
        endDate: { oneOf: [ { type: string, format: date }, { type: 'null' } ] }
        status: { type: string, enum: [ACTIVE, LIFTED, EXPIRED] }
        inForce: { type: boolean, description: Active and started today }
        placed: { $ref: '#/components/schemas/BanChange' }
        lifted: { oneOf: [ { $ref: '#/components/schemas/BanChange' }, { type: 'null' } ] }
        version: { type: integer }
    BanEntryCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BanEntry' }
    SearchRequest:
      type: object
      additionalProperties: false
      required: [document]
      properties:
        document: { $ref: '#/components/schemas/Document' }
    NameSearchRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          description: Letters of any script, spaces and . ' - with at least two letters (422 NAME_QUERY_INVALID otherwise)
        kind:
          oneOf: [ { type: string, enum: [INDIVIDUAL, COMPANY] }, { type: 'null' } ]
          description: Only people or only companies; both when absent
        limit:
          oneOf: [ { type: integer, minimum: 1, maximum: 100 }, { type: 'null' } ]
    NameHit:
      type: object
      additionalProperties: false
      required: [fileNumber, kind, status, regionOpened, match]
      properties:
        fileNumber: { $ref: '#/components/schemas/FileNumber' }
        kind: { type: string, enum: [INDIVIDUAL, COMPANY] }
        status: { type: string, enum: [ACTIVE, CLOSED, DECEASED] }
        regionOpened: { $ref: '#/components/schemas/Code' }
        match: { type: string, enum: [EXACT, PARTIAL, PHONETIC] }
        nameNl:
          oneOf: [ { type: string }, { type: 'null' } ]
          description: Given and family name, or the company's name, in the national language
        nameEn:
          oneOf: [ { type: string }, { type: 'null' } ]
          description: Given and family name, or the company's name, in English
    NameHitCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/NameHit' }
    ProfileUpdateRequest:
      type: object
      additionalProperties: false
      required: [version, profile]
      properties:
        version: { type: integer, minimum: 1 }
        profile: { $ref: '#/components/schemas/Profile' }
    Change:
      type: object
      additionalProperties: false
      required: [actorId, channel, at]
      properties:
        actorId: { type: string }
        actorUsername: { oneOf: [ { type: string }, { type: 'null' } ] }
        channel: { $ref: '#/components/schemas/Channel' }
        at: { type: string, format: date-time }
    Identity:
      type: object
      additionalProperties: false
      required: [documentType, name, nationality, birthDate, gender]
      properties:
        documentType: { $ref: '#/components/schemas/DocumentType' }
        nationalIdNo:
          oneOf: [ { type: string }, { type: 'null' } ]
          description: Masked to the last four characters unless the caller holds `trafficfile.sensitive.read`
        passportNo:
          oneOf: [ { type: string }, { type: 'null' } ]
          description: Masked to the last four characters unless the caller holds `trafficfile.sensitive.read`
        passportCountry: { oneOf: [ { $ref: '#/components/schemas/Country' }, { type: 'null' } ] }
        name: { $ref: '#/components/schemas/Name' }
        nationality: { $ref: '#/components/schemas/Country' }
        birthDate: { type: string, format: date }
        gender: { $ref: '#/components/schemas/Code' }
        residencyStatus: { $ref: '#/components/schemas/NullableCode' }
        residencyExpiry: { oneOf: [ { type: string, format: date }, { type: 'null' } ] }
    TrafficFile:
      type: object
      additionalProperties: false
      required: [fileNumber, kind, category, type, status, regionOpened, identitySource, lockedFields, opened,
                 lastChange, version]
      properties:
        fileNumber: { type: string }
        kind: { type: string, enum: [INDIVIDUAL, COMPANY] }
        category: { $ref: '#/components/schemas/Code' }
        type: { $ref: '#/components/schemas/Code' }
        status: { type: string, enum: [ACTIVE, MERGED, CLOSED, DECEASED] }
        survivingFileNumber:
          description: The file this one was merged into (status MERGED); null otherwise (DL-009)
          oneOf: [ { type: string }, { type: 'null' } ]
        regionOpened: { $ref: '#/components/schemas/Code' }
        identitySource:
          type: string
          enum: [REGISTER, DOCUMENT]
          description: |
            REGISTER = from the national identity register or, for a company, the licensing authority; those fields are
            locked (DL-002). DOCUMENT = a visitor's passport
        registerSyncedAt: { oneOf: [ { type: string, format: date-time }, { type: 'null' } ] }
        identity:
          description: The individual's identity; null for a company
          oneOf: [ { $ref: '#/components/schemas/Identity' }, { type: 'null' } ]
        company:
          description: The company; null for an individual
          oneOf: [ { $ref: '#/components/schemas/Company' }, { type: 'null' } ]
        lockedFields:
          type: array
          description: Fields staff cannot change because they come from the register or authority (DL-002)
          items: { type: string }
        profile:
          description: The individual's profile; null for a company
          oneOf: [ { $ref: '#/components/schemas/Profile' }, { type: 'null' } ]
        opened: { $ref: '#/components/schemas/Change' }
        lastChange: { $ref: '#/components/schemas/Change' }
        version: { type: integer, minimum: 1 }
    TrafficFileCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TrafficFile' }
    FileVersion:
      type: object
      additionalProperties: false
      required: [version, validFrom, changedBy, state]
      properties:
        version: { type: integer }
        validFrom: { type: string, format: date-time }
        validTo: { oneOf: [ { type: string, format: date-time }, { type: 'null' } ] }
        changedBy: { type: string }
        state:
          type: object
          description: The stored row of that version (identity numbers masked and health fields removed unless the
            caller holds `trafficfile.sensitive.read`)
    FileVersionCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FileVersion' }
    Problem:
      type: object
      required: [status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        instance: { type: string }
        correlationId: { type: string }
        requirementRefs: { type: array, items: { type: string } }
        errors: { type: array, items: { type: object } }
