# transaction-service configuration. All environment-specific values come from environment variables
# (NFR-042, SEC-004); nothing secret is stored here.
spring:
  application:
    name: transaction-service
  datasource:
    url: ${TXN_DB_URL}
    username: ${TXN_DB_USER}
    password: ${TXN_DB_PASSWORD}
  flyway:
    locations: classpath:db/platform,classpath:db/migration
  messages:
    basename: messages
    fallback-to-system-locale: false
  threads:
    virtual:
      enabled: true

itms:
  security:
    issuer: ${ITMS_OIDC_ISSUER}
    jwk-set-uri: ${ITMS_OIDC_JWKS_URI}
    audience: itms-api
    # Grants come from iam-service (ADR-022). token-claims is the interim ADR-018 mode, for tests only.
    authorisation-source: ${ITMS_AUTHORISATION_SOURCE:iam}
    iam:
      base-url: ${ITMS_IAM_URL:}
      cache-ttl: ${ITMS_IAM_CACHE_TTL:60s}
  transaction:
    # CC-024: Drafts not submitted within the period expire (BRD default 30 days; ADR-031). Business configuration,
    # set per environment; never hard-coded in the code.
    draft-expiry:
      enabled: ${ITMS_DRAFT_EXPIRY_ENABLED:true}
      period: ${ITMS_DRAFT_EXPIRY_PERIOD:30d}
      interval: ${ITMS_DRAFT_EXPIRY_INTERVAL:15m}
      batch-size: ${ITMS_DRAFT_EXPIRY_BATCH_SIZE:100}
      max-batches: ${ITMS_DRAFT_EXPIRY_MAX_BATCHES:50}
  # Calls to other services through their APIs (ADR-034), each with this service's own client-credentials account
  # at the identity provider (INT-004). The secret comes from the environment only (SEC-004).
  clients:
    # CC-032: eligibility before submission, hold-eligibility-service POST /v1/eligibility-checks. Its account needs
    # the iam role ELIGIBILITY_CHECKER. Without an answer a submission is refused (503 ELIGIBILITY_UNAVAILABLE).
    eligibility:
      base-url: ${ITMS_ELIGIBILITY_URL}
      token-uri: ${ITMS_OIDC_TOKEN_URI}
      client-id: ${ITMS_SERVICE_CLIENT_ID:itms-transaction-service}
      client-secret: ${ITMS_SERVICE_CLIENT_SECRET}
      timeout: ${ITMS_ELIGIBILITY_TIMEOUT:2s}
  # API_SPECIFICATION §2, ADR-032: state-changing transaction POSTs need an Idempotency-Key; a retry with the same key
  # and request replays the stored response. Retention and lock timeout are set per environment (Q-052).
  idempotency:
    enabled: true
    paths:
      - /v1/transactions
      - /v1/transactions/*/submissions
      - /v1/transactions/*/cancellations
    retention: ${ITMS_IDEMPOTENCY_RETENTION:24h}
    lock-timeout: ${ITMS_IDEMPOTENCY_LOCK_TIMEOUT:30s}
    cleanup-interval: ${ITMS_IDEMPOTENCY_CLEANUP_INTERVAL:15m}
    cleanup-batch-size: ${ITMS_IDEMPOTENCY_CLEANUP_BATCH_SIZE:500}

# Observability (NFR-040, ADR-037). Probes and the Prometheus scrape are served on a separate management port, reached
# only from the operations network; on that port they need no token (ManagementRequests). Traces and logs go to an
# OpenTelemetry collector only when its endpoints are set, for example
# MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://otel-collector:4318/v1/traces and
# MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT=http://otel-collector:4318/v1/logs.
management:
  server:
    port: ${ITMS_MANAGEMENT_PORT:8090}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
  tracing:
    sampling:
      probability: ${ITMS_TRACING_SAMPLING_PROBABILITY:0.1}

server:
  error:
    include-stacktrace: never
    include-message: never

# Log levels are set per service (NFR-040): ITMS_LOG_LEVEL for ITMS code, ITMS_LOG_LEVEL_ROOT for everything else.
logging:
  level:
    root: ${ITMS_LOG_LEVEL_ROOT:INFO}
    gov.itms: ${ITMS_LOG_LEVEL:INFO}
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
    correlation: "[%X{traceId:-},%X{spanId:-}] "
