# transaction-service configuration. All environment-specific values come from environment variables
# (NFR-042, SEC-004); nothing secret is stored here.
spring:
  application:
    name: transaction-service
  datasource:
    url: ${TXN_DB_URL}
    username: ${TXN_DB_USER}
    password: ${TXN_DB_PASSWORD}
  flyway:
    locations: classpath:db/platform,classpath:db/migration
  messages:
    basename: messages
    fallback-to-system-locale: false
  threads:
    virtual:
      enabled: true

itms:
  security:
    issuer: ${ITMS_OIDC_ISSUER}
    jwk-set-uri: ${ITMS_OIDC_JWKS_URI}
    audience: itms-api
    # Grants come from iam-service (ADR-022). token-claims is the interim ADR-018 mode, for tests only.
    authorisation-source: ${ITMS_AUTHORISATION_SOURCE:iam}
    iam:
      base-url: ${ITMS_IAM_URL:}
      cache-ttl: ${ITMS_IAM_CACHE_TTL:60s}
  transaction:
    # CC-024: Drafts not submitted within the period expire (BRD default 30 days; ADR-031). Business configuration,
    # set per environment; never hard-coded in the code.
    draft-expiry:
      enabled: ${ITMS_DRAFT_EXPIRY_ENABLED:true}
      period: ${ITMS_DRAFT_EXPIRY_PERIOD:30d}
      interval: ${ITMS_DRAFT_EXPIRY_INTERVAL:15m}
      batch-size: ${ITMS_DRAFT_EXPIRY_BATCH_SIZE:100}
      max-batches: ${ITMS_DRAFT_EXPIRY_MAX_BATCHES:50}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

server:
  error:
    include-stacktrace: never
    include-message: never

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
