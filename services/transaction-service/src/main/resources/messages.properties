# Plain-language problem messages (CH-053). English; national-language bundle: messages_ar.properties.
problem.VALIDATION_FAILED=Some fields are missing or invalid. Correct them and try again.
problem.FORBIDDEN=You do not have permission to do this. Ask your administrator if you need access.
problem.NOT_FOUND=The requested resource was not found.
problem.METHOD_NOT_ALLOWED=This action is not available for this resource.
problem.UNSUPPORTED_MEDIA_TYPE=The request must be sent as JSON.
problem.AUTHORISATION_UNAVAILABLE=Access rights cannot be checked right now, so the request was not processed. Try again shortly.
problem.INTERNAL_ERROR=Something went wrong on our side. Try again later; if it continues, contact support with the reference number.
problem.INVALID_CODE={0} must be 1 to 40 characters using A-Z, 0-9 or underscore.
problem.INVALID_SERVICE_CODE=A service code must be 2 to 20 characters using A-Z, 0-9 or underscore, starting with a letter.
problem.LIST_SIZE_INVALID={0} needs {1} to {2} entries.
problem.LIST_DUPLICATES={0} lists the same entry twice. Remove the repeated entry.
problem.NAME_REQUIRED=Enter the name in both languages.
problem.NAME_TOO_LONG=Names can be at most 200 characters.
problem.REASON_REQUIRED=Give a reason of at least 3 characters.
problem.REASON_TOO_LONG=The reason can be at most 500 characters.
problem.SLA_INVALID=Enter the SLA as a positive time in days, hours or minutes, for example P5D (5 days) or PT4H (4 hours).
problem.REGIONS_ALL_MIXED=Choose either all regions (*) or a list of regions, not both.
problem.RULE_START_REQUIRED=Enter the date from which the rule applies.
problem.RULE_DATES_INVALID=The end date cannot be before the start date.
problem.RULE_START_IN_PAST=A rule cannot start on a day that has passed. Choose today or a later date.
problem.RULE_END_INVALID=A rule cannot end before it starts.
problem.RULE_END_IN_PAST=A rule cannot be ended on a day that has passed. Choose today or a later date.
problem.RULE_END_NOT_EARLIER=A rule can only be ended earlier than its current end date.
problem.RULE_OUTSIDE_OFFER=The service is not offered for {0}. Change the service definition first, or choose an offered region or channel.
problem.RULE_OVERLAP=Another rule for the same region and channel applies on some of these days. End it first or choose other dates.
problem.AVAILABILITY_QUERY_INVALID=Give both a region and a channel to see which services are available there.
problem.SERVICE_CODE_IMMUTABLE=The code of a service cannot be changed.
problem.SERVICE_CODE_MISMATCH=The service code in the definition must match the service code of the change.
problem.CHANGE_TYPE_REQUIRED=Choose the type of change.
problem.CHANGE_SHAPE_INVALID=This type of change ({0}) needs different fields. Check the change type and the fields you filled in.
problem.CHANGE_NOT_PENDING=This change has already been decided ({0}).
problem.SEGREGATION_OF_DUTIES=You submitted this change, so another authorised person must approve or reject it.
problem.CHANGE_ALREADY_PENDING=Another change to service {0} is waiting for approval. Wait for it to be decided first.
problem.SERVICE_EXISTS=The service {0} already exists.
problem.STALE_CHANGE=The service was changed after this change was prepared. Open the service again and prepare a new change.
problem.SERVICE_NOT_FOUND=The service {0} does not exist.
problem.RULE_NOT_FOUND=The availability rule does not exist for this service.
problem.CHANGE_NOT_FOUND=The change does not exist.
# Transactions (CC-021..CC-023, CC-027, CC-113; ADR-029)
problem.UNKNOWN_SERVICE=The service {0} does not exist. Choose a service from the catalogue.
problem.CHANNEL_REQUIRED=The request does not say through which channel it was made. Use a supported channel and try again.
problem.SERVICE_NOT_AVAILABLE=The service {0} is not available in region {1} on {2} today. Choose another region or channel, or try again when the service is available.
problem.HOME_REGION_ONLY=The service {0} can only be used in the region of the traffic file of the applicant ({1}). Choose that region.
problem.SCOPE_EXCEEDED=You can only handle transactions in your own regions and modules.
problem.DUPLICATE_OPEN_TRANSACTION=There is already an open transaction of service {0} for this subject{1}. Finish or cancel it before starting a new one.
problem.ILLEGAL_TRANSITION=A transaction in status {0} cannot move to {1}.
problem.TRANSACTION_NOT_FOUND=There is no transaction with this reference. Check the reference and try again.
problem.TRANSACTION_CHANGED=The transaction was changed by someone else. Open it again and try again.
problem.REFERENCE_SEQUENCE_EXHAUSTED=No reference numbers are left this year for service {0} in region {1}. Contact the system administrator.
problem.BUSINESS_NUMBER_INVALID={0} must be 1 to 40 characters of A-Z, 0-9 or -, starting with a letter or a digit.
