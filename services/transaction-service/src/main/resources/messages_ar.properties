# Plain-language problem messages (CH-053) in the national language. DRAFT: to be reviewed by the Authority (Q-006).
problem.VALIDATION_FAILED=بعض الحقول ناقصة أو غير صحيحة. صحّحها ثم حاول مرة أخرى.
problem.FORBIDDEN=ليست لديك صلاحية للقيام بذلك. اطلب الصلاحية من المسؤول إن كنت تحتاجها.
problem.NOT_FOUND=المورد المطلوب غير موجود.
problem.METHOD_NOT_ALLOWED=هذا الإجراء غير متاح لهذا المورد.
problem.UNSUPPORTED_MEDIA_TYPE=يجب إرسال الطلب بصيغة JSON.
problem.AUTHORISATION_UNAVAILABLE=لا يمكن التحقق من الصلاحيات الآن، لذلك لم يُنفَّذ الطلب. حاول مرة أخرى بعد قليل.
problem.INTERNAL_ERROR=حدث خطأ من جهتنا. حاول لاحقاً، وإذا استمر الخطأ تواصل مع الدعم مع ذكر الرقم المرجعي.
problem.INVALID_CODE=يجب أن يتكون {0} من 1 إلى 40 حرفاً من A-Z أو 0-9 أو الشرطة السفلية.
problem.INVALID_SERVICE_CODE=يجب أن يتكون رمز الخدمة من 2 إلى 20 حرفاً من A-Z أو 0-9 أو الشرطة السفلية، وأن يبدأ بحرف.
problem.LIST_SIZE_INVALID=يحتاج {0} إلى عدد من {1} إلى {2} من الإدخالات.
problem.LIST_DUPLICATES=يحتوي {0} على إدخال مكرر. احذف الإدخال المكرر.
problem.NAME_REQUIRED=أدخل الاسم باللغتين.
problem.NAME_TOO_LONG=يجب ألا يزيد الاسم على 200 حرف.
problem.REASON_REQUIRED=اذكر سبباً لا يقل عن 3 أحرف.
problem.REASON_TOO_LONG=يجب ألا يزيد السبب على 500 حرف.
problem.SLA_INVALID=أدخل مدة الإنجاز بالأيام أو الساعات أو الدقائق، مثل P5D (5 أيام) أو PT4H (4 ساعات).
problem.REGIONS_ALL_MIXED=اختر جميع المناطق (*) أو قائمة مناطق، وليس الاثنين معاً.
problem.RULE_START_REQUIRED=أدخل التاريخ الذي تبدأ منه القاعدة.
problem.RULE_DATES_INVALID=لا يمكن أن يسبق تاريخ الانتهاء تاريخ البدء.
problem.RULE_START_IN_PAST=لا يمكن أن تبدأ القاعدة في يوم مضى. اختر اليوم أو تاريخاً لاحقاً.
problem.RULE_END_INVALID=لا يمكن أن تنتهي القاعدة قبل أن تبدأ.
problem.RULE_END_IN_PAST=لا يمكن إنهاء القاعدة في يوم مضى. اختر اليوم أو تاريخاً لاحقاً.
problem.RULE_END_NOT_EARLIER=يمكن فقط تقديم تاريخ انتهاء القاعدة، لا تأخيره.
problem.RULE_OUTSIDE_OFFER=الخدمة غير مقدَّمة في {0}. عدّل تعريف الخدمة أولاً أو اختر منطقة أو قناة مقدَّمة.
problem.RULE_OVERLAP=توجد قاعدة أخرى للمنطقة والقناة نفسيهما في بعض هذه الأيام. أنهِها أولاً أو اختر تواريخ أخرى.
problem.AVAILABILITY_QUERY_INVALID=حدد المنطقة والقناة معاً لعرض الخدمات المتاحة فيهما.
problem.SERVICE_CODE_IMMUTABLE=لا يمكن تغيير رمز الخدمة.
problem.SERVICE_CODE_MISMATCH=يجب أن يطابق رمز الخدمة في التعريف رمز الخدمة في التغيير.
problem.CHANGE_TYPE_REQUIRED=اختر نوع التغيير.
problem.CHANGE_SHAPE_INVALID=يحتاج هذا النوع من التغيير ({0}) إلى حقول مختلفة. راجع نوع التغيير والحقول التي أدخلتها.
problem.CHANGE_NOT_PENDING=تم البت في هذا التغيير مسبقاً ({0}).
problem.SEGREGATION_OF_DUTIES=أنت من قدّم هذا التغيير، لذا يجب أن يعتمده أو يرفضه شخص مخوَّل آخر.
problem.CHANGE_ALREADY_PENDING=يوجد تغيير آخر على الخدمة {0} بانتظار الاعتماد. انتظر حتى يُبت فيه أولاً.
problem.SERVICE_EXISTS=الخدمة {0} موجودة مسبقاً.
problem.STALE_CHANGE=تغيّرت الخدمة بعد إعداد هذا التغيير. افتح الخدمة مرة أخرى وأعدّ تغييراً جديداً.
problem.SERVICE_NOT_FOUND=الخدمة {0} غير موجودة.
problem.RULE_NOT_FOUND=قاعدة الإتاحة غير موجودة لهذه الخدمة.
problem.CHANGE_NOT_FOUND=التغيير غير موجود.
