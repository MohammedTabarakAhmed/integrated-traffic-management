openapi: 3.1.0
info:
  title: ITMS Transaction Service
  version: 1.0.0
  description: |
    The service catalogue (CC-020): every service the Authority offers, with its code, names in both languages,
    module, eligible customer types, channels, required documents, fee, rule and workflow references, SLA and the
    regions where it is offered. Administrators enable or disable a service per region and per channel with
    effective dates (CC-026). Every catalogue change goes through maker-checker approval and is audited (CC-114,
    CC-002, CC-120); definitions keep a full version history (DAT-002, CC-121).

    Transactions (CC-021..CC-023, CC-027, CC-113; ADR-029): a request for a catalogue service about one subject
    (traffic file, vehicle, driving licence or plate). Each gets a reference `<ServiceCode>-<Region>-<YYYY>-<Sequence>`
    (CC-021; a 7-digit sequence per service, region and year, Q-003) and follows the lifecycle of CC-022 / LLD §2.1.
    Every status change is kept in an append-only status history with user, channel, time, reason and previous status
    (CC-023). This version lets staff create, submit and cancel a transaction; payment, review, return-for-information,
    decision and fulfilment transitions are commands of the services built later (payments, workflow). A Draft not
    submitted within a configured period (default 30 days, counted from opening) expires automatically: the service
    does it on its own schedule, recorded with actor and channel `SYSTEM` and reason `EXPIRED` (CC-024, ADR-031); a
    submission that arrives after that answers 409 `ILLEGAL_TRANSITION`. A transaction is tracked by its reference or through the applicant's list, whatever channel it was
    opened through (CC-025; staff-assisted until customers can sign in, Q-050). The channel is the `X-Channel` header (set by the gateway or BFF); a transaction cannot be created or
    changed without a known channel.

    Availability of a service for (region, channel, date): the service must be offered in that region and on that
    channel by its definition; then the availability rule in force with the most specific match decides
    (region and channel, then region only, then channel only, then all regions and channels). With no rule in
    force the service is available (ADR-028).

    Only GET/POST are used (INT-003); business actions are POSTs to sub-resources.
    Request input (SEC-022), all endpoints, enforced once in itms-platform: enum values are exactly their names as
    JSON strings (a number, padding or a control character is refused), also in query parameters; integers are
    JSON integers (a fraction, exponent form, string or boolean is refused, never truncated); text is a JSON
    string without the NUL character (U+0000); every `date-time` / `date` is an RFC 3339 string with a
    four-digit year (`0001-01-01T00:00:00Z` .. `9999-12-31T23:59:59.999999Z`; dates `0001-01-01` .. `9999-12-31`).
    A request that breaks one of these rules is refused with 400 `VALIDATION_FAILED`.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: Service catalogue
  - name: Catalogue changes (maker-checker)
  - name: Transactions

paths:
  /v1/services:
    get:
      tags: [Service catalogue]
      operationId: listServices
      summary: List service definitions; with region and channel, only the services available there
      description: |
        Without filters, every service definition. With both `region` and `channel`, only the services available in
        that region on that channel on `date` (default today, in UTC). Giving only one of the two is refused.
      x-itms-permission: authenticated
      parameters:
        - name: region
          in: query
          schema: { $ref: '#/components/schemas/Code' }
        - name: channel
          in: query
          schema: { $ref: '#/components/schemas/Channel' }
        - name: date
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Service definitions, by code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceDefinitionCollection' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/services/{serviceCode}:
    get:
      tags: [Service catalogue]
      operationId: getService
      x-itms-permission: authenticated
      parameters:
        - $ref: '#/components/parameters/ServiceCode'
      responses:
        '200':
          description: Service definition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceDefinition' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/services/{serviceCode}/history:
    get:
      tags: [Service catalogue]
      operationId: getServiceHistory
      summary: Every version of a service definition, oldest first (DAT-002, CC-121)
      x-itms-permission: catalogue.history.read
      parameters:
        - $ref: '#/components/parameters/ServiceCode'
      responses:
        '200':
          description: Versions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceVersionCollection' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/services/{serviceCode}/availability-rules:
    get:
      tags: [Service catalogue]
      operationId: listAvailabilityRules
      summary: Availability rules of a service, including ended ones (CC-026)
      x-itms-permission: authenticated
      parameters:
        - $ref: '#/components/parameters/ServiceCode'
      responses:
        '200':
          description: Rules, by effective start
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilityRuleCollection' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/services/{serviceCode}/availability:
    get:
      tags: [Service catalogue]
      operationId: getAvailability
      summary: Whether a service is available in a region on a channel on a date (CC-026)
      x-itms-permission: authenticated
      parameters:
        - $ref: '#/components/parameters/ServiceCode'
        - name: region
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Code' }
        - name: channel
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Channel' }
        - name: date
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Availability and the reason for it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Availability' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/catalogue-changes:
    post:
      tags: [Catalogue changes (maker-checker)]
      operationId: submitCatalogueChange
      summary: Submit a catalogue change for approval (maker)
      x-itms-permission: catalogue.change.submit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitCatalogueChangeRequest' }
      responses:
        '201':
          description: Change submitted, pending approval
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogueChange' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      tags: [Catalogue changes (maker-checker)]
      operationId: listCatalogueChanges
      summary: List catalogue changes, optionally by status
      x-itms-permission: catalogue.change.read
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ChangeStatus' }
      responses:
        '200':
          description: Changes, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogueChangeCollection' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }

  /v1/catalogue-changes/{changeId}:
    get:
      tags: [Catalogue changes (maker-checker)]
      operationId: getCatalogueChange
      x-itms-permission: catalogue.change.read
      parameters:
        - $ref: '#/components/parameters/ChangeId'
      responses:
        '200':
          description: Change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogueChange' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/catalogue-changes/{changeId}/approvals:
    post:
      tags: [Catalogue changes (maker-checker)]
      operationId: approveCatalogueChange
      summary: Approve and apply a pending change (checker; must not be the maker, CC-002)
      x-itms-permission: catalogue.change.approve
      parameters:
        - $ref: '#/components/parameters/ChangeId'
      responses:
        '200':
          description: Change approved and applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogueChange' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/catalogue-changes/{changeId}/rejections:
    post:
      tags: [Catalogue changes (maker-checker)]
      operationId: rejectCatalogueChange
      summary: Reject a pending change (checker; must not be the maker)
      x-itms-permission: catalogue.change.approve
      parameters:
        - $ref: '#/components/parameters/ChangeId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectCatalogueChangeRequest' }
      responses:
        '200':
          description: Change rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogueChange' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /v1/transactions:
    get:
      tags: [Transactions]
      operationId: listApplicantTransactions
      summary: An applicant's transactions, newest first (CC-025, staff-assisted; the view is audited, CC-120)
      description: |
        Every transaction where `applicantFileNumber` is the applicant, whatever channel it was opened through
        (CC-025). Cursor pagination (API_SPECIFICATION §5): pass `nextCursor` back as `cursor` until it is null.
        Transactions outside the caller's region and module scopes are left out, so a page may hold fewer than
        `limit` items while `nextCursor` is still set. Until customers can sign in, tracking is done by staff on the
        customer's behalf (Q-050).
      x-itms-permission: transaction.read
      parameters:
        - name: applicantFileNumber
          in: query
          required: true
          schema: { $ref: '#/components/schemas/BusinessNumber' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TransactionStatus' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: One page of transactions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Transactions]
      operationId: createTransaction
      summary: Open a transaction in Draft (CC-021, CC-022, CC-027, CC-113)
      description: |
        Opens a Draft transaction of `serviceCode` about `subject` and gives it a reference (CC-021). Refused when:
        the service does not exist (422 `UNKNOWN_SERVICE`); the request has no known `X-Channel` (422
        `CHANNEL_REQUIRED`); the service is not available in `region` on the channel today (422
        `SERVICE_NOT_AVAILABLE`, CC-026, CC-112); the service may only be used in the applicant's home region and
        `region` is another one (422 `HOME_REGION_ONLY`, CC-113); the caller's grant of `transaction.create` does not
        reach the region and the service's module (403 `SCOPE_EXCEEDED`, CC-001); the subject already has an open
        transaction of this service and the service does not allow several (409 `DUPLICATE_OPEN_TRANSACTION`, CC-027).
        `region` defaults to `homeRegion` (Q-003). Until the traffic file service exists, `homeRegion` is stated by
        the calling channel and recorded (Q-046).
      x-itms-permission: transaction.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTransactionRequest' }
      responses:
        '201':
          description: Draft transaction created (or, on a retry with the same Idempotency-Key, the stored response)
          headers:
            Location: { schema: { type: string } }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/transactions/{reference}:
    get:
      tags: [Transactions]
      operationId: getTransaction
      summary: A transaction by reference (the view is audited, CC-120)
      description: A transaction outside the caller's region and module scopes answers 404, as if it did not exist.
      x-itms-permission: transaction.read
      parameters:
        - $ref: '#/components/parameters/Reference'
      responses:
        '200':
          description: Transaction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/transactions/{reference}/status-history:
    get:
      tags: [Transactions]
      operationId: getTransactionStatusHistory
      summary: Every status change of a transaction, oldest first (CC-023; the view is audited, CC-120)
      x-itms-permission: transaction.read
      parameters:
        - $ref: '#/components/parameters/Reference'
      responses:
        '200':
          description: Status changes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusChangeCollection' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/transactions/{reference}/submissions:
    post:
      tags: [Transactions]
      operationId: submitTransaction
      summary: Submit a Draft transaction (CC-022)
      description: |
        Draft → Submitted, then at once, by the system: → Pending payment when the service has a fee, or → In review
        when it has none, recording that the payment steps were skipped (Q-004). Availability and the home-region rule
        are checked again at submission (Q-049). Eligibility (CC-032, ADR-034): hold-eligibility-service is asked
        whether a hold in force blocks the service for the transaction's subject or the applicant's traffic file; if
        so the answer is 422 `ELIGIBILITY_BLOCKED`, `detail` gives every reason and next step in plain language in
        the caller's language, `blocks` lists them (sensitive hold types only as `RESTRICTED` / `CONTACT_AUTHORITY`,
        Q-053) and the transaction stays a Draft. When eligibility cannot be checked the submission is refused with
        503 `ELIGIBILITY_UNAVAILABLE` (fail closed). Rule-based eligibility (rules-service) follows with that service.
        A transaction that is not a Draft answers 409 `ILLEGAL_TRANSITION`.
      x-itms-permission: transaction.create
      parameters:
        - $ref: '#/components/parameters/Reference'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Transaction after submission
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/transactions/{reference}/cancellations:
    post:
      tags: [Transactions]
      operationId: cancelTransaction
      summary: Cancel a transaction in Draft or Pending payment (CC-022, LLD §2.1)
      x-itms-permission: transaction.cancel
      parameters:
        - $ref: '#/components/parameters/Reference'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelTransactionRequest' }
      responses:
        '200':
          description: Transaction cancelled
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ServiceCode:
      name: serviceCode
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ServiceCode' }
    ChangeId:
      name: changeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Reference:
      name: reference
      in: path
      required: true
      schema: { $ref: '#/components/schemas/TransactionReference' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Chosen by the client, new for every intended action, and sent again unchanged on a retry (API_SPECIFICATION
        §2, ADR-032). It belongs to the signed-in caller. A retry with the same key and the same request (method,
        path and body) gets the stored successful response again, marked `Idempotent-Replayed: true`, and the action
        is not repeated. The same key with another request answers 409 `IDEMPOTENCY_KEY_REUSED`; while the first
        request still runs, 409 `IDEMPOTENCY_REQUEST_IN_PROGRESS` with `Retry-After`. A missing key answers 400
        `IDEMPOTENCY_KEY_REQUIRED`, a malformed one 400 `IDEMPOTENCY_KEY_INVALID`. Only successful responses are kept
        (for the configured retention, 24 hours by default); after a refusal or error the key may be used again.
      schema: { type: string, pattern: '^[A-Za-z0-9._:-]{8,128}$' }

  headers:
    IdempotentReplayed:
      description: '`true` when the response is the stored response of an earlier request with the same Idempotency-Key'
      schema: { type: string, enum: ['true'] }

  responses:
    Unauthorized:
      description: Missing or invalid bearer token
    Problem:
      description: Problem details (RFC 9457, API_SPECIFICATION §3)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Code:
      type: string
      pattern: '^[A-Z0-9_]{1,40}$'
    ServiceCode:
      type: string
      description: Part of every transaction reference `<ServiceCode>-<Region>-<YYYY>-<Sequence>` (CC-021), so no hyphen.
      pattern: '^[A-Z][A-Z0-9_]{1,19}$'
    RegionOrAll:
      type: string
      description: A region code, or `*` for every region
      pattern: '^(\*|[A-Z0-9_]{1,40})$'
    Channel:
      type: string
      description: Channels of API_SPECIFICATION §2 (`X-Channel`)
      enum: [PORTAL, APP, BACKOFFICE, PARTNER, KIOSK, CALLCENTRE, FIELD, ASSISTANT, AGENT]
    ChangeChannel:
      type: string
      description: >-
        Channel recorded with a status change (CC-023): the request's channel, or `SYSTEM` for a change the system makes
        on its own schedule (actor `SYSTEM`), such as a Draft not submitted within the configured period expiring
        (CC-024). `SYSTEM` is never accepted as `X-Channel`.
      enum: [PORTAL, APP, BACKOFFICE, PARTNER, KIOSK, CALLCENTRE, FIELD, ASSISTANT, AGENT, SYSTEM]
    ChannelOrAll:
      type: string
      enum: [PORTAL, APP, BACKOFFICE, PARTNER, KIOSK, CALLCENTRE, FIELD, ASSISTANT, AGENT, '*']
    Sla:
      type: string
      description: Standard completion time as an ISO 8601 duration in days, hours or minutes (for example `P5D`, `PT4H`)
      pattern: '^P(?!$)(\d{1,4}D)?(T(?=\d)(\d{1,5}H)?(\d{1,6}M)?)?$'
    BilingualName:
      type: object
      additionalProperties: false
      required: [nl, en]
      properties:
        nl: { type: string, minLength: 1, maxLength: 200, description: National language (RTL) }
        en: { type: string, minLength: 1, maxLength: 200 }
    CodeSet:
      type: array
      uniqueItems: true
      maxItems: 50
      items: { $ref: '#/components/schemas/Code' }
    ServiceSpec:
      type: object
      additionalProperties: false
      description: |
        What a service definition records (CC-020). `regions` lists the regions where the service is offered, or `["*"]`
        for every region (CC-112). `anyRegion` false means a customer may use the service only in their file's home
        region (CC-113 exception). `allowsConcurrentOpen` true lets one subject hold several open transactions of this
        service (CC-027, Q-005). `feeCode`, `ruleSetCode` and `workflowCode` refer to the fee, rule and workflow
        services, which are built later (Q-044).
      required: [code, name, module, customerTypes, channels, requiredDocuments, sla, regions, anyRegion,
                 allowsConcurrentOpen]
      properties:
        code: { $ref: '#/components/schemas/ServiceCode' }
        name: { $ref: '#/components/schemas/BilingualName' }
        module: { $ref: '#/components/schemas/Code' }
        customerTypes:
          type: array
          uniqueItems: true
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/Code' }
        channels:
          type: array
          uniqueItems: true
          minItems: 1
          items: { $ref: '#/components/schemas/Channel' }
        requiredDocuments: { $ref: '#/components/schemas/CodeSet' }
        feeCode: { oneOf: [ { $ref: '#/components/schemas/Code' }, { type: 'null' } ] }
        ruleSetCode: { oneOf: [ { $ref: '#/components/schemas/Code' }, { type: 'null' } ] }
        workflowCode: { oneOf: [ { $ref: '#/components/schemas/Code' }, { type: 'null' } ] }
        sla: { $ref: '#/components/schemas/Sla' }
        regions:
          type: array
          uniqueItems: true
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/RegionOrAll' }
        anyRegion: { type: boolean }
        allowsConcurrentOpen: { type: boolean }
    ServiceDefinition:
      type: object
      additionalProperties: false
      description: The definition in force and its version.
      required: [definition, version, updatedAt]
      properties:
        definition: { $ref: '#/components/schemas/ServiceSpec' }
        version: { type: integer, format: int64 }
        updatedAt: { type: string, format: date-time }
    ServiceDefinitionCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ServiceDefinition' } }
    ServiceVersion:
      type: object
      additionalProperties: false
      description: One historical version and the period during which it was current (DAT-002).
      required: [definition, version, validFrom, changedBy]
      properties:
        definition: { $ref: '#/components/schemas/ServiceSpec' }
        version: { type: integer, format: int64 }
        validFrom: { type: string, format: date-time }
        validTo: { oneOf: [ { type: string, format: date-time }, { type: 'null' } ] }
        changedBy: { type: string }
        changeId: { oneOf: [ { type: string, format: uuid }, { type: 'null' } ] }
    ServiceVersionCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ServiceVersion' } }
    AvailabilityRuleSpec:
      type: object
      additionalProperties: false
      description: |
        Enables or disables the service for a region (or `*`) and a channel (or `*`) from `effectiveFrom` to
        `effectiveTo` (inclusive; open-ended when absent). A rule may only enable regions and channels the definition
        offers. Rules with the same region and channel may not overlap in time.
      required: [region, channel, enabled, effectiveFrom]
      properties:
        region: { $ref: '#/components/schemas/RegionOrAll' }
        channel: { $ref: '#/components/schemas/ChannelOrAll' }
        enabled: { type: boolean }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { oneOf: [ { type: string, format: date }, { type: 'null' } ] }
    AvailabilityRule:
      type: object
      additionalProperties: false
      required: [id, serviceCode, region, channel, enabled, effectiveFrom, changeId]
      properties:
        id: { type: string, format: uuid }
        serviceCode: { $ref: '#/components/schemas/ServiceCode' }
        region: { $ref: '#/components/schemas/RegionOrAll' }
        channel: { $ref: '#/components/schemas/ChannelOrAll' }
        enabled: { type: boolean }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { oneOf: [ { type: string, format: date }, { type: 'null' } ] }
        changeId: { type: string, format: uuid }
    AvailabilityRuleCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AvailabilityRule' } }
    Availability:
      type: object
      additionalProperties: false
      required: [serviceCode, region, channel, date, available, reason]
      properties:
        serviceCode: { $ref: '#/components/schemas/ServiceCode' }
        region: { $ref: '#/components/schemas/Code' }
        channel: { $ref: '#/components/schemas/Channel' }
        date: { type: string, format: date }
        available: { type: boolean }
        reason:
          type: string
          enum: [OFFERED, NOT_OFFERED_IN_REGION, NOT_OFFERED_ON_CHANNEL, ENABLED_BY_RULE, DISABLED_BY_RULE]
        ruleId: { oneOf: [ { type: string, format: uuid }, { type: 'null' } ] }
    ChangeType:
      type: string
      enum: [CREATE_SERVICE, UPDATE_SERVICE, ADD_AVAILABILITY_RULE, END_AVAILABILITY_RULE]
    ChangeStatus:
      type: string
      enum: [PENDING_APPROVAL, APPROVED, REJECTED]
    SubmitCatalogueChangeRequest:
      type: object
      additionalProperties: false
      required: [changeType, serviceCode, reason]
      description: |
        CREATE_SERVICE: `service` (its code equal to `serviceCode`).
        UPDATE_SERVICE: `service` and `baseVersion` (the version the maker saw).
        ADD_AVAILABILITY_RULE: `rule`.
        END_AVAILABILITY_RULE: `ruleId` and `endDate` (the rule's last day in force).
      properties:
        changeType: { $ref: '#/components/schemas/ChangeType' }
        serviceCode: { $ref: '#/components/schemas/ServiceCode' }
        service: { $ref: '#/components/schemas/ServiceSpec' }
        baseVersion: { type: integer, format: int64, minimum: 1 }
        rule: { $ref: '#/components/schemas/AvailabilityRuleSpec' }
        ruleId: { type: string, format: uuid }
        endDate: { type: string, format: date }
        reason: { type: string, minLength: 3, maxLength: 500 }
    RejectCatalogueChangeRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
    Actor:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { type: string }
        username: { oneOf: [ { type: string }, { type: 'null' } ] }
    CatalogueChange:
      type: object
      additionalProperties: false
      required: [id, changeType, status, serviceCode, reason, maker, submittedAt]
      properties:
        id: { type: string, format: uuid }
        changeType: { $ref: '#/components/schemas/ChangeType' }
        status: { $ref: '#/components/schemas/ChangeStatus' }
        serviceCode: { $ref: '#/components/schemas/ServiceCode' }
        service: { oneOf: [ { $ref: '#/components/schemas/ServiceSpec' }, { type: 'null' } ] }
        baseVersion: { oneOf: [ { type: integer, format: int64 }, { type: 'null' } ] }
        rule: { oneOf: [ { $ref: '#/components/schemas/AvailabilityRuleSpec' }, { type: 'null' } ] }
        ruleId: { oneOf: [ { type: string, format: uuid }, { type: 'null' } ] }
        endDate: { oneOf: [ { type: string, format: date }, { type: 'null' } ] }
        reason: { type: string }
        maker: { $ref: '#/components/schemas/Actor' }
        submittedAt: { type: string, format: date-time }
        checker: { oneOf: [ { $ref: '#/components/schemas/Actor' }, { type: 'null' } ] }
        decidedAt: { oneOf: [ { type: string, format: date-time }, { type: 'null' } ] }
        decisionReason: { oneOf: [ { type: string }, { type: 'null' } ] }
    CatalogueChangeCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CatalogueChange' } }
    TransactionReference:
      type: string
      description: |
        `<ServiceCode>-<Region>-<YYYY>-<Sequence>` (CC-021): the service code, the region where the transaction is
        handled, the year it was opened (UTC, Q-006) and a 7-digit sequence per service, region and year (Q-003).
      pattern: '^[A-Z][A-Z0-9_]{1,19}-[A-Z0-9_]{1,40}-[0-9]{4}-[0-9]{7}$'
      maxLength: 74
      example: VL_RENEW-R1-2026-0000001
    BusinessNumber:
      type: string
      description: |
        Interim format of a business number (traffic file number, VIN, licence number, plate number) until the owning
        services define theirs (Q-046): 1-40 characters of A-Z, 0-9 and -, starting with a letter or digit.
      pattern: '^[A-Z0-9][A-Z0-9-]{0,39}$'
    TransactionStatus:
      type: string
      description: CC-022 lifecycle (LLD §2.1)
      enum: [DRAFT, SUBMITTED, PENDING_PAYMENT, PAID, IN_REVIEW, RETURNED_FOR_INFO, APPROVED, REJECTED, COMPLETED,
             CANCELLED, EXPIRED]
    StatusReason:
      type: string
      description: |
        Why the status changed (CC-023). `ZERO_FEE_PAYMENT_SKIPPED` records that a service without a fee skipped
        Pending payment and Paid (Q-004).
      enum: [CREATED, SUBMITTED, PAYMENT_REQUIRED, ZERO_FEE_PAYMENT_SKIPPED, PAYMENT_CONFIRMED, REVIEW_STARTED,
             RETURNED_FOR_INFO, INFO_PROVIDED, APPROVED, REJECTED, FULFILLED, CANCELLED, EXPIRED]
    Subject:
      type: object
      additionalProperties: false
      description: What the transaction is about (CC-027 "person, vehicle, licence"; DATA_MODEL master entities).
      required: [type, id]
      properties:
        type:
          type: string
          enum: [TRAFFIC_FILE, VEHICLE, DRIVING_LICENCE, PLATE]
        id: { $ref: '#/components/schemas/BusinessNumber' }
    CreateTransactionRequest:
      type: object
      additionalProperties: false
      required: [serviceCode, subject, applicantFileNumber, homeRegion]
      properties:
        serviceCode: { $ref: '#/components/schemas/ServiceCode' }
        subject: { $ref: '#/components/schemas/Subject' }
        applicantFileNumber: { $ref: '#/components/schemas/BusinessNumber' }
        homeRegion:
          $ref: '#/components/schemas/Code'
          description: Region where the applicant's traffic file was opened (CC-113; stated by the channel, Q-046)
        region:
          $ref: '#/components/schemas/Code'
          description: Region where the transaction is handled; default `homeRegion` (Q-003)
    CancelTransactionRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }
    Transaction:
      type: object
      additionalProperties: false
      required: [reference, serviceCode, serviceVersion, module, subject, applicantFileNumber, homeRegion, region,
                 channel, status, paymentRequired, createdAt, createdBy, statusChangedAt, version]
      properties:
        reference: { $ref: '#/components/schemas/TransactionReference' }
        serviceCode: { $ref: '#/components/schemas/ServiceCode' }
        serviceVersion:
          type: integer
          format: int64
          description: Version of the service definition the transaction was opened under
        module: { $ref: '#/components/schemas/Code' }
        subject: { $ref: '#/components/schemas/Subject' }
        applicantFileNumber: { $ref: '#/components/schemas/BusinessNumber' }
        homeRegion: { $ref: '#/components/schemas/Code' }
        region: { $ref: '#/components/schemas/Code' }
        channel:
          $ref: '#/components/schemas/Channel'
          description: Channel through which the transaction was opened
        status: { $ref: '#/components/schemas/TransactionStatus' }
        paymentRequired:
          type: boolean
          description: The service had a fee when the transaction was opened (Q-004, Q-049)
        createdAt: { type: string, format: date-time }
        createdBy: { $ref: '#/components/schemas/Actor' }
        submittedAt: { oneOf: [ { type: string, format: date-time }, { type: 'null' } ] }
        statusChangedAt: { type: string, format: date-time }
        version:
          type: integer
          format: int64
          description: Number of status changes so far, the creation included
    TransactionPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Transaction' } }
        nextCursor:
          description: Opaque; pass it back as `cursor` for the next page. Null on the last page.
          oneOf: [ { type: string }, { type: 'null' } ]
    StatusChange:
      type: object
      additionalProperties: false
      description: One status change (CC-023). The system acts as actor `SYSTEM` for automatic steps; a step it takes on its own schedule (Draft expiry, CC-024) also has channel `SYSTEM`.
      required: [sequence, status, reason, actor, channel, changedAt]
      properties:
        sequence: { type: integer, format: int64 }
        previousStatus: { oneOf: [ { $ref: '#/components/schemas/TransactionStatus' }, { type: 'null' } ] }
        status: { $ref: '#/components/schemas/TransactionStatus' }
        reason: { $ref: '#/components/schemas/StatusReason' }
        note: { oneOf: [ { type: string }, { type: 'null' } ] }
        actor: { $ref: '#/components/schemas/Actor' }
        channel: { $ref: '#/components/schemas/ChangeChannel' }
        changedAt: { type: string, format: date-time }
    StatusChangeCollection:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StatusChange' } }
    Problem:
      type: object
      required: [status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        instance: { type: string }
        correlationId: { type: string }
        requirementRefs: { type: array, items: { type: string } }
        errors: { type: array, items: { type: object } }
        nextStep:
          type: string
          description: '`ELIGIBILITY_BLOCKED` only (CC-032): the next step of the first reason, as a code'
        blocks:
          type: array
          description: '`ELIGIBILITY_BLOCKED` only (CC-032): every reason the service is blocked, as the customer may see it'
          items:
            type: object
            additionalProperties: false
            required: [reasonCode, nextStep, message]
            properties:
              reasonCode: { type: string, description: 'A disclosed hold type code, or `RESTRICTED`' }
              nextStep: { type: string }
              message: { type: string }
