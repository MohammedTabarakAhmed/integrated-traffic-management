openapi: 3.1.0
info:
  title: ITMS Vehicle Service
  version: 1.0.0
  description: |
    Vehicles, registration and plates — the Increment 1 core (ADR-055).

    Vehicle records (VL-001, VL-003, VL-004, VL-005) are keyed by a checked VIN (17 characters, check digit for the
    configured manufacturer regions); one active record per VIN. Every change is in the vehicle's history.

    Inspection centres send results (VL-025, VL-040). Inspection is needed from an age set per category (VL-041).

    First registration (VL-010) and renewal (VL-011) check everything **before** a fee is asked: the renewal window
    (default 30 days before expiry), a valid insurance policy checked in real time with the insurer (VL-024; UAT-3:
    409 `INSURANCE_EXPIRED` with "Your vehicle insurance has expired. Renew it with your insurer, then try again.";
    insurer down: 503, fail closed), and a recent passed inspection when needed. Then the fee is quoted by fees-service
    and registered as a payable at payment-service; the answer carries the payable to pay. When payment-service
    confirms the payment, the registration completes: the reserved plate is assigned (first registration, VL-031,
    VL-032) and the new expiry, set by category and age (VL-023), takes effect.

    Plate series per region, plate category, colour code and design (VL-030); the next free standard number, skipping
    the series' premium numbers, is reserved for a first registration.

    Increment 2 (ADR-059): customs/dealer certificates pre-fill vehicles (VL-002); banned vehicles (VL-006); transfer
    of ownership with both parties' consent, fines, mortgage and buyer insurance (VL-012); change of details (VL-013);
    card replacement, print and delivery (VL-014, VL-022); de-registration (VL-015); temporary entry/exit permits
    (VL-016); insurance recovery and vehicle certificates (VL-017, VL-020); public vehicle declarations and
    cash-transport security inspections (VL-018, VL-019); mortgages (VL-021); fleets (VL-026) and dealers (VL-027);
    plate reservation, auctions, sale and exchange, factory orders, loss and replacement, trial plates and retention
    (VL-033…VL-039). Every paid transaction is checked before its fee and completes on payment confirmation.

    The channel is the `X-Channel` header. Only GET/POST are used (INT-003).
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: Vehicles
  - name: Registration
  - name: Plates
  - name: Transactions
  - name: Fleets

paths:
  /v1/vehicles:
    get:
      tags: [Vehicles]
      operationId: findVehicleByPlate
      summary: The vehicle carrying an assigned plate, so a partner-state violation reaches its owner (XB-002); audited
      x-itms-permission: vehicle.read
      x-itms-scope: [region]
      parameters:
        - name: plate
          in: query
          required: true
          schema: { type: string, maxLength: 20 }
      responses:
        '200':
          description: Vehicle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Vehicles]
      operationId: createVehicle
      summary: Add a vehicle to the register (VL-001, VL-003)
      description: Refused when the VIN is malformed (422 `VIN_INVALID`, `VIN_CHECK_DIGIT`) or already active (409 `VIN_ACTIVE`).
      x-itms-permission: vehicle.create
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRequest' }
      responses:
        '201':
          description: Added
          headers:
            Location: { schema: { type: string } }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/vehicles/{vin}:
    get:
      tags: [Vehicles]
      operationId: getVehicle
      summary: A vehicle; the read is audited
      x-itms-permission: vehicle.read
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/Vin'
      responses:
        '200':
          description: Vehicle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicle' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/vehicles/{vin}/history:
    get:
      tags: [Vehicles]
      operationId: getVehicleHistory
      summary: The vehicle file's history (VL-005); the read is audited
      x-itms-permission: vehicle.read
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/Vin'
      responses:
        '200':
          description: History, oldest first
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [event, actorId, detail, at]
                      properties:
                        event: { type: string }
                        actorId: { type: string }
                        detail: { type: object }
                        at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/vehicles/{vin}/inspection-results:
    post:
      tags: [Vehicles]
      operationId: recordInspection
      summary: An inspection centre records a result (VL-025, VL-040)
      x-itms-permission: vehicle.inspection.record
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/Vin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InspectionRequest' }
      responses:
        '201':
          description: Recorded
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Inspection' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /v1/vehicles/{vin}/registrations:
    post:
      tags: [Registration]
      operationId: startFirstRegistration
      summary: Check, reserve a plate and prepare the fee of a first registration (VL-010)
      x-itms-permission: vehicle.register
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/Vin'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationRequest' }
      responses:
        '201': { $ref: '#/components/responses/Request' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/vehicles/{vin}/renewals:
    post:
      tags: [Registration]
      operationId: startRenewal
      summary: Check and prepare the fee of a renewal (VL-011, VL-024, UAT-3)
      description: |
        409 `RENEWAL_NOT_OPEN` before the window; 409 `INSURANCE_EXPIRED` (UAT-3) without a valid policy today; 409
        `INSPECTION_REQUIRED` or `INSPECTION_FAILED`; 503 `INSURANCE_UNAVAILABLE` when the insurer does not answer.
        Holds (VL-011, VF-023; ADR-058): hold-eligibility-service is asked whether a hold in force blocks the renewal
        service for the vehicle or its owner's traffic file (an unpaid violation's UNPAID_FINES hold, for example);
        if so 422 `ELIGIBILITY_BLOCKED`, with every reason and next step in `detail` and `blocks`, before any fee is
        quoted. 503 `ELIGIBILITY_UNAVAILABLE` when that cannot be checked (fail closed).
      x-itms-permission: vehicle.register
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/Vin'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationRequest' }
      responses:
        '201': { $ref: '#/components/responses/Request' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/plate-series:
    post:
      tags: [Plates]
      operationId: savePlateSeries
      summary: Create or extend a plate number series (VL-030)
      x-itms-permission: vehicle.plate.manage
      x-itms-scope: [region]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Series' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Series' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /v1/customs-certificates:
    post:
      tags: [Vehicles]
      operationId: receiveCustomsCertificate
      summary: Receive a customs clearance or dealer certificate from the feed (VL-002)
      x-itms-permission: vehicle.customs.feed
      x-itms-scope: national
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomsRequest' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomsCertificate' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/customs-certificates/{certificateNo}:
    get:
      tags: [Vehicles]
      operationId: getCustomsCertificate
      summary: Read a received certificate to pre-fill a vehicle (VL-002)
      x-itms-permission: vehicle.read
      x-itms-scope: national
      parameters:
        - { name: certificateNo, in: path, required: true, schema: { type: string, pattern: '^[A-Z0-9][A-Z0-9-]{0,59}$' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomsCertificate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '400': { $ref: '#/components/responses/Problem' }

  /v1/vehicles/{vin}/bans:
    post:
      tags: [Vehicles]
      operationId: banVehicle
      summary: Ban a vehicle from use, e.g. total loss or security order (VL-006)
      x-itms-permission: vehicle.ban.manage
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/Vin'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BanRequest' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ban' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/vehicles/{vin}/bans/{banId}/lift:
    post:
      tags: [Vehicles]
      operationId: liftVehicleBan
      summary: Lift a ban; never by who imposed it (VL-006)
      x-itms-permission: vehicle.ban.manage
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/Vin'
        - { name: banId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LiftRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ban' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/vehicles/{vin}/approvals:
    post:
      tags: [Vehicles]
      operationId: submitVehicleApproval
      summary: Submit a public vehicle declaration or cash-transport security inspection (VL-018, VL-019)
      x-itms-permission: vehicle.service
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/Vin'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalRequest' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/vehicles/{vin}/approvals/{approvalId}/decision:
    post:
      tags: [Vehicles]
      operationId: decideVehicleApproval
      summary: Approve or reject; never one's own submission (VL-018, VL-019)
      x-itms-permission: vehicle.approve
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/Vin'
        - { name: approvalId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/vehicles/{vin}/transfers:
    post:
      tags: [Transactions]
      operationId: startTransfer
      summary: Seller starts a transfer of ownership; waits for the buyer's consent (VL-012)
      x-itms-permission: vehicle.service
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/Vin'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferRequest' }
      responses:
        '201': { $ref: '#/components/responses/Request' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/vehicles/{vin}/transfers/{requestId}/consent:
    post:
      tags: [Transactions]
      operationId: consentTransfer
      summary: Buyer consents; ban, mortgage, holds and insurance are checked, then the fee is asked (VL-012)
      x-itms-permission: vehicle.service
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/Vin'
        - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/Request' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/vehicles/{vin}/changes:
    post:
      tags: [Transactions]
      operationId: startChange
      summary: Change colour, engine, body or use type after a passed inspection (VL-013)
      x-itms-permission: vehicle.service
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/Vin'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeRequest' }
      responses:
        '201': { $ref: '#/components/responses/Request' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/vehicles/{vin}/card-replacements:
    post:
      tags: [Transactions]
      operationId: replaceCard
      summary: Replace a lost or damaged registration card; the old card is cancelled (VL-014, VL-022)
      x-itms-permission: vehicle.service
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/Vin'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardRequest' }
      responses:
        '201': { $ref: '#/components/responses/Request' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/vehicles/{vin}/cards:
    get:
      tags: [Transactions]
      operationId: listCards
      summary: Registration cards and their print and delivery status (VL-022)
      x-itms-permission: vehicle.read
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/Vin'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Collection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '400': { $ref: '#/components/responses/Problem' }

  /v1/vehicles/{vin}/cards/{cardId}/status:
    post:
      tags: [Transactions]
      operationId: moveCard
      summary: 'Print centre or courier: printed, dispatched, delivered, collected (VL-022)'
      x-itms-permission: vehicle.card.manage
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/Vin'
        - { name: cardId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardStatusRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Card' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/vehicles/{vin}/deregistrations:
    post:
      tags: [Transactions]
      operationId: startDeregistration
      summary: De-register for scrap, export or total loss; plates returned or retained (VL-015)
      x-itms-permission: vehicle.service
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/Vin'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeregistrationRequest' }
      responses:
        '201': { $ref: '#/components/responses/Request' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/vehicles/{vin}/certificates:
    post:
      tags: [Transactions]
      operationId: requestVehicleCertificate
      summary: Ownership, no-objection, registration history or clearance certificate (VL-020)
      x-itms-permission: vehicle.service
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/Vin'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CertificateRequest' }
      responses:
