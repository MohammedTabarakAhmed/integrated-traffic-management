components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Vin:
      name: vin
      in: path
      required: true
      schema: { type: string, pattern: '^[A-HJ-NPR-Za-hj-npr-z0-9]{17}$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Chosen by the client, new for every intended action, and sent again unchanged on a retry (API_SPECIFICATION
        §2, ADR-032). A retry with the same key and request gets the stored response, marked `Idempotent-Replayed`.
      schema: { type: string, pattern: '^[A-Za-z0-9._:-]{8,128}$' }

  headers:
    IdempotentReplayed:
      description: '`true` when the response is the stored response of an earlier request with the same Idempotency-Key'
      schema: { type: string, enum: ['true'] }

  responses:
    Unauthorized:
      description: Missing or invalid bearer token
    Problem:
      description: Problem details (RFC 9457, API_SPECIFICATION §3)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Request:
      description: Checks passed; pay the payable to complete
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [id, kind, status, amountMinor, createdAt]
            properties:
              id: { type: string, format: uuid }
              kind:
                type: string
                enum: [FIRST, RENEWAL, TRANSFER, CHANGE, CARD, DEREGISTER, CERTIFICATE, TEMP_PERMIT, PLATE_RESERVATION,
                       PLATE_RETENTION, PLATE_SALE, PLATE_EXCHANGE, PLATE_REPLACEMENT, TRIAL_PLATE, AUCTION]
              status: { type: string, enum: [AWAITING_CONSENT, AWAITING_PAYMENT, COMPLETED, CANCELLED] }
              payableId: { oneOf: [ { type: string, format: uuid }, { type: 'null' } ] }
              amountMinor: { type: integer }
              currency: { oneOf: [ { type: string }, { type: 'null' } ] }
              newExpiry: { oneOf: [ { type: string, format: date }, { type: 'null' } ] }
              createdAt: { type: string, format: date-time }
              details: { type: object, additionalProperties: { type: string } }
              payerFileNumber: { oneOf: [ { type: string }, { type: 'null' } ] }

  schemas:
    Code:
      type: string
      pattern: '^[A-Z0-9][A-Z0-9_]{0,39}$'
    Ref:
      type: string
      pattern: '^[A-Z0-9][A-Z0-9-]{0,59}$'
    Spec:
      type: object
      additionalProperties: false
      required: [engineNo, make, model, modelYear, bodyType, colours, fuelType, steering, seats, emptyWeightKg,
                 grossWeightKg, axles, cylinders, category]
      properties:
        engineNo: { type: string, pattern: '^[A-Z0-9-]{1,40}$' }
        make: { $ref: '#/components/schemas/Code' }
        model: { $ref: '#/components/schemas/Code' }
        modelYear: { type: integer, minimum: 1886, maximum: 2100 }
        bodyType: { $ref: '#/components/schemas/Code' }
        colours: { type: array, minItems: 1, maxItems: 3, items: { $ref: '#/components/schemas/Code' } }
        fuelType: { $ref: '#/components/schemas/Code' }
        steering: { type: string, enum: [LEFT, RIGHT] }
        seats: { type: integer, minimum: 0, maximum: 200 }
        emptyWeightKg: { type: integer, minimum: 1 }
        grossWeightKg: { type: integer, minimum: 1, maximum: 200000 }
        axles: { type: integer, minimum: 1, maximum: 20 }
        cylinders: { type: integer, minimum: 0, maximum: 32 }
        category: { $ref: '#/components/schemas/Code' }
        engineCapacityCc:
          oneOf: [ { type: integer, minimum: 1, maximum: 20000 }, { type: 'null' } ]
        origin:
          oneOf: [ { type: string, pattern: '^[A-Za-z][A-Za-z ]{1,39}$' }, { type: 'null' } ]
    CreateRequest:
      type: object
      additionalProperties: false
      description: vin and spec may be left out when customsCertificateNo pre-fills them (VL-002).
      required: [ownerFileNumber, region]
      properties:
        vin: { oneOf: [ { type: string, pattern: '^[A-HJ-NPR-Za-hj-npr-z0-9]{17}$' }, { type: 'null' } ] }
        spec: { oneOf: [ { $ref: '#/components/schemas/Spec' }, { type: 'null' } ] }
        ownerFileNumber: { $ref: '#/components/schemas/Ref' }
        region: { $ref: '#/components/schemas/Code' }
        customsCertificateNo: { oneOf: [ { $ref: '#/components/schemas/Ref' }, { type: 'null' } ] }
    Vehicle:
      type: object
      additionalProperties: false
      required: [vin, spec, ownerFileNumber, region, status, registrationValid, createdAt]
      properties:
        vin: { type: string }
        spec: { $ref: '#/components/schemas/Spec' }
        ownerFileNumber: { type: string }
        region: { type: string }
        status: { type: string, enum: [UNREGISTERED, REGISTERED, DEREGISTERED] }
        registrationValid: { type: boolean }
        registrationExpiry: { oneOf: [ { type: string, format: date }, { type: 'null' } ] }
        plateNumber: { oneOf: [ { type: string }, { type: 'null' } ] }
        createdAt: { type: string, format: date-time }
    InspectionRequest:
      type: object
      additionalProperties: false
      required: [centreCode, inspectedOn, odometerKm, passed]
      properties:
        centreCode: { $ref: '#/components/schemas/Code' }
        inspectedOn: { type: string, format: date }
        odometerKm: { type: integer, minimum: 0, maximum: 10000000 }
        results:
          oneOf:
            - type: object
              maxProperties: 50
              propertyNames: { pattern: '^[A-Z0-9][A-Z0-9_]{0,39}$' }
              additionalProperties: { type: string, enum: [PASS, FAIL, ADVISORY] }
            - type: 'null'
        passed: { type: boolean }
        photoDocumentIds:
          oneOf:
            - { type: array, maxItems: 30, items: { type: string, pattern: '^[A-Za-z0-9-]{1,64}$' } }
            - { type: 'null' }
    Inspection:
      type: object
      additionalProperties: false
      required: [id, centreCode, inspectedOn, odometerKm, results, passed, photoDocumentIds, recordedAt]
      properties:
        id: { type: string, format: uuid }
        centreCode: { type: string }
        inspectedOn: { type: string, format: date }
        odometerKm: { type: integer }
        results: { type: object, additionalProperties: { type: string } }
        passed: { type: boolean }
        photoDocumentIds: { type: array, items: { type: string } }
        recordedAt: { type: string, format: date-time }
    RegistrationRequest:
      type: object
      additionalProperties: false
      required: [customerCategory]
      properties:
        customerCategory: { $ref: '#/components/schemas/Code' }
        plateId:
          description: First registration only, the owner's own retained number (VL-035)
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
        cardDelivery: { oneOf: [ { type: string, enum: [CENTRE, COURIER, DIGITAL] }, { type: 'null' } ] }
        deliveryAddress: { oneOf: [ { type: string, maxLength: 300 }, { type: 'null' } ] }
    Series:
      type: object
      additionalProperties: false
      required: [code, region, plateCategory, colourCode, design, prefix, firstNumber, lastNumber, active]
      properties:
        code: { $ref: '#/components/schemas/Code' }
        region: { $ref: '#/components/schemas/Code' }
        plateCategory: { $ref: '#/components/schemas/Code' }
        colourCode: { $ref: '#/components/schemas/Code' }
        design: { $ref: '#/components/schemas/Code' }
        prefix: { type: string, pattern: '^[A-Z0-9]{0,5}$' }
        firstNumber: { type: integer, minimum: 1 }
        lastNumber: { type: integer, maximum: 99999999 }
        premiumPattern: { oneOf: [ { type: string, maxLength: 200 }, { type: 'null' } ] }
        active: { type: boolean }
    CustomsRequest:
      type: object
      additionalProperties: false
      required: [certificateNo, source, issuerCode, vin, spec, issuedOn]
      properties:
        certificateNo: { $ref: '#/components/schemas/Ref' }
        source: { type: string, enum: [CUSTOMS, DEALER] }
        issuerCode: { $ref: '#/components/schemas/Code' }
        vin: { type: string, pattern: '^[A-HJ-NPR-Za-hj-npr-z0-9]{17}$' }
        spec: { $ref: '#/components/schemas/Spec' }
        issuedOn: { type: string, format: date }
    CustomsCertificate:
      type: object
      properties:
        certificateNo: { type: string }
        source: { type: string }
        issuerCode: { type: string }
        vin: { type: string }
        spec: { $ref: '#/components/schemas/Spec' }
        issuedOn: { type: string, format: date }
        used: { type: boolean }
    BanRequest:
      type: object
      additionalProperties: false
      required: [reasonCode, reference]
      properties:
        reasonCode: { $ref: '#/components/schemas/Code' }
        reference: { $ref: '#/components/schemas/Ref' }
    LiftRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    ApprovalRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [PUBLIC_DECLARATION, SECURITY_INSPECTION] }
        detail:
          oneOf:
            - type: object
              maxProperties: 30
              propertyNames: { pattern: '^[a-zA-Z][a-zA-Z0-9]{0,39}$' }
              additionalProperties: { type: string, maxLength: 500 }
            - type: 'null'
    DecisionRequest:
      type: object
      additionalProperties: false
      required: [approve]
      properties:
        approve: { type: boolean }
        note: { oneOf: [ { type: string, maxLength: 500 }, { type: 'null' } ] }
    TransferRequest:
      type: object
      additionalProperties: false
      required: [buyerFileNumber, buyerAcceptsFines, sellerRetainsPlate, customerCategory]
      properties:
        buyerFileNumber: { $ref: '#/components/schemas/Ref' }
        buyerAcceptsFines: { type: boolean }
        sellerRetainsPlate: { type: boolean }
        customerCategory: { $ref: '#/components/schemas/Code' }
    ChangeRequest:
      type: object
      additionalProperties: false
      required: [customerCategory]
      properties:
        colours: { oneOf: [ { type: array, minItems: 1, maxItems: 3, items: { $ref: '#/components/schemas/Code' } }, { type: 'null' } ] }
        engineNo: { oneOf: [ { type: string, pattern: '^[A-Z0-9-]{1,40}$' }, { type: 'null' } ] }
        bodyType: { oneOf: [ { $ref: '#/components/schemas/Code' }, { type: 'null' } ] }
        category: { oneOf: [ { $ref: '#/components/schemas/Code' }, { type: 'null' } ] }
        customerCategory: { $ref: '#/components/schemas/Code' }
    CardRequest:
      type: object
      additionalProperties: false
      required: [reason, delivery, customerCategory]
      properties:
        reason: { type: string, enum: [LOST, DAMAGED] }
        delivery: { type: string, enum: [CENTRE, COURIER, DIGITAL] }
        address: { oneOf: [ { type: string, maxLength: 300 }, { type: 'null' } ] }
        customerCategory: { $ref: '#/components/schemas/Code' }
    CardStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [PRINTED, DISPATCHED, DELIVERED, COLLECTED, CANCELLED] }
        trackingRef: { oneOf: [ { type: string, pattern: '^[A-Za-z0-9-]{1,60}$' }, { type: 'null' } ] }
    DeregistrationRequest:
      type: object
      additionalProperties: false
      required: [reason, retainPlate, customerCategory]
      properties:
        reason: { type: string, enum: [SCRAP, EXPORT, TOTAL_LOSS] }
        retainPlate: { type: boolean }
        destinationCountry: { oneOf: [ { type: string, pattern: '^[A-Z]{3}$' }, { type: 'null' } ] }
        customerCategory: { $ref: '#/components/schemas/Code' }
    CertificateRequest:
      type: object
      additionalProperties: false
      required: [kind, customerCategory]
      properties:
        kind: { type: string, enum: [OWNERSHIP, NO_OBJECTION, REGISTRATION_HISTORY, CLEARANCE] }
        customerCategory: { $ref: '#/components/schemas/Code' }
    RecoveryRequest:
      type: object
      additionalProperties: false
      required: [insurerCode, claimRef, reason]
      properties:
        insurerCode: { $ref: '#/components/schemas/Code' }
        claimRef: { $ref: '#/components/schemas/Ref' }
        reason: { type: string, enum: [TOTAL_LOSS, THEFT] }
    EntryRequest:
      type: object
      additionalProperties: false
      required: [vin, foreignPlate, country, holderFileNumber, borderPoint, validFrom, validTo, region, customerCategory]
      properties:
        vin: { type: string, pattern: '^[A-HJ-NPR-Za-hj-npr-z0-9]{17}$' }
        foreignPlate: { type: string, pattern: '^[A-Z0-9 -]{1,20}$' }
        country: { type: string, pattern: '^[A-Z]{3}$' }
        holderFileNumber: { $ref: '#/components/schemas/Ref' }
        borderPoint: { $ref: '#/components/schemas/Code' }
        validFrom: { type: string, format: date }
        validTo: { type: string, format: date }
        region: { $ref: '#/components/schemas/Code' }
        customerCategory: { $ref: '#/components/schemas/Code' }
    ExitRequest:
      type: object
      additionalProperties: false
      required: [country, borderPoint, validFrom, validTo, customerCategory]
      properties:
        country: { type: string, pattern: '^[A-Z]{3}$' }
        borderPoint: { $ref: '#/components/schemas/Code' }
        validFrom: { type: string, format: date }
        validTo: { type: string, format: date }
        customerCategory: { $ref: '#/components/schemas/Code' }
    MortgageRequest:
      type: object
      additionalProperties: false
      required: [bankCode, contractRef]
      properties:
        bankCode: { $ref: '#/components/schemas/Code' }
        contractRef: { $ref: '#/components/schemas/Ref' }
    MortgageConsentRequest:
      type: object
      additionalProperties: false
      required: [transferId]
      properties:
        transferId: { type: string, format: uuid }
    BulkRequest:
      type: object
      additionalProperties: false
      required: [vins, customerCategory]
      properties:
        vins: { type: array, minItems: 1, maxItems: 200, items: { type: string, pattern: '^[A-HJ-NPR-Za-hj-npr-z0-9]{17}$' } }
        customerCategory: { $ref: '#/components/schemas/Code' }
    AssignmentRequest:
      type: object
      additionalProperties: false
      required: [vin, driverFileNumber]
      properties:
        vin: { type: string, pattern: '^[A-HJ-NPR-Za-hj-npr-z0-9]{17}$' }
        driverFileNumber: { $ref: '#/components/schemas/Ref' }
        validFrom: { oneOf: [ { type: string, format: date }, { type: 'null' } ] }
        validTo: { oneOf: [ { type: string, format: date }, { type: 'null' } ] }
    HandoverRequest:
      type: object
      additionalProperties: false
      required: [vin, buyerFileNumber]
      properties:
        vin: { type: string, pattern: '^[A-HJ-NPR-Za-hj-npr-z0-9]{17}$' }
        buyerFileNumber: { $ref: '#/components/schemas/Ref' }
    ReservationRequest:
      type: object
      additionalProperties: false
      required: [seriesCode, number, holderFileNumber, customerCategory]
      properties:
        seriesCode: { $ref: '#/components/schemas/Code' }
        number: { type: integer, minimum: 1 }
        holderFileNumber: { $ref: '#/components/schemas/Ref' }
        customerCategory: { $ref: '#/components/schemas/Code' }
    CategoryRequest:
      type: object
      additionalProperties: false
      required: [customerCategory]
      properties:
        customerCategory: { $ref: '#/components/schemas/Code' }
    SaleRequest:
      type: object
      additionalProperties: false
      required: [buyerFileNumber, customerCategory]
      properties:
        buyerFileNumber: { $ref: '#/components/schemas/Ref' }
        customerCategory: { $ref: '#/components/schemas/Code' }
    ExchangeRequest:
      type: object
      additionalProperties: false
      required: [plateId, customerCategory]
      properties:
        plateId: { type: string, format: uuid }
        customerCategory: { $ref: '#/components/schemas/Code' }
    LossRequest:
      type: object
      additionalProperties: false
      required: [kind, policeReference, replacement, customerCategory]
      properties:
        kind: { type: string, enum: [LOST, STOLEN] }
        policeReference: { $ref: '#/components/schemas/Ref' }
        replacement: { type: string, enum: [SAME, NEW] }
        customerCategory: { $ref: '#/components/schemas/Code' }
    AuctionRequest:
      type: object
      additionalProperties: false
      required: [title, salesChannel, startsAt, endsAt, region, lots]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        salesChannel: { type: string, enum: [ONLINE, PARTNER] }
        partnerCode: { oneOf: [ { $ref: '#/components/schemas/Code' }, { type: 'null' } ] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        region: { $ref: '#/components/schemas/Code' }
        lots:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [seriesCode, number, reserveMinor]
            properties:
              seriesCode: { $ref: '#/components/schemas/Code' }
              number: { type: integer, minimum: 1 }
              reserveMinor: { type: integer, minimum: 0 }
    BidRequest:
      type: object
      additionalProperties: false
      required: [plateId, bidderFileNumber, amountMinor]
      properties:
        plateId: { type: string, format: uuid }
        bidderFileNumber: { $ref: '#/components/schemas/Ref' }
        amountMinor: { type: integer, minimum: 1 }
    OrderRequest:
      type: object
      additionalProperties: false
      required: [factoryCode]
      properties:
        factoryCode: { $ref: '#/components/schemas/Code' }
    FactoryRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [IN_PRODUCTION, DELIVERED, CANCELLED] }
        serials:
          oneOf:
            - type: object
              maxProperties: 500
              propertyNames: { pattern: '^[0-9a-f-]{36}$' }
              additionalProperties: { type: string, pattern: '^[A-Z0-9-]{1,40}$' }
            - type: 'null'
    TrialRequest:
      type: object
      additionalProperties: false
      required: [dealerFileNumber, region, days, customerCategory]
      properties:
        dealerFileNumber: { $ref: '#/components/schemas/Ref' }
        region: { $ref: '#/components/schemas/Code' }
        days: { type: integer, minimum: 1, maximum: 366 }
        customerCategory: { $ref: '#/components/schemas/Code' }
    Ban:
      type: object
      description: 'A ban on the vehicle (VL-006)'
    Approval:
      type: object
      description: 'An approval (VL-018, VL-019)'
    Card:
      type: object
      description: 'A registration card (VL-022)'
    Certificate:
      type: object
      description: 'An issued certificate (VL-020)'
    Permit:
      type: object
      description: 'A temporary permit (VL-016)'
    Mortgage:
      type: object
      description: 'A mortgage (VL-021)'
    FileRecords:
      type: object
      description: 'bans, approvals, mortgages, cards, certificates (VL-005)'
    Assignment:
      type: object
      description: 'A driver assignment (VL-026)'
    Plate:
      type: object
      description: 'A plate number (VL-031)'
    AuctionView:
      type: object
      description: 'auction, lots and highestBids (VL-034)'
    Bid:
      type: object
      description: 'A bid (VL-034)'
    OrderView:
      type: object
      description: 'order and items with serial numbers (VL-036)'
    Trial:
      type: object
      description: 'A trial plate (VL-038)'
    Collection:
      type: object
      description: 'items: a list'
      properties:
        items: { type: array, items: { type: object } }
    Problem:
      type: object
      required: [status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        instance: { type: string }
        correlationId: { type: string }
        requirementRefs: { type: array, items: { type: string } }
        errors: { type: array, items: { type: object } }
        nextStep:
          type: string
          description: '`ELIGIBILITY_BLOCKED` only (VL-011): the next step of the first reason, as a code'
        blocks:
          type: array
          description: '`ELIGIBILITY_BLOCKED` only (VL-011): every reason the renewal is blocked, as the customer may see it'
          items:
            type: object
            additionalProperties: false
            required: [reasonCode, nextStep, message]
            properties:
              reasonCode: { type: string, description: 'A disclosed hold type code, or `RESTRICTED`' }
              nextStep: { type: string }
              message: { type: string }
