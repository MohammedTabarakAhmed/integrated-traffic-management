# violation-service configuration. All environment-specific values come from environment variables
# (NFR-042, SEC-004); nothing secret is stored here.
spring:
  application:
    name: violation-service
  # Secrets arrive as files, one per property, named after it (SEC-004, ADR-038): mounted by the platform
  # (Kubernetes secrets from the secret store; compose secrets locally), never as environment variables.
  config:
    import: "optional:configtree:${ITMS_SECRETS_DIR:/run/secrets/}"
  datasource:
    url: ${VIO_DB_URL}
    username: ${VIO_DB_USER:}
    password: ${VIO_DB_PASSWORD:}
  flyway:
    locations: classpath:db/platform,classpath:db/migration
    # Platform migrations (db/platform, V0_x) can be added after the service's own; apply them out of order
    # (ADR-040). Each is additive and touches only platform tables.
    out-of-order: true
  # Message broker (INT-005, ADR-002). Producer defaults are kept: acks=all and idempotence on.
  kafka:
    bootstrap-servers: ${ITMS_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  messages:
    basename: messages
    fallback-to-system-locale: false
  threads:
    virtual:
      enabled: true

itms:
  # Domain events and audit records leave through the transactional outbox (INT-005, CC-120, ADR-040). Off by default
  # so the service runs without a broker; rows wait in the outbox until the relay is switched on.
  events:
    enabled: ${ITMS_EVENTS_ENABLED:false}
    audit-topic: ${ITMS_EVENTS_AUDIT_TOPIC:itms.audit.v1}
    domain-topic: ${ITMS_EVENTS_DOMAIN_TOPIC:}
    batch-size: ${ITMS_EVENTS_BATCH_SIZE:100}
    send-timeout: ${ITMS_EVENTS_SEND_TIMEOUT:10s}
    relay-interval: ${ITMS_EVENTS_RELAY_INTERVAL:1s}
  security:
    issuer: ${ITMS_OIDC_ISSUER}
    jwk-set-uri: ${ITMS_OIDC_JWKS_URI}
    audience: itms-api
    # Grants come from iam-service (ADR-022). token-claims is the interim ADR-018 mode, for tests only.
    authorisation-source: ${ITMS_AUTHORISATION_SOURCE:iam}
    iam:
      base-url: ${ITMS_IAM_URL:}
      cache-ttl: ${ITMS_IAM_CACHE_TTL:60s}
  # Violations and black points (VF-*; ADR-056). BRD defaults: points expire after 12 months, suspension at 24 points
  # for 3, 6, then 12 months, warnings at 12 and 18 points.
  violations:
    points-expiry-months: ${ITMS_VIOLATIONS_POINTS_EXPIRY_MONTHS:12}
    suspension-threshold: ${ITMS_VIOLATIONS_SUSPENSION_THRESHOLD:24}
    suspension-months: ${ITMS_VIOLATIONS_SUSPENSION_MONTHS:3,6,12}
    warning-thresholds: ${ITMS_VIOLATIONS_WARNING_THRESHOLDS:12,18}
    cancel-reasons: ${ITMS_VIOLATIONS_CANCEL_REASONS:WRONG_PLATE,DEVICE_FAULT,DUPLICATE,OBJECTION_ACCEPTED,COURT_ORDER}
    currency: ${ITMS_VIOLATIONS_CURRENCY:XTS}
    zone: ${ITMS_VIOLATIONS_ZONE:UTC}
    max-report-delay: ${ITMS_VIOLATIONS_MAX_REPORT_DELAY:30d}
    suspension-blocked-services: ${ITMS_VIOLATIONS_SUSPENSION_BLOCKED_SERVICES:*}
    suspension-liftable-by-roles: ${ITMS_VIOLATIONS_SUSPENSION_LIFTABLE_BY:HOLD_SUPERVISOR}
    # VF-023 (ADR-058, Q-074 interim): an open violation older than unpaid-hold-after places an UNPAID_FINES hold on the
    # vehicle (or the driver's file), blocking these services; lifted when paid or cancelled. Durations are ISO-8601.
    unpaid-hold-enabled: ${ITMS_VIOLATIONS_UNPAID_HOLD_ENABLED:true}
    unpaid-hold-after: ${ITMS_VIOLATIONS_UNPAID_HOLD_AFTER:P60D}
    unpaid-hold-interval: ${ITMS_VIOLATIONS_UNPAID_HOLD_INTERVAL:PT1H}
    unpaid-hold-initial-delay: ${ITMS_VIOLATIONS_UNPAID_HOLD_INITIAL_DELAY:PT1M}
    unpaid-hold-batch-size: ${ITMS_VIOLATIONS_UNPAID_HOLD_BATCH_SIZE:100}
    unpaid-hold-blocked-services: ${ITMS_VIOLATIONS_UNPAID_HOLD_BLOCKED_SERVICES:VEH_RENEWAL}
    unpaid-hold-liftable-by-roles: ${ITMS_VIOLATIONS_UNPAID_HOLD_LIFTABLE_BY:UNPAID_FINE_HOLD_MANAGER,HOLD_SUPERVISOR}
    objection-window: ${ITMS_VIOLATIONS_OBJECTION_WINDOW:30d}
    consumer-enabled: ${ITMS_VIOLATIONS_CONSUMER_ENABLED:false}
    payment-topic: ${ITMS_VIOLATIONS_PAYMENT_TOPIC:itms.payment-service.events.v1}
    # Increment 9: partner-state violations, payments abroad, forwarded objections and decisions (XB-002..XB-005).
    crossborder-topic: ${ITMS_VIOLATIONS_CROSSBORDER_TOPIC:itms.crossborder-service.events.v1}
    crossborder:
      accepted-objection-reason: ${ITMS_VIOLATIONS_XB_ACCEPTED_OBJECTION_REASON:OBJECTION_ACCEPTED}
      beneficiary: ${ITMS_VIOLATIONS_XB_BENEFICIARY:CROSSBORDER_SETTLEMENT}
  # Calls to other services with this service's own client-credentials account (ADR-034).
  clients:
    payments:
      base-url: ${ITMS_PAYMENTS_URL:http://localhost:8094}
      token-uri: ${ITMS_OIDC_TOKEN_URI:http://localhost:8180/realms/itms/protocol/openid-connect/token}
      client-id: ${ITMS_SERVICE_CLIENT_ID:itms-violation-service}
      client-secret: ${ITMS_SERVICE_CLIENT_SECRET:}
      timeout: ${ITMS_PAYMENTS_TIMEOUT:3s}
    vehicles:
      base-url: ${ITMS_VEHICLES_URL:http://localhost:8095}
      token-uri: ${ITMS_OIDC_TOKEN_URI:http://localhost:8180/realms/itms/protocol/openid-connect/token}
      client-id: ${ITMS_SERVICE_CLIENT_ID:itms-violation-service}
      client-secret: ${ITMS_SERVICE_CLIENT_SECRET:}
      timeout: ${ITMS_VEHICLES_TIMEOUT:3s}
    holds:
      base-url: ${ITMS_HOLDS_URL:http://localhost:8084}
      token-uri: ${ITMS_OIDC_TOKEN_URI:http://localhost:8180/realms/itms/protocol/openid-connect/token}
      client-id: ${ITMS_SERVICE_CLIENT_ID:itms-violation-service}
      client-secret: ${ITMS_SERVICE_CLIENT_SECRET:}
      timeout: ${ITMS_HOLDS_TIMEOUT:3s}
  # API_SPECIFICATION §2, ADR-032: recording, cancelling and publishing need an Idempotency-Key.
  idempotency:
    enabled: true
    paths:
      - /v1/violation-books
      - /v1/violation-books/*/entries
      - /v1/violation-books/*/reconciliation
      - /v1/violation-books/*/losses
      - /v1/violations
      - /v1/violations/*/cancellations
      - /v1/violation-catalogue
      - /v1/violations/*/objections
      - /v1/objections/*/decisions
    retention: ${ITMS_IDEMPOTENCY_RETENTION:24h}
    lock-timeout: ${ITMS_IDEMPOTENCY_LOCK_TIMEOUT:30s}
    cleanup-interval: ${ITMS_IDEMPOTENCY_CLEANUP_INTERVAL:15m}
    cleanup-batch-size: ${ITMS_IDEMPOTENCY_CLEANUP_BATCH_SIZE:500}

# Observability (NFR-040, ADR-037). Probes and the Prometheus scrape are served on a separate management port, reached
# only from the operations network; on that port they need no token (ManagementRequests). Traces and logs go to an
# OpenTelemetry collector only when its endpoints are set, for example
# MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://otel-collector:4318/v1/traces and
# MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT=http://otel-collector:4318/v1/logs.
management:
  server:
    port: ${ITMS_MANAGEMENT_PORT:8090}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
  tracing:
    sampling:
      probability: ${ITMS_TRACING_SAMPLING_PROBABILITY:0.1}

server:
  error:
    include-stacktrace: never
    include-message: never

# Log levels are set per service (NFR-040): ITMS_LOG_LEVEL for ITMS code, ITMS_LOG_LEVEL_ROOT for everything else.
logging:
  level:
    root: ${ITMS_LOG_LEVEL_ROOT:INFO}
    gov.itms: ${ITMS_LOG_LEVEL:INFO}
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
    correlation: "[%X{traceId:-},%X{spanId:-}] "
