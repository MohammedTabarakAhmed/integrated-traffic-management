openapi: 3.1.0
info:
  title: ITMS Violation Service
  version: 1.0.0
  description: |
    Violations, fines and black points — the Increment 1 core (ADR-056).

    Catalogue (VF-001..VF-004): entries are published as versions with effective dates and optional regional
    variants; a violation uses the version in force on its date (the regional variant first). Speed violations have
    bands with their own fine and points; a repeat within the configured days uses the repeat fine.

    Recording (VF-014, VF-015, VF-070): officers and devices record violations. The responsible party is the identified
    driver, otherwise the registered owner. The fine is registered as a payable at payment-service and the responsible
    party is notified through the event `itms.violation.recorded`. When payment-service confirms a payment the
    violation becomes PAID (UAT-4); a cancelled receipt makes it OPEN again.

    Black points (VF-030..VF-033, UAT-1): points go to the responsible traffic file and expire after the configured
    months (default 12). Crossing a warning threshold (default 12, 18) emits `itms.violation.points-warning`. Reaching
    the suspension threshold (default 24) suspends the licence for the period of that ordinal (default 3, 6, 12 months)
    from the day the violation is recorded, places a hold on licence services at hold-eligibility-service and emits
    `itms.violation.licence-suspended` (SMS and app notification through notification-service).

    Cancellation (VF-021) needs `violation.cancel` and a reason code from the configured list. Every status change is
    audited (VF-020). The channel is the `X-Channel` header. Only GET/POST are used (INT-003).
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: Catalogue
  - name: Violations
  - name: Black points

paths:
  /v1/me/instalment-plans:
    post:
      tags: [Violations]
      operationId: requestOwnInstalmentPlan
      summary: The signed-in customer asks online for an own instalment plan for their own violations (VF-071, ADR-067 d)
      description: |
        For customer tokens only. The rules of `POST /v1/instalment-plans` apply (open, payable, not under objection,
        not cross-border, in no other plan, configured minimum total and month range). The violations must be the
        customer's own (their traffic file, from the token); any other number answers 404 `VIOLATION_NOT_FOUND`. The
        plan is kept in the region of the earliest of its violations (interim, Q-086). 503 `TRAFFIC_FILES_UNAVAILABLE`.
      x-itms-permission: customer.instalment.request
      x-itms-scope: [own]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [violationNumbers, months]
              properties:
                violationNumbers: { type: array, minItems: 1, maxItems: 50, items: { type: string, maxLength: 30 } }
                months: { type: integer, minimum: 1, maximum: 60 }
      responses:
        '201': { description: Plan opened, content: { application/json: { schema: { $ref: '#/components/schemas/InstalmentPlan' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    get:
      tags: [Violations]
      operationId: listOwnInstalmentPlans
      summary: The signed-in customer's own instalment plans, newest first (VF-071, ADR-067 d; audited)
      x-itms-permission: customer.violation.read
      x-itms-scope: [own]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Plans
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/InstalmentPlan' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/instalment-plans:
    post:
      tags: [Violations]
      summary: Open an own instalment plan for open violations of one traffic file (VF-071, VF-073)
      description: |
        The violations must be OPEN, charged to `fileNumber`, payable, not under objection, not cross-border and in no
        other plan; their total (reduced fines count at the reduced amount) must reach the configured minimum
        (`INSTALMENT_TOTAL_TOO_LOW`) and `months` lie in the configured range (`INSTALMENT_MONTHS_INVALID`). Their
        payables are cancelled and one VIOLATION payable per monthly instalment is registered at payment-service with
        item reference `<plan number>-<nn>`; the first is due one month after today. The violations stay OPEN, and
        their unpaid holds (VF-023) are lifted while the plan is ACTIVE. An instalment unpaid after its due date plus
        the grace period makes the plan LATE (`itms.violation.instalment-missed`) and the holds return; paying the
        late instalments makes it ACTIVE again. The last payment completes the plan and marks the violations PAID.
      operationId: createInstalmentPlan
      x-itms-permission: violation.instalment.create
      x-itms-scope: [region]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fileNumber, region, violationNumbers, months]
              properties:
                fileNumber: { type: string, maxLength: 60 }
                region: { type: string, maxLength: 40 }
                violationNumbers: { type: array, minItems: 1, maxItems: 50, items: { type: string, maxLength: 30 } }
                months: { type: integer, minimum: 1, maximum: 60 }
      responses:
        '201': { description: Plan opened, content: { application/json: { schema: { $ref: '#/components/schemas/InstalmentPlan' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    get:
      tags: [Violations]
      summary: List a traffic file's instalment plans in the caller's regions (VF-071, CC-001)
      operationId: listInstalmentPlans
      x-itms-permission: violation.read
      x-itms-scope: [region]
      parameters:
        - { name: fileNumber, in: query, required: true, schema: { type: string, maxLength: 60 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: The file's plans, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/InstalmentPlan' } } } } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/instalment-plans/{number}:
    get:
      tags: [Violations]
      summary: Read an instalment plan with its schedule (VF-071, VF-073)
      operationId: getInstalmentPlan
      x-itms-permission: violation.read
      x-itms-scope: [region]
      parameters:
        - { name: number, in: path, required: true, schema: { type: string, pattern: '^IP-[0-9]{4}-[0-9]{9}$' } }
      responses:
        '200': { description: The plan, content: { application/json: { schema: { $ref: '#/components/schemas/InstalmentPlan' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/violation-books:
    post:
      tags: [Violations]
      summary: Issue a paper violation book to an officer (VF-013)
      operationId: issueViolationBook
      x-itms-permission: violation.book.issue
      x-itms-scope: [region]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [serial, region, officerId], properties: {serial: {type: string, maxLength: 40}, region: {type: string, maxLength: 40}, officerId: {type: string, maxLength: 100}}}
      responses:
        '201': { description: Book issued, content: { application/json: { schema: { $ref: '#/components/schemas/PaperBook' } } } }
        '400': {description: Invalid book data}
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/violation-books/{serial}/entries:
    post:
      tags: [Violations]
      summary: Link a paper report to its recorded violation (VF-013)
      operationId: enterViolationBookReport
      x-itms-permission: violation.book.record
      x-itms-scope: [region]
      parameters:
        - {name: serial, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [reportSerial, violationNumber], properties: {reportSerial: {type: string, maxLength: 40}, violationNumber: {type: string, maxLength: 30}}}
      responses:
        '200': { description: Paper report linked, content: { application/json: { schema: { $ref: '#/components/schemas/PaperBookEntry' } } } }
        '400': {description: Book entry is invalid}
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': {description: Violation or book not found}
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/violation-books/{serial}/reconciliation:
    post:
      tags: [Violations]
      summary: Reconcile paper report serials against captured entries (VF-013)
      operationId: reconcileViolationBook
      x-itms-permission: violation.book.reconcile
      x-itms-scope: [region]
      parameters:
        - {name: serial, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [reportSerials], properties: {reportSerials: {type: array, maxItems: 500, items: {type: string, maxLength: 40}}}}
      responses:
        '200': { description: Book reconciled, content: { application/json: { schema: { $ref: '#/components/schemas/PaperBook' } } } }
        '400': {description: Report serials do not match entries}
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/violation-books/{serial}/losses:
    post:
      tags: [Violations]
      summary: Report an issued paper violation book as lost (VF-013)
      operationId: reportLostViolationBook
      x-itms-permission: violation.book.issue
      x-itms-scope: [region]
      parameters:
        - {name: serial, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [reason], properties: {reason: {type: string, minLength: 1, maxLength: 500}}}
      responses:
        '200': { description: Book marked lost, content: { application/json: { schema: { $ref: '#/components/schemas/PaperBook' } } } }
        '400': {description: Book cannot be lost}
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/violation-catalogue:
    post:
      tags: [Catalogue]
      operationId: publishCatalogueEntry
      summary: Publish a new version of a catalogue entry (VF-001..VF-004)
      x-itms-permission: violation.catalogue.manage
      x-itms-scope: national
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogueEntry' }
      responses:
        '201':
          description: Published
          headers:
            Location: { schema: { type: string } }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogueEntry' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    get:
      tags: [Catalogue]
      operationId: listCatalogue
      summary: The latest version of every entry and regional variant
      x-itms-permission: authenticated
      x-itms-scope: national
      responses:
        '200': { $ref: '#/components/responses/CatalogueCollection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/violation-catalogue/{code}:
    get:
      tags: [Catalogue]
      operationId: getCatalogueVersions
      summary: Every version of one entry, newest first (VF-002)
      x-itms-permission: authenticated
      x-itms-scope: national
      parameters:
        - { name: code, in: path, required: true, schema: { $ref: '#/components/schemas/Code' } }
      responses:
        '200': { $ref: '#/components/responses/CatalogueCollection' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/violations:
    post:
      tags: [Violations]
      operationId: recordViolation
      summary: Record a violation; fine payable, black points and notification follow (VF-014, VF-015, VF-030)
      description: |
        404 `CATALOGUE_NOT_IN_FORCE`; 422 `SPEED_REQUIRED` / `SPEED_NOT_IN_BANDS` for speed entries; 503 when
        payment-service, hold-eligibility-service or rental-service does not answer (nothing is recorded).
        Responsible party (VF-014): the identified driver; otherwise, when a rental contract covered the plate at
        the time, the renter (TR-032: the company is notified by `itms.violation.transferred-to-renter`); otherwise
        the owner. A visitor renter without a traffic file leaves the owner responsible (Q-081).
      x-itms-permission: violation.record
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Report' }
      responses:
        '201':
          description: Recorded
          headers:
            Location: { schema: { type: string } }
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Violation' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    get:
      tags: [Violations]
      operationId: listViolations
      summary: Violations of a traffic file, newest first; audited
      x-itms-permission: violation.read
      x-itms-scope: national
      parameters:
        - { name: fileNumber, in: query, required: true, schema: { $ref: '#/components/schemas/Ref' } }
        - { name: status, in: query, schema: { type: string, enum: [OPEN, PAID, CANCELLED] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: Violations
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Violation' } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/violations/{number}:
    get:
      tags: [Violations]
      operationId: getViolation
      summary: A violation; the read is audited
      x-itms-permission: violation.read
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/Number'
      responses:
        '200':
          description: Violation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Violation' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/violations/{number}/cancellations:
    post:
      tags: [Violations]
      operationId: cancelViolation
      summary: A supervisor cancels an open violation with a reason code (VF-021)
      x-itms-permission: violation.cancel
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/Number'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reasonCode]
              properties:
                reasonCode: { $ref: '#/components/schemas/Code' }
                note: { oneOf: [ { type: string, minLength: 3, maxLength: 500 }, { type: 'null' } ] }
      responses:
        '200':
          description: Cancelled
          headers:
            Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Violation' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/me/violations:
    get:
      tags: [Violations]
      operationId: listOwnViolations
      summary: The signed-in customer's own violations, newest first (ADR-067 d, CH-002; audited)
      description: >-
        For customer tokens only (subject_type=CUSTOMER with a national_id claim); staff tokens get 403. The file is
        the one traffic-file-service finds for the national id in the token (the token is relayed), never a parameter.
        404 `OWN_FILE_NOT_FOUND` without a traffic file; 503 `TRAFFIC_FILES_UNAVAILABLE`.
      x-itms-permission: customer.violation.read
      x-itms-scope: [own]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [OPEN, PAID, CANCELLED] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: Violations
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Violation' } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/me/black-point-account:
    get:
      tags: [Black points]
      operationId: getOwnBlackPointAccount
      summary: The signed-in customer's active points, entries and suspensions (ADR-067 d, CH-002; audited)
      description: >-
        For customer tokens only; the file comes from the token as for `GET /v1/me/violations`.
      x-itms-permission: customer.violation.read
      x-itms-scope: [own]
      responses:
        '200':
          description: Standing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlackPointAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/black-point-accounts/{fileNumber}:
    get:
      tags: [Black points]
      operationId: getBlackPointAccount
      summary: Active points, entries and suspensions of a traffic file (VF-030..VF-032); audited
      x-itms-permission: violation.read
      x-itms-scope: national
      parameters:
        - { name: fileNumber, in: path, required: true, schema: { $ref: '#/components/schemas/Ref' } }
      responses:
        '200':
          description: Standing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlackPointAccount' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/violations/{number}/objections:
    post:
      tags: [Violations]
      operationId: submitViolationObjection
      summary: Submit a reasoned objection with evidence within the configured window (VF-050, VF-052)
      x-itms-permission: violation.objection.submit
      x-itms-scope: [region]
      parameters:
        - $ref: '#/components/parameters/Number'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reasonCode, explanation]
              properties:
                reasonCode: { $ref: '#/components/schemas/Code' }
                explanation: { type: string, minLength: 1, maxLength: 2000 }
                evidenceIds: { type: array, maxItems: 20, items: { type: string, maxLength: 64 } }
      responses:
        '201': { description: Objection submitted, content: { application/json: { schema: { $ref: '#/components/schemas/Objection' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '400': { $ref: '#/components/responses/Problem' }

  /v1/me/violations/{number}/objections:
    post:
      tags: [Violations]
      operationId: submitOwnViolationObjection
      summary: The signed-in customer objects online to their own violation (VF-050, XB-005, ADR-067 d)
      description: |
        For customer tokens only. The violation must be the customer's own (their traffic file, from the token, is the
        responsible one); any other number answers 404 `VIOLATION_NOT_FOUND`. The rules of a centre objection apply:
        422 `OBJECTION_WINDOW_CLOSED` after the configured window (default 30 days), 409 `VIOLATION_NOT_OPEN`,
        `VIOLATION_IN_INSTALMENT_PLAN` or `OBJECTION_EXISTS`. The fine is paused while the objection waits (VF-052);
        an objection to a partner-state violation is sent to that state (XB-005). 503 `TRAFFIC_FILES_UNAVAILABLE`.
      x-itms-permission: customer.violation.object
      x-itms-scope: [own]
      parameters:
        - $ref: '#/components/parameters/Number'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reasonCode, explanation]
              properties:
                reasonCode: { $ref: '#/components/schemas/Code' }
                explanation: { type: string, minLength: 1, maxLength: 2000 }
                evidenceIds: { type: array, maxItems: 20, items: { type: string, maxLength: 64 } }
      responses:
        '201': { description: Objection submitted, content: { application/json: { schema: { $ref: '#/components/schemas/Objection' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /v1/objections/queue:
    get:
      tags: [Violations]
      operationId: listPendingObjections
      summary: List objections awaiting supervisor review (VF-051)
      description: Only objections to violations in regions the caller's review grant reaches are listed (CC-001).
      x-itms-permission: violation.objection.review
      x-itms-scope: [region]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 100, minimum: 1, maximum: 500 } }
      responses:
        '200': { description: Pending objections for supervisor review, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Objection' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/objections/{id}/decisions:
    post:
      tags: [Violations]
      operationId: decideObjection
      summary: Decide or refer a pending objection (VF-051)
      description: |
        ACCEPT cancels the violation; REDUCE accepts the objection by lowering the fine to `reducedFineMinor` (above
        zero, below the fine), within the caller's `FINE_REDUCTION_AMOUNT` approval limit for the violation's region
        (CC-003; `APPROVAL_LIMIT_EXCEEDED` otherwise); the open payable is replaced at the reduced amount and the
        violation is confirmed (Q-082 a). REDUCE is refused for a cross-border violation (Q-082 b). REJECT lets the
        violation stand; REFER_TO_COURT keeps payment paused.
      x-itms-permission: violation.objection.review
      x-itms-scope: [region]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, reason]
              properties:
                decision: { type: string, enum: [ACCEPT, REDUCE, REJECT, REFER_TO_COURT] }
                reason: { type: string, minLength: 3, maxLength: 500 }
                reducedFineMinor: { type: integer, format: int64, minimum: 1, description: 'Required with REDUCE only' }
      responses:
        '200': { description: Objection decision recorded, content: { application/json: { schema: { $ref: '#/components/schemas/Objection' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '400': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Number:
      name: number
      in: path
      required: true
      schema: { type: string, pattern: '^V-[0-9]{4}-[0-9]{9}$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Chosen by the client, new for every intended action, and sent again unchanged on a retry (API_SPECIFICATION
        §2, ADR-032). A retry with the same key and request gets the stored response, marked `Idempotent-Replayed`.
      schema: { type: string, pattern: '^[A-Za-z0-9._:-]{8,128}$' }

  headers:
    IdempotentReplayed:
      description: '`true` when the response is the stored response of an earlier request with the same Idempotency-Key'
      schema: { type: string, enum: ['true'] }

  responses:
    Unauthorized:
      description: Missing or invalid bearer token
    Problem:
      description: Problem details (RFC 9457, API_SPECIFICATION §3)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    CatalogueCollection:
      description: Catalogue entries
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [items]
            properties:
              items: { type: array, items: { $ref: '#/components/schemas/CatalogueEntry' } }

  schemas:
    BlackPointAccount:
      type: object
      additionalProperties: false
      required: [fileNumber, activePoints, threshold, entries, suspensions]
      properties:
        fileNumber: { type: string }
        activePoints: { type: integer }
        threshold: { type: integer }
        activeSuspension: { oneOf: [ { $ref: '#/components/schemas/Suspension' }, { type: 'null' } ] }
        entries:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, fileNumber, violationId, points, occurredOn, expiresOn, status]
            properties:
              id: { type: string, format: uuid }
              fileNumber: { type: string }
              violationId: { type: string, format: uuid }
              points: { type: integer }
              occurredOn: { type: string, format: date }
              expiresOn: { type: string, format: date }
              status: { type: string, enum: [ACTIVE, CONSUMED, CANCELLED] }
        suspensions: { type: array, items: { $ref: '#/components/schemas/Suspension' } }
    Code:
      type: string
      pattern: '^[A-Z0-9][A-Z0-9_]{0,39}$'
    Ref:
      type: string
      pattern: '^[A-Z0-9][A-Z0-9-]{0,59}$'
    NullableCode:
      oneOf: [ { $ref: '#/components/schemas/Code' }, { type: 'null' } ]
    NullableRef:
      oneOf: [ { $ref: '#/components/schemas/Ref' }, { type: 'null' } ]
    SpeedBand:
      type: object
      additionalProperties: false
      required: [fromKmh, fineMinor, blackPoints]
      properties:
        fromKmh: { type: integer, minimum: 0 }
        toKmh: { oneOf: [ { type: integer, minimum: 1 }, { type: 'null' } ] }
        fineMinor: { type: integer, minimum: 0 }
        blackPoints: { type: integer, minimum: 0, maximum: 100 }
    CatalogueEntry:
      type: object
      additionalProperties: false
      required: [code, legalArticle, descriptionNl, descriptionEn, fineMinor, blackPoints, impoundDays, suspensionDays,
                 courtReferral, appliesTo, financialItem, beneficiary, effectiveFrom]
      properties:
        code: { $ref: '#/components/schemas/Code' }
        versionNo: { oneOf: [ { type: integer }, { type: 'null' } ] }
        region: { $ref: '#/components/schemas/NullableCode' }
        legalArticle: { type: string, maxLength: 100 }
        descriptionNl: { type: string, maxLength: 500 }
        descriptionEn: { type: string, maxLength: 500 }
        fineMinor: { type: integer, minimum: 0, maximum: 1000000000 }
        blackPoints: { type: integer, minimum: 0, maximum: 100 }
        impoundDays: { type: integer, minimum: 0, maximum: 3650 }
        suspensionDays: { type: integer, minimum: 0, maximum: 3650 }
        courtReferral: { type: boolean }
        appliesTo: { type: string, enum: [DRIVER, VEHICLE, BOTH] }
        speedBands: { oneOf: [ { type: array, maxItems: 20, items: { $ref: '#/components/schemas/SpeedBand' } }, { type: 'null' } ] }
        repeatWithinDays: { oneOf: [ { type: integer, minimum: 1, maximum: 3650 }, { type: 'null' } ] }
        repeatFineMinor: { oneOf: [ { type: integer, minimum: 0 }, { type: 'null' } ] }
        financialItem: { $ref: '#/components/schemas/Code' }
        beneficiary: { $ref: '#/components/schemas/Code' }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { oneOf: [ { type: string, format: date }, { type: 'null' } ] }
        reason: { oneOf: [ { type: string, minLength: 3, maxLength: 500 }, { type: 'null' } ] }
    Report:
      type: object
      additionalProperties: false
      required: [catalogueCode, occurredAt, region, location, source]
      properties:
        catalogueCode: { $ref: '#/components/schemas/Code' }
        occurredAt: { type: string, format: date-time }
        region: { $ref: '#/components/schemas/Code' }
        location: { type: string, maxLength: 300 }
        plate: { oneOf: [ { type: string, pattern: '^[A-Z0-9 -]{1,20}$' }, { type: 'null' } ] }
        vin: { oneOf: [ { type: string, pattern: '^[A-HJ-NPR-Z0-9]{17}$' }, { type: 'null' } ] }
        ownerFileNumber: { $ref: '#/components/schemas/NullableRef' }
        driverFileNumber: { $ref: '#/components/schemas/NullableRef' }
        speedLimitKmh: { oneOf: [ { type: integer, minimum: 5, maximum: 200 }, { type: 'null' } ] }
        measuredSpeedKmh: { oneOf: [ { type: integer, minimum: 0, maximum: 500 }, { type: 'null' } ] }
        source: { type: string, enum: [DEVICE, OFFICER] }
        deviceId: { oneOf: [ { type: string, pattern: '^[A-Z0-9][A-Z0-9_-]{0,39}$' }, { type: 'null' } ] }
        evidenceIds:
          oneOf:
            - { type: array, maxItems: 20, items: { type: string, pattern: '^[A-Za-z0-9-]{1,64}$' } }
            - { type: 'null' }
        registrationState:
          description: >-
            Partner state that registered the vehicle; the violation is then sent to that state (XB-001). PARTNER
            violations are never recorded here; they arrive by exchange (XB-002).
          oneOf: [ { type: string, pattern: '^[A-Z0-9]{2,12}$' }, { type: 'null' } ]
    InstalmentPlan:
      type: object
      required: [number, fileNumber, region, currency, totalMinor, months, graceDays, status, createdBy, createdAt,
                 violationNumbers, instalments]
      properties:
        number: { type: string }
        fileNumber: { type: string }
        region: { type: string }
        currency: { type: string }
        totalMinor: { type: integer, format: int64 }
        months: { type: integer }
        graceDays: { type: integer }
        status: { type: string, enum: [ACTIVE, LATE, COMPLETED] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        closedAt: { type: [string, 'null'], format: date-time }
        violationNumbers: { type: array, items: { type: string } }
        instalments:
          type: array
          items:
            type: object
            required: [seq, dueDate, amountMinor, itemRef, paid]
            properties:
              seq: { type: integer }
              dueDate: { type: string, format: date }
              amountMinor: { type: integer, format: int64 }
              itemRef: { type: string, description: 'Item reference of the instalment payable at payment-service' }
              paid: { type: boolean }
              paidAt: { type: [string, 'null'], format: date-time }
    Objection:
      type: object
      required: [id, violationId, violationNumber, submittedBy, submittedAt, reasonCode, explanation, evidenceIds,
                 status]
      properties:
        id: { type: string, format: uuid }
        violationId: { type: string, format: uuid }
        violationNumber: { type: string }
        submittedBy: { type: string }
        submittedAt: { type: string, format: date-time }
        reasonCode: { type: string }
        explanation: { type: string }
        evidenceIds: { type: array, items: { type: string } }
        status: { type: string, enum: [PENDING, ACCEPTED, REJECTED, COURT] }
        decidedBy: { type: [string, 'null'] }
        decidedAt: { type: [string, 'null'], format: date-time }
        decision: { type: [string, 'null'], enum: [ACCEPT, REDUCE, REJECT, REFER_TO_COURT, null] }
        decisionReason: { type: [string, 'null'] }
        reducedFineMinor: { type: [integer, 'null'], format: int64, description: 'The new fine of a REDUCE decision' }
    PaperBook:
      type: object
      required: [serial, region, officerId, status, issuedAt]
      properties:
        serial: { type: string }
        region: { type: string }
        officerId: { type: string }
        status: { type: string, enum: [ISSUED, RECONCILED, LOST] }
        issuedAt: { type: string, format: date-time }
        reconciledAt: { type: [string, 'null'], format: date-time }
        reconciledBy: { type: [string, 'null'] }
    PaperBookEntry:
      type: object
      required: [bookSerial, reportSerial, violationNumber, enteredAt]
      properties:
        bookSerial: { type: string }
        reportSerial: { type: string }
        violationNumber: { type: string }
        enteredAt: { type: string, format: date-time }
    Violation:
      type: object
      additionalProperties: false
      required: [number, catalogueCode, catalogueVersion, occurredAt, region, location, responsibleFileNumber,
                 fineMinor, blackPoints, repeat, status, evidenceIds, recordedAt]
      properties:
        number: { type: string }
        catalogueCode: { type: string }
        catalogueVersion: { type: integer }
        occurredAt: { type: string, format: date-time }
        region: { type: string }
        location: { type: string }
        plate: { oneOf: [ { type: string }, { type: 'null' } ] }
        responsibleFileNumber: { type: string }
        overKmh: { oneOf: [ { type: integer }, { type: 'null' } ] }
        fineMinor: { type: integer }
        blackPoints: { type: integer }
        repeat: { type: boolean }
        status: { type: string, enum: [OPEN, PAID, CANCELLED] }
        cancelReason: { oneOf: [ { type: string }, { type: 'null' } ] }
        evidenceIds: { type: array, items: { type: string } }
        recordedAt: { type: string, format: date-time }
        rentalContractId:
          description: >-
            The rental contract that covered the time when no driver was identified (TR-032, VF-014); the renter is
            then the responsible file. Null when no contract covered it.
          oneOf: [ { type: string, format: uuid }, { type: 'null' } ]
    Suspension:
      type: object
      additionalProperties: false
      required: [id, fileNumber, ordinal, from, until, pointsAtOrder, triggeredBy]
      properties:
        id: { type: string, format: uuid }
        fileNumber: { type: string }
        ordinal: { type: integer }
        from: { type: string, format: date }
        until: { type: string, format: date }
        pointsAtOrder: { type: integer }
        holdId: { oneOf: [ { type: string }, { type: 'null' } ] }
        triggeredBy: { type: string, format: uuid }
    Problem:
      type: object
      required: [status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        instance: { type: string }
        correlationId: { type: string }
        requirementRefs: { type: array, items: { type: string } }
        errors: { type: array, items: { type: object } }
