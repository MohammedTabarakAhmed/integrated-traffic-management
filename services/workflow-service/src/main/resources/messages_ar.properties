problem.NOT_ASSIGNEE=لا يمكن القيام بذلك إلا لمن أُسند إليه عنصر العمل. استلمه أولاً.
problem.OUTCOME_INVALID=النتيجة {0} غير ممكنة في هذه الخطوة. النتائج الممكنة: {1}.
