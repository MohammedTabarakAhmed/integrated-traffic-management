problem.NO_CUSTOMER=لا يوجد متعامل لإعادة الحالة إليه.
problem.BULK_INVALID=اختر من 1 إلى 100 عنصر عمل مختلف.
problem.NOTE_INVALID=يجب أن تكون الملاحظة من 1 إلى 4000 حرف.
problem.ATTACHMENTS_INVALID=أرفق 20 مستنداً على الأكثر.
